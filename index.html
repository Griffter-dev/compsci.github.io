 {\n      total ← total + n\n   }\n}\nDISPLAY(total)","why":"Only the even numbers (4 and 2) are added, so the total is 6.","id":"csp3-t1","kind":"mcq","type":"trace"},{"q":"What is displayed?","choices":["[10, 15, 20, 30, 40]","[15, 20, 30, 40]","[10, 20, 15, 30]","[20, 15, 30, 40]"],"a":1,"lang":"pseudo","code":"list ← [10, 20, 30]\nAPPEND(list, 40)\nINSERT(list, 2, 15)\nREMOVE(list, 1)\nDISPLAY(list)","why":"The list goes [10, 20, 30, 40] → [10, 15, 20, 30, 40] → remove index 1 (the 10) → [15, 20, 30, 40].","id":"csp3-t2","kind":"mcq","type":"trace"},{"q":"What is displayed?","choices":["2","3","4","27"],"a":1,"lang":"pseudo","code":"x ← 1\ncount ← 0\nREPEAT UNTIL (x > 20)\n{\n   x ← x * 3\n   count ← count + 1\n}\nDISPLAY(count)","why":"x goes 1 → 3 → 9 → 27. That's 3 loops, and then 27 > 20 stops the loop.","id":"csp3-t3","kind":"mcq","type":"trace"}],"bug":[{"q":"`findMax([-5, -2, -9])` returns 0 instead of −2. Click the bug.","lang":"pseudo","code":"PROCEDURE findMax(list)\n{\n   max ← 0\n   FOR EACH item IN list\n   {\n      IF (item > max)\n      {\n         max ← item\n      }\n   }\n   RETURN(max)\n}","lines":[3],"fix":"max ← list[1]","why":"Starting at 0 fails when every value is negative. Start with the first item in the list.","id":"csp3-b1","kind":"bug","type":"bug"}]},{"id":"csp4","title":"Big Idea 4: Computer Systems & Networks","lessons":[{"title":"How the Internet works","mins":10,"html":"<p><strong>Exam weight: 11–15%.</strong></p>\n<ul>\n<li>A <strong>network</strong> is a group of connected computing devices.</li>\n<li>The <strong>Internet</strong> is a network <em>of networks</em> built on open <strong>protocols</strong>, which are agreed-upon rules for sending data.</li>\n</ul>\n<h3>Packets</h3>\n<p>Data is broken into <strong>packets</strong>. Each packet carries some of the data plus <strong>metadata</strong> like the source and destination addresses. Packets can take <strong>different routes</strong> and <strong>arrive out of order</strong>. They&#39;re put back together at the destination.</p>\n<h3>Key protocols</h3>\n<table>\n<thead>\n<tr>\n<th>Protocol</th>\n<th>Job</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>IP</strong></td>\n<td>Addresses and routes packets</td>\n</tr>\n<tr>\n<td><strong>TCP</strong></td>\n<td>Reliable delivery: puts packets in order and resends lost ones</td>\n</tr>\n<tr>\n<td><strong>UDP</strong></td>\n<td>Faster but no guarantees (video calls, games)</td>\n</tr>\n<tr>\n<td><strong>HTTP / HTTPS</strong></td>\n<td>Web pages; HTTPS is encrypted</td>\n</tr>\n<tr>\n<td><strong>DNS</strong></td>\n<td>Turns names like <code>example.com</code> into IP addresses</td>\n</tr>\n</tbody></table>\n<p><strong>IPv4</strong> uses 32-bit addresses, which are running out. <strong>IPv6</strong> uses 128-bit addresses, which is vastly more.</p>\n<h3>Fault tolerance</h3>\n<p>The Internet is <strong>fault tolerant</strong> because of <strong>redundancy</strong>: there are many paths between devices. If one connection fails, data is rerouted. Redundancy costs more, but the system becomes more reliable.</p>\n<p><strong>Bandwidth</strong> is the maximum amount of data that can be sent in a fixed amount of time, usually measured in bits per second.</p>\n","text":" Exam weight: 11–15%. A network is a group of connected computing devices. The Internet is a network of networks built on open protocols , which are agreed upon rules for sending data. Packets Data is broken into packets . Each packet carries some of the data plus metadata like the source and destination addresses. Packets can take different routes and arrive out of order . They're put back together at the destination. Key protocols Protocol Job IP Addresses and routes packets TCP Reliable delivery: puts packets in order and resends lost ones UDP Faster but no guarantees (video calls, games) HTTP / HTTPS Web pages; HTTPS is encrypted DNS Turns names like example.com into IP addresses IPv4 uses 32 bit addresses, which are running out. IPv6 uses 128 bit addresses, which is vastly more. Fault tolerance The Internet is fault tolerant because of redundancy : there are many paths between devices. If one connection fails, data is rerouted. Redundancy costs more, but the system becomes more reliable. Bandwidth is the maximum amount of data that can be sent in a fixed amount of time, usually measured in bits per second.","quizzes":[]},{"title":"Parallel and distributed computing","mins":8,"html":"<ul>\n<li><strong>Sequential computing</strong> runs steps one at a time.</li>\n<li><strong>Parallel computing</strong> splits a program into parts that run at the <strong>same time</strong> on multiple processors.</li>\n<li><strong>Distributed computing</strong> uses <strong>multiple computers</strong>, often to handle problems too big for one machine.</li>\n</ul>\n<h3>Timing</h3>\n<p>The time for a parallel solution is the time of the sequential parts plus the <strong>longest</strong> of the parallel parts.</p>\n<p><strong>Speedup</strong> = sequential time ÷ parallel time.</p>\n<p>Example: tasks take 40 s, 30 s and 50 s, with 2 processors. The best split is {50} and {40, 30}, so the parallel time is <strong>70 s</strong>. Sequential time is 120 s, so the speedup is 120 ÷ 70 ≈ 1.7.</p>\n<p>Speedup is <strong>limited</strong> by any parts that must stay sequential. Adding more processors eventually stops helping.</p>\n","text":" Sequential computing runs steps one at a time. Parallel computing splits a program into parts that run at the same time on multiple processors. Distributed computing uses multiple computers , often to handle problems too big for one machine. Timing The time for a parallel solution is the time of the sequential parts plus the longest of the parallel parts. Speedup = sequential time ÷ parallel time. Example: tasks take 40 s, 30 s and 50 s, with 2 processors. The best split is {50} and {40, 30}, so the parallel time is 70 s . Sequential time is 120 s, so the speedup is 120 ÷ 70 ≈ 1.7. Speedup is limited by any parts that must stay sequential. Adding more processors eventually stops helping.","quizzes":[]}],"ex":[],"fill":[{"q":"Fill in each protocol name.","lang":"text","code":"\u00000\u0000 turns names like example.com into IP addresses.\n\u00001\u0000 puts packets back in order and resends lost ones.\n\u00002\u0000 is the encrypted version of the web protocol.","why":"DNS is the Internet's phone book, TCP handles reliable delivery, and HTTPS is HTTP plus encryption.","id":"csp4-f1","kind":"fill","title":"Internet protocols","blanks":[["DNS"],["TCP"],["HTTPS"]]}],"quiz":[{"q":"Packets from a single message arrive in a different order than they were sent. What happens?","choices":["The message is lost","They are put back in order at the destination (for example, by TCP)","The sender must send everything again","This never happens on the Internet"],"a":1,"why":"Packets can take different routes. Protocols like TCP reassemble them in the right order.","id":"csp4-q1","kind":"mcq","type":"quiz"},{"q":"What makes the Internet fault tolerant?","choices":["Every device has a backup battery","There are redundant paths, so data can be rerouted if a connection fails","All data goes through a single central server","Packets are encrypted"],"a":1,"why":"**Redundancy** (extra connections) lets the network keep working when parts of it fail.","id":"csp4-q2","kind":"mcq","type":"quiz"},{"q":"What does DNS do?","choices":["Encrypts web traffic","Translates domain names into IP addresses","Splits data into packets","Blocks malware"],"a":1,"why":"DNS acts like the Internet's phone book. It turns names like `example.com` into IP addresses.","id":"csp4-q3","kind":"mcq","type":"quiz"},{"q":"What is bandwidth?","choices":["How far data can travel","The maximum amount of data that can be sent in a fixed amount of time","The number of devices on a network","How secure a connection is"],"a":1,"why":"Bandwidth is usually measured in bits per second.","id":"csp4-q4","kind":"mcq","type":"quiz"},{"q":"Three tasks take 40, 30 and 50 seconds. With 2 processors running in parallel, what is the minimum total time?","choices":["50 s","70 s","60 s","120 s"],"a":1,"why":"The best split is {50} on one processor and {40 + 30} on the other. The longer side takes 70 seconds.","id":"csp4-q5","kind":"mcq","type":"quiz"},{"q":"Why was IPv6 created?","choices":["To make the Internet faster","IPv4 was running out of addresses; IPv6 has vastly more","To replace HTTP","To encrypt all traffic"],"a":1,"why":"IPv6 uses 128-bit addresses, compared with 32 bits for IPv4.","id":"csp4-q6","kind":"mcq","type":"quiz"}],"trace":[],"bug":[]},{"id":"csp5","title":"Big Idea 5: Impact of Computing","lessons":[{"title":"Society, bias and the digital divide","mins":9,"html":"<p><strong>Exam weight: 21–26%.</strong> Computing innovations can be <strong>beneficial and harmful at the same time</strong>, sometimes in ways their creators never intended.</p>\n<h3>The digital divide</h3>\n<p>The <strong>digital divide</strong> is the gap between people who have access to computing devices and the Internet and people who don&#39;t. It&#39;s affected by income, location (rural or urban) and infrastructure. Governments, schools and companies can all help close it.</p>\n<h3>Computing bias</h3>\n<p>Algorithms can reflect human bias. Usually this happens through <strong>biased training data</strong>. For example, a face-recognition system trained mostly on one group may work worse for others. Diverse data and diverse teams help reduce bias.</p>\n<h3>Crowdsourcing and citizen science</h3>\n<p><strong>Crowdsourcing</strong> gets input or services from many people online. Wikipedia and crowdfunding are examples. In <strong>citizen science</strong>, ordinary people help collect data, like bird counts or classifying galaxies.</p>\n<h3>Legal and ethical issues</h3>\n<ul>\n<li>Your original work is protected by <strong>copyright</strong>.</li>\n<li><strong>Creative Commons</strong> licenses let creators say how others can reuse their work.</li>\n<li><strong>Open source</strong> software shares its code so anyone can use and modify it.</li>\n<li>Using someone else&#39;s work without permission or credit is <strong>plagiarism</strong>, or it may be illegal.</li>\n</ul>\n","text":" Exam weight: 21–26%. Computing innovations can be beneficial and harmful at the same time , sometimes in ways their creators never intended. The digital divide The digital divide is the gap between people who have access to computing devices and the Internet and people who don't. It's affected by income, location (rural or urban) and infrastructure. Governments, schools and companies can all help close it. Computing bias Algorithms can reflect human bias. Usually this happens through biased training data . For example, a face recognition system trained mostly on one group may work worse for others. Diverse data and diverse teams help reduce bias. Crowdsourcing and citizen science Crowdsourcing gets input or services from many people online. Wikipedia and crowdfunding are examples. In citizen science , ordinary people help collect data, like bird counts or classifying galaxies. Legal and ethical issues Your original work is protected by copyright . Creative Commons licenses let creators say how others can reuse their work. Open source software shares its code so anyone can use and modify it. Using someone else's work without permission or credit is plagiarism , or it may be illegal.","quizzes":[]},{"title":"Safe computing","mins":10,"html":"<h3>Personal data</h3>\n<p><strong>PII</strong> (personally identifiable information) is information that can identify you, like your name, address, birthday, ID numbers or face. Websites track you with <strong>cookies</strong>, and once data is online it&#39;s hard to remove.</p>\n<h3>Attacks</h3>\n<ul>\n<li><strong>Phishing:</strong> a fake message tricks you into giving up information.</li>\n<li><strong>Keylogging:</strong> software records every key you press.</li>\n<li><strong>Malware / viruses:</strong> harmful software, often installed by tricking the user.</li>\n<li><strong>Rogue access point:</strong> a fake Wi-Fi network that spies on your traffic.</li>\n</ul>\n<h3>Defenses</h3>\n<ul>\n<li><strong>Strong passwords:</strong> long, unique, and stored in a password manager.</li>\n<li><strong>Multi-factor authentication (MFA):</strong> two or more of <strong>something you know</strong> (a password), <strong>something you have</strong> (a phone) and <strong>something you are</strong> (a fingerprint).</li>\n<li><strong>Encryption:</strong><ul>\n<li><strong>Symmetric</strong> encryption uses one shared key to lock and unlock.</li>\n<li><strong>Public key</strong> encryption lets anyone encrypt with your <strong>public</strong> key, but only your <strong>private</strong> key can decrypt.</li>\n</ul>\n</li>\n<li><strong>Certificate authorities</strong> vouch that a website is who it says it is. That&#39;s part of HTTPS.</li>\n<li>Keep software updated and use antivirus.</li>\n</ul>\n","text":" Personal data PII (personally identifiable information) is information that can identify you, like your name, address, birthday, ID numbers or face. Websites track you with cookies , and once data is online it's hard to remove. Attacks Phishing: a fake message tricks you into giving up information. Keylogging: software records every key you press. Malware / viruses: harmful software, often installed by tricking the user. Rogue access point: a fake Wi Fi network that spies on your traffic. Defenses Strong passwords: long, unique, and stored in a password manager. Multi factor authentication (MFA): two or more of something you know (a password), something you have (a phone) and something you are (a fingerprint). Encryption: Symmetric encryption uses one shared key to lock and unlock. Public key encryption lets anyone encrypt with your public key, but only your private key can decrypt. Certificate authorities vouch that a website is who it says it is. That's part of HTTPS. Keep software updated and use antivirus.","quizzes":[]}],"ex":[],"fill":[],"quiz":[{"q":"What is the digital divide?","choices":["The split between Windows and Mac users","Unequal access to computing devices and the Internet","The difference between analog and digital data","The gap between hardware and software"],"a":1,"why":"The digital divide is about **access**, which is affected by income, location and infrastructure.","id":"csp5-q1","kind":"mcq","type":"quiz"},{"q":"A hiring algorithm favors one group because it was trained on past hiring data. What is this an example of?","choices":["Overflow","Computing bias that comes from biased data","A syntax error","Crowdsourcing"],"a":1,"why":"If the data reflects past human bias, the algorithm learns that bias too.","id":"csp5-q2","kind":"mcq","type":"quiz"},{"q":"Sam wants to send Alex a secret message using public key encryption. Which key should Sam use to encrypt it?","choices":["Sam's private key","Alex's public key","Alex's private key","Sam's public key"],"a":1,"why":"Encrypt with the **recipient's public key**. Only Alex's private key can decrypt the message.","id":"csp5-q3","kind":"mcq","type":"quiz"},{"q":"Which of these is an example of multi-factor authentication?","choices":["A long password","Two different passwords","A password plus a code sent to your phone","A security question"],"a":2,"why":"MFA combines different *kinds* of factors, such as something you know and something you have. Two passwords are both \"something you know\".","id":"csp5-q4","kind":"mcq","type":"quiz"},{"q":"An email asks you to \"verify your account\" with a link to a fake login page. What is this?","choices":["Keylogging","Phishing","Encryption","A rogue access point"],"a":1,"why":"**Phishing** tricks people into revealing information like passwords.","id":"csp5-q5","kind":"mcq","type":"quiz"},{"q":"What do Creative Commons licenses do?","choices":["Make all content free for any use","Let creators choose how others may use and share their work","Remove copyright protection","Apply only to software"],"a":1,"why":"Creative Commons licenses let creators grant specific permissions, like \"use with credit\" or \"noncommercial only\".","id":"csp5-q6","kind":"mcq","type":"quiz"},{"q":"Which of these is an example of **citizen science**?","choices":["Volunteers report bird sightings to help researchers","A company sells user data","A scientist codes alone in a lab","Students take an online test"],"a":0,"why":"In citizen science, members of the public help collect or analyze scientific data.","id":"csp5-q7","kind":"mcq","type":"quiz"}],"trace":[],"bug":[]}]},{"id":"csa","title":"AP CS A","short":"Java","emoji":"☕","year":3,"yearLabel":"Junior","color":"#ef4444","blurb":"Java programming for the AP CS A exam. Follows the 2025–26 four-unit course: objects and methods, selection and iteration, class creation, and data collections.","units":[{"id":"csa1","title":"Unit 1: Using Objects & Methods","lessons":[{"title":"Primitive types and expressions","mins":12,"html":"<p>Java is <strong>statically typed</strong>: you declare a variable&#39;s type, and it can&#39;t change.</p>\n<pre><code class=\"language-java\">int lives = 3;            // whole numbers\ndouble price = 4.99;      // decimals\nboolean done = false;     // true / false\nfinal int MAX = 10;       // constant\n</code></pre>\n<h3>Integer division and mod</h3>\n<pre><code class=\"language-java\">7 / 2        // 3    (int / int drops the decimal)\n7 / 2.0      // 3.5  (any double makes it a double)\n7 % 2        // 1    (remainder)\n-7 / 2       // -3   (truncates toward zero)\n</code></pre>\n<h3>Casting</h3>\n<pre><code class=\"language-java\">(double) 7 / 2     // 3.5  (cast happens first, then the division)\n(double) (7 / 2)   // 3.0  (int division happens first!)\n(int) 3.99         // 3    (truncates, doesn&#39;t round)\n(int) (x + 0.5)    // rounds a positive x\n</code></pre>\n<h3>Compound assignment</h3>\n<p><code>x += 5;</code> · <code>x -= 2;</code> · <code>x *= 3;</code> · <code>x /= 2;</code> · <code>x++;</code> · <code>x--;</code></p>\n<h3>Overflow</h3>\n<p><code>int</code> values range from <code>Integer.MIN_VALUE</code> to <code>Integer.MAX_VALUE</code> (about ±2.1 billion). Going past the max <strong>wraps around</strong> to the minimum.</p>\n","text":"Java is statically typed : you declare a variable's type, and it can't change. java int lives = 3; // whole numbers double price = 4.99; // decimals boolean done = false; // true / false final int MAX = 10; // constant Integer division and mod java 7 / 2 // 3 (int / int drops the decimal) 7 / 2.0 // 3.5 (any double makes it a double) 7 % 2 // 1 (remainder) 7 / 2 // 3 (truncates toward zero) Casting java (double) 7 / 2 // 3.5 (cast happens first, then the division) (double) (7 / 2) // 3.0 (int division happens first!) (int) 3.99 // 3 (truncates, doesn't round) (int) (x + 0.5) // rounds a positive x Compound assignment x += 5; · x = 2; · x = 3; · x /= 2; · x++; · x ; Overflow int values range from Integer.MIN VALUE to Integer.MAX VALUE (about ±2.1 billion). Going past the max wraps around to the minimum.","quizzes":[]},{"title":"Objects, Strings and the Math class","mins":12,"html":"<p>An <strong>object</strong> is an instance of a <strong>class</strong>. A variable of a class type stores a <strong>reference</strong> to the object, or <code>null</code> if it points to nothing.</p>\n<pre><code class=\"language-java\">String s = &quot;AP Computer Science&quot;;\ns.length()              // 19\ns.substring(3, 11)      // &quot;Computer&quot;  (from index 3 up to, not including, 11)\ns.substring(12)         // &quot;Science&quot;\ns.indexOf(&quot;C&quot;)          // 3    (−1 if not found)\ns.equals(&quot;ap&quot;)          // false\ns.compareTo(&quot;Java&quot;)     // negative (&quot;A&quot; comes before &quot;J&quot;)\n</code></pre>\n<p>Strings are <strong>immutable</strong>: their methods return <em>new</em> strings and never change the original.</p>\n<blockquote>\n<p><strong>Compare Strings with <code>.equals()</code>, not <code>==</code>.</strong> <code>==</code> checks whether two variables point to the <strong>same object</strong>.</p>\n</blockquote>\n<h3>The Math class (static methods)</h3>\n<pre><code class=\"language-java\">Math.abs(-4)       // 4\nMath.pow(2, 10)    // 1024.0  (returns a double)\nMath.sqrt(49)      // 7.0\nMath.random()      // a double in [0.0, 1.0)\n(int) (Math.random() * 6) + 1   // a random int from 1 to 6\n</code></pre>\n<h3>Calling methods</h3>\n<ul>\n<li><strong>Static</strong> methods are called on the class: <code>Math.abs(x)</code>.</li>\n<li><strong>Instance</strong> methods are called on an object: <code>s.length()</code>.</li>\n<li>A method&#39;s <strong>signature</strong> is its name plus its parameter types. <strong>Overloaded</strong> methods share a name but have different parameter lists.</li>\n</ul>\n<p><strong>Wrapper classes:</strong> <code>Integer</code> and <code>Double</code> let primitives act like objects (for example, in an ArrayList). Java converts between them automatically, which is called <strong>autoboxing</strong> and <strong>unboxing</strong>.</p>\n","text":"An object is an instance of a class . A variable of a class type stores a reference to the object, or null if it points to nothing. java String s = \"AP Computer Science\"; s.length() // 19 s.substring(3, 11) // \"Computer\" (from index 3 up to, not including, 11) s.substring(12) // \"Science\" s.indexOf(\"C\") // 3 (−1 if not found) s.equals(\"ap\") // false s.compareTo(\"Java\") // negative (\"A\" comes before \"J\") Strings are immutable : their methods return new strings and never change the original. Compare Strings with .equals() , not == . == checks whether two variables point to the same object . The Math class (static methods) java Math.abs( 4) // 4 Math.pow(2, 10) // 1024.0 (returns a double) Math.sqrt(49) // 7.0 Math.random() // a double in [0.0, 1.0) (int) (Math.random() 6) + 1 // a random int from 1 to 6 Calling methods Static methods are called on the class: Math.abs(x) . Instance methods are called on an object: s.length() . A method's signature is its name plus its parameter types. Overloaded methods share a name but have different parameter lists. Wrapper classes: Integer and Double let primitives act like objects (for example, in an ArrayList). Java converts between them automatically, which is called autoboxing and unboxing .","quizzes":[]}],"ex":[],"fill":[{"q":"Fill in the blanks so `avg` is a real decimal average and `initial` is the first letter of `name`.","lang":"java","code":"int total = 17;\nint count = 5;\ndouble avg = \u00000\u0000 total / count;\nString initial = name.substring(0, \u00001\u0000);","why":"Casting to `(double)` first avoids int division. `substring(0, 1)` gives the first character.","id":"csa1-f1","kind":"fill","title":"Casting and Strings","blanks":[["(double)"],["1"]]},{"q":"Complete this so `roll` is a random int from 1 to 6.","lang":"java","code":"int roll = (int) (Math.random() * \u00000\u0000) + \u00001\u0000;","why":"`Math.random() * 6` is in [0, 6), casting gives 0 to 5, and `+ 1` shifts it to 1 to 6.","id":"csa1-f2","kind":"fill","title":"Roll a die","blanks":[["6"],["1"]]}],"quiz":[{"q":"What is `7 / 2` in Java?","choices":["3.5","3","4","3.0"],"a":1,"why":"Dividing an int by an int gives an int, so the decimal part is dropped.","id":"csa1-q1","kind":"mcq","type":"quiz"},{"q":"What is `(double) 7 / 2`?","choices":["3.5","3.0","3","4.0"],"a":0,"why":"The cast happens first, so 7.0 / 2 is double division, which gives 3.5.","id":"csa1-q2","kind":"mcq","type":"quiz"},{"q":"What is `(int) 3.99`?","choices":["4","3","3.99","Error"],"a":1,"why":"Casting to int **truncates**: it chops off the decimal part without rounding.","id":"csa1-q3","kind":"mcq","type":"quiz"},{"q":"What is `\"computer\".substring(3, 6)`?","choices":["\"mpu\"","\"put\"","\"pute\"","\"omp\""],"a":1,"why":"The indexes are c0 o1 m2 p3 u4 t5, so `substring(3, 6)` takes indexes 3, 4 and 5: \"put\".","id":"csa1-q4","kind":"mcq","type":"quiz"},{"q":"How should you check whether two String variables hold the same text?","choices":["`a == b`","`a.equals(b)`","`a.compareTo(b) == 1`","`a = b`"],"a":1,"why":"`==` compares references (whether they're the same object). `.equals` compares the characters.","id":"csa1-q5","kind":"mcq","type":"quiz"},{"q":"What is the range of `(int) (Math.random() * 6) + 1`?","choices":["0 to 6","0 to 5","1 to 6","1 to 7"],"a":2,"why":"`Math.random() * 6` falls in [0, 6), the int cast gives 0 to 5, and adding 1 gives 1 to 6.","id":"csa1-q6","kind":"mcq","type":"quiz"},{"q":"What is `\"apple\".compareTo(\"banana\")`?","choices":["A negative number","0","A positive number","false"],"a":0,"why":"\"apple\" comes before \"banana\" alphabetically, so the result is negative.","id":"csa1-q7","kind":"mcq","type":"quiz"},{"q":"What happens when you compute `Integer.MAX_VALUE + 1`?","choices":["An exception is thrown","It wraps around to `Integer.MIN_VALUE`","It becomes a long","It stays at MAX_VALUE"],"a":1,"why":"int overflow **wraps around** silently. No exception is thrown.","id":"csa1-q8","kind":"mcq","type":"quiz"}],"trace":[{"q":"What is printed?","choices":["3.4 2","3.0 2","3 2","3.4 3"],"a":1,"lang":"java","code":"int a = 17;\nint b = 5;\ndouble c = a / b;\nSystem.out.println(c + \" \" + a % b);","why":"`a / b` is int division, which gives 3, and storing it in a double makes 3.0. 17 % 5 is 2.","id":"csa1-t1","kind":"mcq","type":"trace"},{"q":"What is printed?","choices":["Comp18","Comp19","Compu19","C19"],"a":1,"lang":"java","code":"String s = \"AP Computer Science\";\nint i = s.indexOf(\"C\");\nSystem.out.println(s.substring(i, i + 4) + s.length());","why":"\"C\" is at index 3, `substring(3, 7)` is \"Comp\", and the string's length is 19.","id":"csa1-t2","kind":"mcq","type":"trace"}],"bug":[{"q":"This never prints \"Same!\" even though both Strings say \"java\". Click the bug.","lang":"java","code":"String a = new String(\"java\");\nString b = \"java\";\nif (a == b) {\n    System.out.println(\"Same!\");\n}","lines":[3],"fix":"if (a.equals(b)) {","why":"`new String` creates a separate object, so `==` (which checks for the same object) is false. Use `.equals`.","id":"csa1-b1","kind":"bug","type":"bug"}]},{"id":"csa2","title":"Unit 2: Selection & Iteration","lessons":[{"title":"Boolean logic and if statements","mins":11,"html":"<pre><code class=\"language-java\">if (score &gt;= 90) {\n    grade = &quot;A&quot;;\n} else if (score &gt;= 80) {\n    grade = &quot;B&quot;;\n} else {\n    grade = &quot;C&quot;;\n}\n</code></pre>\n<h3>Operators</h3>\n<ul>\n<li><strong>Logical:</strong> <code>&amp;&amp;</code> (and), <code>||</code> (or), <code>!</code> (not)</li>\n<li><strong>Relational:</strong> <code>== != &lt; &gt; &lt;= &gt;=</code></li>\n</ul>\n<h3>Short-circuit evaluation</h3>\n<ul>\n<li>In <code>a &amp;&amp; b</code>, if <code>a</code> is false, <code>b</code> is <strong>never checked</strong>.</li>\n<li>In <code>a || b</code>, if <code>a</code> is true, <code>b</code> is never checked.</li>\n</ul>\n<p>This can protect you from crashes:</p>\n<pre><code class=\"language-java\">if (x != 0 &amp;&amp; 10 / x &gt; 1)   // safe: no divide by zero when x is 0\n</code></pre>\n<h3>De Morgan&#39;s Laws</h3>\n<ul>\n<li><code>!(a &amp;&amp; b)</code> is the same as <code>!a || !b</code></li>\n<li><code>!(a || b)</code> is the same as <code>!a &amp;&amp; !b</code></li>\n</ul>\n<p>When you push the <code>!</code> inside, flip <strong>and ↔ or</strong> and negate each part. For example, <code>!(x &gt; 5)</code> becomes <code>x &lt;= 5</code>.</p>\n<h3>Comparing objects</h3>\n<p><code>==</code> checks whether two <strong>references</strong> point to the same object. <code>.equals()</code> checks whether two objects have the same <strong>content</strong>. To check for null, use <code>obj == null</code>.</p>\n","text":" java if (score = 90) { grade = \"A\"; } else if (score = 80) { grade = \"B\"; } else { grade = \"C\"; } Operators Logical: && (and), (or), ! (not) Relational: == != < <= = Short circuit evaluation In a && b , if a is false, b is never checked . In a b , if a is true, b is never checked. This can protect you from crashes: java if (x != 0 && 10 / x 1) // safe: no divide by zero when x is 0 De Morgan's Laws !(a && b) is the same as !a !b !(a b) is the same as !a && !b When you push the ! inside, flip and ↔ or and negate each part. For example, !(x 5) becomes x <= 5 . Comparing objects == checks whether two references point to the same object. .equals() checks whether two objects have the same content . To check for null, use obj == null .","quizzes":[]},{"title":"else-if chains and if pitfalls","mins":11,"html":"<h3>The full pattern</h3>\n<pre><code class=\"language-java\">if (score &gt;= 90) {\n    grade = &quot;A&quot;;\n} else if (score &gt;= 80) {\n    grade = &quot;B&quot;;\n} else if (score &gt;= 70) {\n    grade = &quot;C&quot;;\n} else {\n    grade = &quot;F&quot;;\n}\n</code></pre>\n<p>Only the <strong>first</strong> true branch runs. For &quot;at least&quot; ranges, check from the <strong>highest</strong> value down.</p>\n<div class=\"lq\" data-lq=\"0\"></div><h3>Braces matter</h3>\n<p>Without braces, an <code>if</code> controls <strong>only the next statement</strong>:</p>\n<pre><code class=\"language-java\">if (lives == 0)\n    System.out.println(&quot;Game over&quot;);\n    resetGame();          // ALWAYS runs! Indentation doesn&#39;t matter in Java\n</code></pre>\n<p>Always use braces, even for one line.</p>\n<h3>The dangling else</h3>\n<p>An <code>else</code> matches the <strong>nearest</strong> <code>if</code> that doesn&#39;t already have one, no matter how it&#39;s indented:</p>\n<pre><code class=\"language-java\">if (a &gt; 0)\n    if (b &gt; 0)\n        System.out.println(&quot;both positive&quot;);\nelse\n    System.out.println(&quot;???&quot;);   // belongs to if (b &gt; 0)!\n</code></pre>\n<div class=\"lq\" data-lq=\"1\"></div><h3>Comparing things correctly</h3>\n<ul>\n<li><strong>ints and booleans:</strong> use <code>==</code>.</li>\n<li><strong>Strings and other objects:</strong> use <code>.equals()</code>.</li>\n<li><strong>doubles:</strong> rounding errors mean <code>0.1 + 0.2 == 0.3</code> is <strong>false</strong>! Compare with a small tolerance instead: <code>Math.abs(a - b) &lt; 0.0001</code>.</li>\n<li><strong>null checks:</strong> use <code>obj == null</code>, and put the null check first: <code>if (s != null &amp;&amp; s.length() &gt; 0)</code>.</li>\n</ul>\n<h3>Boolean variables and returns</h3>\n<p><code>if (done == true)</code> works, but <code>if (done)</code> is cleaner. Instead of writing:</p>\n<pre><code class=\"language-java\">if (x &gt; 10) { return true; } else { return false; }\n</code></pre>\n<p>just <code>return x &gt; 10;</code>.</p>\n<div class=\"lq\" data-lq=\"2\"></div>\n","text":" The full pattern java if (score = 90) { grade = \"A\"; } else if (score = 80) { grade = \"B\"; } else if (score = 70) { grade = \"C\"; } else { grade = \"F\"; } Only the first true branch runs. For \"at least\" ranges, check from the highest value down. Braces matter Without braces, an if controls only the next statement : java if (lives == 0) System.out.println(\"Game over\"); resetGame(); // ALWAYS runs! Indentation doesn't matter in Java Always use braces, even for one line. The dangling else An else matches the nearest if that doesn't already have one, no matter how it's indented: java if (a 0) if (b 0) System.out.println(\"both positive\"); else System.out.println(\"???\"); // belongs to if (b 0)! Comparing things correctly ints and booleans: use == . Strings and other objects: use .equals() . doubles: rounding errors mean 0.1 + 0.2 == 0.3 is false ! Compare with a small tolerance instead: Math.abs(a b) < 0.0001 . null checks: use obj == null , and put the null check first: if (s != null && s.length() 0) . Boolean variables and returns if (done == true) works, but if (done) is cleaner. Instead of writing: java if (x 10) { return true; } else { return false; } just return x 10; . ","quizzes":[{"q":"`score = 85`. Which branch of the chain above runs?","choices":["A","B","B and C","F"],"a":1,"why":"85 >= 90 is false, and 85 >= 80 is true, so grade becomes \"B\" and the rest is skipped.","id":"csa2-L2q1","kind":"mcq","type":"quiz","inline":true},{"q":"In the dangling else example, `a = -1` and `b = 5`. What prints?","choices":["both positive","???","Nothing","It doesn't compile"],"a":2,"why":"The `else` belongs to the inner `if (b > 0)`, which is never reached because `a > 0` is false. So nothing prints.","id":"csa2-L2q2","kind":"mcq","type":"quiz","inline":true},{"q":"Which line is the cleanest equivalent of `if (isOpen == false) { ... }`?","choices":["`if (!isOpen) { ... }`","`if (isOpen = false) { ... }`","`if (isOpen != true == true) { ... }`","`if (false) { ... }`"],"a":0,"why":"`!isOpen` is true exactly when `isOpen` is false.","id":"csa2-L2q3","kind":"mcq","type":"quiz","inline":true}]},{"title":"Loops and loop analysis","mins":12,"html":"<pre><code class=\"language-java\">for (int i = 0; i &lt; 5; i++) { ... }      // runs 5 times: i = 0..4\n\nint n = 100;\nwhile (n &gt; 1) { n /= 2; }                // runs until the condition is false\n</code></pre>\n<h3>Common algorithms</h3>\n<ul>\n<li><strong>Sum or average:</strong> accumulate in a variable, then divide by the count (watch out for int division!).</li>\n<li><strong>Min or max:</strong> start with the first value, not 0.</li>\n<li><strong>Count matches:</strong> add 1 to a counter when a condition is true.</li>\n<li><strong>String traversal:</strong></li>\n</ul>\n<pre><code class=\"language-java\">for (int i = 0; i &lt; str.length(); i++) {\n    String ch = str.substring(i, i + 1);\n}\n</code></pre>\n<h3>Nested loops and counting executions</h3>\n<pre><code class=\"language-java\">for (int i = 0; i &lt; 3; i++)\n    for (int j = 0; j &lt; 4; j++)\n        count++;          // runs 3 × 4 = 12 times\n</code></pre>\n<p>If the inner loop depends on the outer one (<code>j = i; j &lt; n</code>), add up the counts for each pass, for example 5 + 4 + 3 + 2 + 1.</p>\n<blockquote>\n<p><strong>Off-by-one errors</strong> are the #1 loop bug. Check the first and last values of your loop variable.</p>\n</blockquote>\n","text":" java for (int i = 0; i < 5; i++) { ... } // runs 5 times: i = 0..4 int n = 100; while (n 1) { n /= 2; } // runs until the condition is false Common algorithms Sum or average: accumulate in a variable, then divide by the count (watch out for int division!). Min or max: start with the first value, not 0. Count matches: add 1 to a counter when a condition is true. String traversal: java for (int i = 0; i < str.length(); i++) { String ch = str.substring(i, i + 1); } Nested loops and counting executions java for (int i = 0; i < 3; i++) for (int j = 0; j < 4; j++) count++; // runs 3 × 4 = 12 times If the inner loop depends on the outer one ( j = i; j < n ), add up the counts for each pass, for example 5 + 4 + 3 + 2 + 1. Off by one errors are the 1 loop bug. Check the first and last values of your loop variable.","quizzes":[]}],"ex":[],"fill":[{"q":"Complete the loop so it counts how many times \"a\" appears in `str`.","lang":"java","code":"int count = 0;\nfor (int i = 0; i \u00000\u0000 str.length(); i++) {\n    if (str.substring(i, i + 1).\u00001\u0000(\"a\")) {\n        count\u00002\u0000;\n    }\n}","why":"Loop while `i < str.length()`, compare Strings with `.equals`, and add to the count with `count++`.","id":"csa2-f1","kind":"fill","title":"Count the a's","blanks":[["<"],["equals"],["++"]]},{"q":"Rewrite `!(x > 5 && y < 3)` without the `!`.","lang":"java","code":"x \u00000\u0000 5 \u00001\u0000 y \u00002\u0000 3","why":"Push the `!` inside: flip `&&` to `||` and negate each comparison. `!(x > 5)` becomes `x <= 5`, and `!(y < 3)` becomes `y >= 3`.","id":"csa2-f2","kind":"fill","title":"De Morgan's Law","blanks":[["<="],["","",""],[">="]]},{"q":"Complete the grading chain.","lang":"java","code":"if (score >= 90) \u00000\u0000\n    grade = \"A\";\n} \u00001\u0000 (score >= 80) {\n    grade = \"B\";\n} \u00002\u0000 {\n    grade = \"C\";\n}","why":"Java puts each block in braces `{ }`. Use `else if` (two words) for extra conditions, and `else` for everything left over.","id":"csa2-f3","kind":"fill","title":"if / else if in Java","blanks":[["{"],["else if"],["else"]]},{"q":"Make this check work for any String the user types.","lang":"java","code":"if (answer.\u00000\u0000(\"yes\") \u00001\u0000 !done) {\n    System.out.println(\"Let's go!\");\n}","why":"Compare String contents with `.equals`, and combine conditions with `&&` (and).","id":"csa2-f4","kind":"fill","title":"Comparing Strings in an if","blanks":[["equals"],["&&"]]}],"quiz":[{"q":"What does `0.1 + 0.2 == 0.3` evaluate to in Java?","choices":["true","false","It doesn't compile","0.3"],"a":1,"why":"Doubles can't store 0.1 and 0.2 exactly, so the sum is 0.30000000000000004. Compare doubles with a tolerance instead.","id":"csa2-q1","kind":"mcq","type":"quiz"},{"q":"In an if statement without braces, how many statements does the `if` control?","choices":["Only the next one","Every line that is indented","All statements until the next blank line","None"],"a":0,"why":"Without `{ }`, only the single next statement belongs to the `if`. Indentation means nothing to Java.","id":"csa2-q2","kind":"mcq","type":"quiz"},{"q":"Which condition safely checks that `name` (a String that might be null) is not empty?","choices":["`name != null && name.length() > 0`","`name.length() > 0 && name != null`","`name != null || name.length() > 0`","`name.length() > 0`"],"a":0,"why":"Put the null check first. Short-circuit `&&` skips `name.length()` when `name` is null.","id":"csa2-q3","kind":"mcq","type":"quiz"},{"q":"Which expression is equivalent to `!(a && b)`?","choices":["`!a && !b`","`!a || !b`","`a || b`","`!a && b`"],"a":1,"why":"De Morgan's Law: push the `!` inside, flip `&&` to `||`, and negate each part.","id":"csa2-q4","kind":"mcq","type":"quiz"},{"q":"`int x = 0;` What does `(x != 0 && 10 / x > 1)` evaluate to?","choices":["false","true","ArithmeticException","It doesn't compile"],"a":0,"why":"`x != 0` is false, so short-circuiting skips `10 / x` and there's no divide by zero.","id":"csa2-q5","kind":"mcq","type":"quiz"},{"q":"How many times does `count++` run?","choices":["7","12","16","9"],"a":1,"lang":"java","code":"for (int i = 0; i < 3; i++)\n    for (int j = 0; j < 4; j++)\n        count++;","why":"The outer loop runs 3 times and the inner loop runs 4 times per outer pass: 3 × 4 = 12.","id":"csa2-q6","kind":"mcq","type":"quiz"},{"q":"How many times does `for (int i = 10; i > 0; i -= 3)` loop?","choices":["3","4","5","10"],"a":1,"why":"i takes the values 10, 7, 4, 1. The next value would be −2, which ends the loop. That's 4 loops.","id":"csa2-q7","kind":"mcq","type":"quiz"},{"q":"Which is equivalent to `!(x > 5 || y == 2)`?","choices":["`x <= 5 && y != 2`","`x < 5 && y != 2`","`x <= 5 || y != 2`","`x > 5 && y == 2`"],"a":0,"why":"Flip `||` to `&&` and negate each part: `!(x > 5)` is `x <= 5`, and `!(y == 2)` is `y != 2`.","id":"csa2-q8","kind":"mcq","type":"quiz"}],"trace":[{"q":"What is printed?","choices":["25","15","10","5"],"a":1,"lang":"java","code":"int count = 0;\nfor (int i = 1; i <= 5; i++) {\n    for (int j = i; j <= 5; j++) {\n        count++;\n    }\n}\nSystem.out.println(count);","why":"The inner loop runs 5, 4, 3, 2 and 1 times, and 5 + 4 + 3 + 2 + 1 = 15.","id":"csa2-t1","kind":"mcq","type":"trace"},{"q":"What is printed?","choices":["true","false","racecar","StringIndexOutOfBoundsException"],"a":0,"lang":"java","code":"String word = \"racecar\";\nString rev = \"\";\nfor (int i = word.length() - 1; i >= 0; i--) {\n    rev += word.substring(i, i + 1);\n}\nSystem.out.println(rev.equals(word));","why":"The loop builds the string in reverse. \"racecar\" is a palindrome, so the reversed string equals the original.","id":"csa2-t2","kind":"mcq","type":"trace"},{"q":"What is printed?","choices":["14","11","0","7"],"a":1,"lang":"java","code":"int x = 7;\nif (x > 5) {\n    x = x * 2;\n}\nif (x > 10) {\n    x = x - 3;\n} else {\n    x = 0;\n}\nSystem.out.println(x);","why":"7 > 5, so x becomes 14. Then 14 > 10, so x becomes 11. These are two separate ifs.","id":"csa2x-t1","kind":"mcq","type":"trace"}],"bug":[{"q":"This crashes with a StringIndexOutOfBoundsException. Click the bug.","lang":"java","code":"// count the vowels in str\nint count = 0;\nfor (int i = 0; i <= str.length(); i++) {\n    String ch = str.substring(i, i + 1);\n    if (\"aeiou\".indexOf(ch) >= 0) {\n        count++;\n    }\n}","lines":[3],"fix":"for (int i = 0; i < str.length(); i++) {","why":"The last valid index is `length() - 1`. Using `<=` makes `substring(i, i + 1)` go past the end of the string.","id":"csa2-b1","kind":"bug","type":"bug"},{"q":"The game resets even when lives are left. Click the bug.","lang":"java","code":"if (lives == 0)\n    System.out.println(\"Game over\");\n    resetGame();","lines":[1],"fix":"if (lives == 0) {  System.out.println(\"Game over\");  resetGame();  }","why":"Without braces, only the first statement belongs to the `if`. `resetGame()` always runs. Add braces around both lines.","id":"csa2x-b1","kind":"bug","type":"bug"}]},{"id":"csa3","title":"Unit 3: Class Creation","lessons":[{"title":"Anatomy of a class","mins":13,"html":"<pre><code class=\"language-java\">public class Student {\n    // instance variables: private = encapsulation\n    private String name;\n    private int grade;\n\n    // constructor: same name as the class, no return type\n    public Student(String name, int grade) {\n        this.name = name;      // this.name = the instance variable\n        this.grade = grade;\n    }\n\n    // accessor (getter)\n    public String getName() { return name; }\n\n    // mutator (setter)\n    public void setGrade(int newGrade) { grade = newGrade; }\n\n    public String toString() { return name + &quot; (&quot; + grade + &quot;)&quot;; }\n}\n</code></pre>\n<h3>Encapsulation</h3>\n<p>Make instance variables <strong>private</strong> so outside code must go through your methods. This protects the data and lets you check for invalid values.</p>\n<h3>Constructors</h3>\n<p>A constructor sets the starting state of a new object. If you don&#39;t write one, Java provides a default no-argument constructor. Instance variables you don&#39;t set get default values: <code>0</code>, <code>0.0</code>, <code>false</code> or <code>null</code>.</p>\n<h3>Methods</h3>\n<ul>\n<li><strong>Accessors</strong> return information without changing the object.</li>\n<li><strong>Mutators</strong> change the object&#39;s state (and are usually <code>void</code>).</li>\n<li>A method&#39;s <strong>header</strong> includes its access modifier, its return type, its name and its parameters.</li>\n</ul>\n","text":" java public class Student { // instance variables: private = encapsulation private String name; private int grade; // constructor: same name as the class, no return type public Student(String name, int grade) { this.name = name; // this.name = the instance variable this.grade = grade; } // accessor (getter) public String getName() { return name; } // mutator (setter) public void setGrade(int newGrade) { grade = newGrade; } public String toString() { return name + \" (\" + grade + \")\"; } } Encapsulation Make instance variables private so outside code must go through your methods. This protects the data and lets you check for invalid values. Constructors A constructor sets the starting state of a new object. If you don't write one, Java provides a default no argument constructor. Instance variables you don't set get default values: 0 , 0.0 , false or null . Methods Accessors return information without changing the object. Mutators change the object's state (and are usually void ). A method's header includes its access modifier, its return type, its name and its parameters.","quizzes":[]},{"title":"this, static, scope and references","mins":11,"html":"<h3>this</h3>\n<p><code>this</code> refers to the current object. It&#39;s needed when a parameter has the same name as an instance variable (<strong>shadowing</strong>):</p>\n<pre><code class=\"language-java\">public void setName(String name) { this.name = name; }\n</code></pre>\n<h3>static</h3>\n<ul>\n<li>A <strong>static</strong> variable belongs to the <strong>class</strong> and is shared by every object. A common use is counting how many objects have been created.</li>\n<li>A <strong>static</strong> method can&#39;t use instance variables or <code>this</code> directly.</li>\n</ul>\n<h3>Scope</h3>\n<p><strong>Local variables</strong> (including parameters) exist only inside their method or block.</p>\n<h3>References and aliasing</h3>\n<pre><code class=\"language-java\">Point p = new Point(1, 2);\nPoint q = p;        // q and p point to the SAME object\nq.setX(5);\np.getX();           // 5\n</code></pre>\n<p>When you pass an object to a method, the method gets a copy of the <strong>reference</strong>, so it can change the original object.</p>\n<h3>Documentation</h3>\n<ul>\n<li>A <strong>precondition</strong> is what must be true before a method is called.</li>\n<li>A <strong>postcondition</strong> is what will be true after it runs.</li>\n</ul>\n<p>Document both in comments.</p>\n<blockquote>\n<p>The 2025–26 AP CSA course <strong>does not</strong> include inheritance (<code>extends</code>, <code>super</code>, polymorphism). Unit 3 is about designing single classes.</p>\n</blockquote>\n","text":" this this refers to the current object. It's needed when a parameter has the same name as an instance variable ( shadowing ): java public void setName(String name) { this.name = name; } static A static variable belongs to the class and is shared by every object. A common use is counting how many objects have been created. A static method can't use instance variables or this directly. Scope Local variables (including parameters) exist only inside their method or block. References and aliasing java Point p = new Point(1, 2); Point q = p; // q and p point to the SAME object q.setX(5); p.getX(); // 5 When you pass an object to a method, the method gets a copy of the reference , so it can change the original object. Documentation A precondition is what must be true before a method is called. A postcondition is what will be true after it runs. Document both in comments. The 2025–26 AP CSA course does not include inheritance ( extends , super , polymorphism). Unit 3 is about designing single classes.","quizzes":[]}],"ex":[],"fill":[{"q":"Complete the class.","lang":"java","code":"public class Dog {\n    private String name;\n    private \u00000\u0000 int dogCount = 0;   // shared by ALL dogs\n\n    public Dog(String name) {\n        \u00001\u0000 = name;\n        dogCount++;\n    }\n\n    public \u00002\u0000 getName() {\n        return name;\n    }\n}","why":"`static` makes one shared counter. `this.name` sets the instance variable instead of the parameter. The getter returns a `String`.","id":"csa3-f1","kind":"fill","title":"Write the Dog class","blanks":[["static"],["this.name"],["String"]]}],"quiz":[{"q":"Why are instance variables usually declared `private`?","choices":["To make the program run faster","Encapsulation: outside code must use methods, which protects the data","So subclasses can use them","Java requires it"],"a":1,"why":"Private data can only be changed through methods you control, and those methods can check for invalid values.","id":"csa3-q1","kind":"mcq","type":"quiz"},{"q":"Which statement about constructors is true?","choices":["They must return void","They have the same name as the class and no return type","A class can have only one constructor","They are called with `obj.construct()`"],"a":1,"why":"A constructor has no return type, not even `void`, and it shares the class's name. You can overload constructors.","id":"csa3-q2","kind":"mcq","type":"quiz"},{"q":"A class has `private static int count;`. Which statement is true?","choices":["Each object has its own count","All objects share a single count","count can't be changed","count is only visible inside the constructor"],"a":1,"why":"Static variables belong to the class itself, so there is one copy shared by every object.","id":"csa3-q3","kind":"mcq","type":"quiz"},{"q":"In `this.name = name;`, what does `this.name` refer to?","choices":["The parameter","The current object's instance variable","A static variable","A local variable"],"a":1,"why":"The parameter **shadows** the instance variable, and `this.` makes it clear which one you mean.","id":"csa3-q4","kind":"mcq","type":"quiz"},{"q":"A `Student` class has `private int grade;` and the constructor never sets it. What is `grade` for a new Student?","choices":["0","null","It's undefined, so the code won't compile","−1"],"a":0,"why":"Instance variables get default values: 0 for int, 0.0 for double, false for boolean and null for objects.","id":"csa3-q5","kind":"mcq","type":"quiz"},{"q":"Which method is an **accessor**?","choices":["`public void setScore(int s)`","`public int getScore()`","`public Student(int s)`","`public static void main(String[] args)`"],"a":1,"why":"An accessor returns information about the object without changing it.","id":"csa3-q6","kind":"mcq","type":"quiz"}],"trace":[{"q":"What is printed?","choices":["2 1 2","2 1 3","3 3 3","2 2 3"],"a":1,"lang":"java","code":"public class Counter {\n    private static int total = 0;\n    private int count;\n\n    public Counter() { count = 0; }\n\n    public void click() {\n        count++;\n        total++;\n    }\n    public int getCount() { return count; }\n    public static int getTotal() { return total; }\n}\n\n// in main:\nCounter a = new Counter();\nCounter b = new Counter();\na.click(); a.click(); b.click();\nSystem.out.println(a.getCount() + \" \" + b.getCount() + \" \" + Counter.getTotal());","why":"`count` belongs to each object (a has 2, b has 1). `total` is static and shared by both, so it's 3.","id":"csa3-t1","kind":"mcq","type":"trace"},{"q":"What is printed?","choices":["1","5","2","null"],"a":1,"lang":"java","code":"Point p = new Point(1, 2);\nPoint q = p;\nq.setX(5);\nSystem.out.println(p.getX());","why":"`q = p` copies the **reference**, so both variables point to the same object.","id":"csa3-t2","kind":"mcq","type":"trace"}],"bug":[{"q":"`new Student(\"Ada\", 11).getName()` returns null. Click the bug.","lang":"java","code":"public class Student {\n    private String name;\n    private int grade;\n\n    public Student(String name, int grade) {\n        name = name;\n        this.grade = grade;\n    }\n    public String getName() { return name; }\n}","lines":[6],"fix":"this.name = name;","why":"`name = name` assigns the parameter to itself. Without `this.`, the instance variable is never set, so it stays null.","id":"csa3-b1","kind":"bug","type":"bug"}]},{"id":"csa4","title":"Unit 4: Data Collections","lessons":[{"title":"Arrays and ArrayLists","mins":14,"html":"<h3>Arrays (fixed size)</h3>\n<pre><code class=\"language-java\">int[] scores = new int[5];            // [0, 0, 0, 0, 0]\nString[] names = {&quot;Ada&quot;, &quot;Linus&quot;};\nscores.length                         // 5  (no parentheses!)\nscores[0] = 90;\n\nfor (int s : scores) { ... }          // enhanced for: read-only copy of each value\n</code></pre>\n<p>A new array is filled with default values: <code>0</code>, <code>0.0</code>, <code>false</code> or <code>null</code>. Using an index outside the array throws an <code>ArrayIndexOutOfBoundsException</code>.</p>\n<h3>ArrayList (resizable)</h3>\n<pre><code class=\"language-java\">ArrayList&lt;Integer&gt; list = new ArrayList&lt;&gt;();\nlist.add(4);           // [4]\nlist.add(0, 9);        // [9, 4]  (inserts at index 0)\nlist.get(1);           // 4\nlist.set(1, 7);        // [9, 7]  (returns the old value, 4)\nlist.remove(0);        // [7]     (returns 9)\nlist.size();           // 1\n</code></pre>\n<h3>Removing while looping</h3>\n<p>When you remove an element, every element after it <strong>shifts left</strong>. A forward loop then <strong>skips</strong> the next element. Loop <strong>backward</strong> instead, or don&#39;t add 1 to <code>i</code> after a removal.</p>\n<table>\n<thead>\n<tr>\n<th></th>\n<th>Array</th>\n<th>ArrayList</th>\n<th>String</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>size</td>\n<td><code>.length</code></td>\n<td><code>.size()</code></td>\n<td><code>.length()</code></td>\n</tr>\n</tbody></table>\n","text":" Arrays (fixed size) java int[] scores = new int[5]; // [0, 0, 0, 0, 0] String[] names = {\"Ada\", \"Linus\"}; scores.length // 5 (no parentheses!) scores[0] = 90; for (int s : scores) { ... } // enhanced for: read only copy of each value A new array is filled with default values: 0 , 0.0 , false or null . Using an index outside the array throws an ArrayIndexOutOfBoundsException . ArrayList (resizable) java ArrayList<Integer list = new ArrayList< (); list.add(4); // [4] list.add(0, 9); // [9, 4] (inserts at index 0) list.get(1); // 4 list.set(1, 7); // [9, 7] (returns the old value, 4) list.remove(0); // [7] (returns 9) list.size(); // 1 Removing while looping When you remove an element, every element after it shifts left . A forward loop then skips the next element. Loop backward instead, or don't add 1 to i after a removal. Array ArrayList String size .length .size() .length() ","quizzes":[]},{"title":"2D arrays and reading files","mins":12,"html":"<h3>2D arrays</h3>\n<pre><code class=\"language-java\">int[][] grid = new int[3][4];   // 3 rows, 4 columns\ngrid.length        // 3  (rows)\ngrid[0].length     // 4  (columns)\n\n// row-major traversal\nfor (int r = 0; r &lt; grid.length; r++)\n    for (int c = 0; c &lt; grid[0].length; c++)\n        System.out.print(grid[r][c]);\n</code></pre>\n<p>Column-major traversal swaps the loops: the outer loop goes over columns and the inner loop goes over rows.</p>\n<h3>Reading a text file (new in 2025–26)</h3>\n<pre><code class=\"language-java\">import java.io.File;\nimport java.io.IOException;\nimport java.util.Scanner;\n\npublic static void main(String[] args) throws IOException {\n    Scanner sc = new Scanner(new File(&quot;data.txt&quot;));\n    while (sc.hasNext()) {\n        String word = sc.next();\n    }\n    sc.close();\n}\n</code></pre>\n<p><code>hasNext()</code>, <code>hasNextInt()</code>, <code>next()</code>, <code>nextInt()</code>, <code>nextDouble()</code> and <code>nextLine()</code> read tokens one by one. A method that opens a file must handle or declare <code>IOException</code>.</p>\n","text":" 2D arrays java int[][] grid = new int[3][4]; // 3 rows, 4 columns grid.length // 3 (rows) grid[0].length // 4 (columns) // row major traversal for (int r = 0; r < grid.length; r++) for (int c = 0; c < grid[0].length; c++) System.out.print(grid[r][c]); Column major traversal swaps the loops: the outer loop goes over columns and the inner loop goes over rows. Reading a text file (new in 2025–26) java import java.io.File; import java.io.IOException; import java.util.Scanner; public static void main(String[] args) throws IOException { Scanner sc = new Scanner(new File(\"data.txt\")); while (sc.hasNext()) { String word = sc.next(); } sc.close(); } hasNext() , hasNextInt() , next() , nextInt() , nextDouble() and nextLine() read tokens one by one. A method that opens a file must handle or declare IOException .","quizzes":[]},{"title":"Searching, sorting and recursion","mins":14,"html":"<h3>Searching</h3>\n<ul>\n<li><strong>Linear search</strong> works on any array.</li>\n<li><strong>Binary search</strong> needs <strong>sorted</strong> data. Each step halves the search range.</li>\n</ul>\n<h3>Sorting</h3>\n<ul>\n<li><strong>Selection sort:</strong> find the smallest remaining item and swap it into the next position. After pass k, the first k items are in their final positions.</li>\n<li><strong>Insertion sort:</strong> take the next item and slide it left into the sorted part.</li>\n<li><strong>Merge sort</strong> (recursive): split the array in half, sort each half, then merge the halves. It&#39;s faster on big data.</li>\n</ul>\n<h3>Recursion</h3>\n<p>A <strong>recursive</strong> method calls itself. Every recursive method needs a <strong>base case</strong> that stops the recursion. Without one, it recurses forever and throws a <code>StackOverflowError</code>.</p>\n<pre><code class=\"language-java\">public static int sum(int n) {\n    if (n == 0) return 0;          // base case\n    return n + sum(n - 1);         // recursive call\n}\n// sum(3) → 3 + sum(2) → 3 + 2 + sum(1) → 3 + 2 + 1 + 0 = 6\n</code></pre>\n<p>To trace recursion, write out each call, then fill in the return values from the bottom up.</p>\n","text":" Searching Linear search works on any array. Binary search needs sorted data. Each step halves the search range. Sorting Selection sort: find the smallest remaining item and swap it into the next position. After pass k, the first k items are in their final positions. Insertion sort: take the next item and slide it left into the sorted part. Merge sort (recursive): split the array in half, sort each half, then merge the halves. It's faster on big data. Recursion A recursive method calls itself. Every recursive method needs a base case that stops the recursion. Without one, it recurses forever and throws a StackOverflowError . java public static int sum(int n) { if (n == 0) return 0; // base case return n + sum(n 1); // recursive call } // sum(3) → 3 + sum(2) → 3 + 2 + sum(1) → 3 + 2 + 1 + 0 = 6 To trace recursion, write out each call, then fill in the return values from the bottom up.","quizzes":[]}],"ex":[],"fill":[{"q":"Complete the loop that adds up every number in `list` (an `ArrayList<Integer>`).","lang":"java","code":"int total = 0;\nfor (int i = 0; i < list.\u00000\u0000; i++) {\n    total += list.\u00001\u0000;\n}","why":"ArrayLists use `.size()` for their length and `.get(i)` to read an element.","id":"csa4-f1","kind":"fill","title":"Sum an ArrayList","blanks":[["size()"],["get(i)"]]},{"q":"Complete the row-major traversal of `grid`.","lang":"java","code":"for (int r = 0; r < grid.\u00000\u0000; r++) {\n    for (int c = 0; c < grid[r].\u00001\u0000; c++) {\n        System.out.print(grid[r][c] + \" \");\n    }\n}","why":"`grid.length` is the number of rows, and `grid[r].length` is the number of columns in row r.","id":"csa4-f2","kind":"fill","title":"Traverse a 2D array","blanks":[["length"],["length"]]},{"q":"Complete the recursive factorial method.","lang":"java","code":"public static int factorial(int n) {\n    if (n \u00000\u0000 1) {\n        return \u00001\u0000;\n    }\n    return n * factorial(\u00002\u0000);\n}","why":"The base case stops at 1, and each recursive call moves toward it with `n - 1`.","id":"csa4-f3","kind":"fill","title":"Recursive factorial","blanks":[["<="],["1"],["n - 1"]]}],"quiz":[{"q":"After `int[] a = new int[5];`, what is `a[2]`?","choices":["0","null","It's undefined, so the code won't compile","2"],"a":0,"why":"New int arrays are filled with 0.","id":"csa4-q1","kind":"mcq","type":"quiz"},{"q":"`int[][] g = new int[3][4];` What are `g.length` and `g[0].length`?","choices":["3 and 4","4 and 3","12 and 4","3 and 3"],"a":0,"why":"`g.length` is the number of rows (3), and `g[0].length` is the number of columns (4).","id":"csa4-q2","kind":"mcq","type":"quiz"},{"q":"You remove items from an ArrayList inside a forward `for` loop. What can go wrong?","choices":["Nothing","The item after each removed item gets skipped","The list gets sorted","It won't compile"],"a":1,"why":"After a removal, every later item shifts left by one, but `i` still increases, so the next item is never checked.","id":"csa4-q3","kind":"mcq","type":"quiz"},{"q":"How do you get the number of elements in an `ArrayList` called `list`?","choices":["`list.length`","`list.length()`","`list.size()`","`list.count()`"],"a":2,"why":"Arrays use `.length`, Strings use `.length()`, and ArrayLists use `.size()`.","id":"csa4-q4","kind":"mcq","type":"quiz"},{"q":"You run selection sort on `[5, 2, 9, 1]`. What is the array after the **first** pass?","choices":["[1, 2, 9, 5]","[2, 5, 9, 1]","[1, 5, 2, 9]","[2, 5, 1, 9]"],"a":0,"why":"Selection sort finds the smallest item (1) and swaps it with the item at index 0 (5).","id":"csa4-q5","kind":"mcq","type":"quiz"},{"q":"What does every recursive method need to avoid infinite recursion?","choices":["A loop","A base case","A static variable","Two parameters"],"a":1,"why":"The base case stops the recursion. Without one, the program throws a `StackOverflowError`.","id":"csa4-q6","kind":"mcq","type":"quiz"},{"q":"What must a method that creates a `new Scanner(new File(\"data.txt\"))` do?","choices":["Nothing special","Handle or declare `IOException`, for example with `throws IOException`","Be static","Return a String"],"a":1,"why":"Opening a file can fail, so Java requires you to declare or handle that possibility.","id":"csa4-q7","kind":"mcq","type":"quiz"},{"q":"Which statement about the enhanced for loop `for (int x : arr)` is true?","choices":["It can change the array's values through x","x is a copy of each value, so changing x doesn't change the array","It visits the elements in reverse order","It gives you the index of each element"],"a":1,"why":"The loop variable is a copy of each value. To change an array's elements, use an index-based loop.","id":"csa4-q8","kind":"mcq","type":"quiz"}],"trace":[{"q":"What is printed?","choices":["5","13","18","7"],"a":2,"lang":"java","code":"int[] nums = {3, 8, 2, 5};\nfor (int i = 1; i < nums.length; i++) {\n    nums[i] += nums[i - 1];\n}\nSystem.out.println(nums[3]);","why":"The loop computes running totals: [3, 11, 13, 18].","id":"csa4-t1","kind":"mcq","type":"trace"},{"q":"What is printed?","choices":["[4, 2, 7]","[9, 2]","[9, 7, 2]","[2, 7]"],"a":1,"lang":"java","code":"ArrayList<Integer> list = new ArrayList<>();\nlist.add(4);\nlist.add(7);\nlist.add(1, 9);\nlist.remove(0);\nlist.set(1, 2);\nSystem.out.println(list);","why":"[4] → [4, 7] → [4, 9, 7] → [9, 7] → [9, 2].","id":"csa4-t2","kind":"mcq","type":"trace"},{"q":"What does `mystery(7)` return?","choices":["28","16","15","7"],"a":1,"lang":"java","code":"public static int mystery(int n) {\n    if (n <= 1) return 1;\n    return n + mystery(n - 2);\n}","why":"7 + 5 + 3 + mystery(1), and mystery(1) is 1. So 7 + 5 + 3 + 1 = 16.","id":"csa4-t3","kind":"mcq","type":"trace"},{"q":"What is printed?","choices":["3","9","21","6"],"a":1,"lang":"java","code":"int[][] grid = {{1, 2, 3}, {4, 5, 6}};\nint sum = 0;\nfor (int c = 0; c < grid[0].length; c++) {\n    sum += grid[1][c] - grid[0][c];\n}\nSystem.out.println(sum);","why":"Each column adds row 1 minus row 0: (4 − 1) + (5 − 2) + (6 − 3) = 9.","id":"csa4-t4","kind":"mcq","type":"trace"}],"bug":[{"q":"This is supposed to remove **every** negative number, but `[-1, -2, 5]` becomes `[-2, 5]`. Click the bug.","lang":"java","code":"// remove every negative number from list\nfor (int i = 0; i < list.size(); i++) {\n    if (list.get(i) < 0) {\n        list.remove(i);\n    }\n}","lines":[2,4],"fix":"for (int i = list.size() - 1; i >= 0; i--) {","why":"After a removal, the next item shifts into index i, but the loop moves on to i + 1 and skips it. Loop backward, or subtract 1 from `i` after each removal.","id":"csa4-b1","kind":"bug","type":"bug"},{"q":"This throws a StackOverflowError. Click the bug.","lang":"java","code":"public static int factorial(int n) {\n    return n * factorial(n - 1);\n}","lines":[2],"fix":"if (n <= 1) return 1;  return n * factorial(n - 1);","why":"There's no base case, so the method calls itself forever.","id":"csa4-b2","kind":"bug","type":"bug"}]}]},{"id":"cyber","title":"Cybersecurity","short":"Security","emoji":"🔐","year":3,"yearLabel":"Junior / Senior","color":"#a855f7","blurb":"Think like a defender: threats, passwords and authentication, cryptography, and network defense. Only ever test systems you have permission to test.","units":[{"id":"cy1","title":"Security Foundations","lessons":[{"title":"The CIA triad and threats","mins":10,"html":"<p>Every security decision protects one or more parts of the <strong>CIA triad</strong>:</p>\n<table>\n<thead>\n<tr>\n<th></th>\n<th>Means</th>\n<th>Attack example</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>Confidentiality</strong></td>\n<td>Only the right people can see the data</td>\n<td>a data leak</td>\n</tr>\n<tr>\n<td><strong>Integrity</strong></td>\n<td>The data hasn&#39;t been secretly changed</td>\n<td>tampering with grades</td>\n</tr>\n<tr>\n<td><strong>Availability</strong></td>\n<td>The system works when people need it</td>\n<td>a DDoS attack</td>\n</tr>\n</tbody></table>\n<h3>Key terms</h3>\n<ul>\n<li><strong>Vulnerability:</strong> a weakness, like an unpatched bug or a weak password.</li>\n<li><strong>Threat:</strong> something that could exploit a vulnerability.</li>\n<li><strong>Risk:</strong> how likely an attack is, combined with how much damage it would do.</li>\n</ul>\n<h3>Malware</h3>\n<ul>\n<li><strong>Virus:</strong> attaches to files and spreads when the files are run.</li>\n<li><strong>Worm:</strong> spreads <strong>by itself</strong> across networks. It doesn&#39;t need a host file.</li>\n<li><strong>Trojan:</strong> pretends to be something useful.</li>\n<li><strong>Ransomware:</strong> encrypts your files and demands payment.</li>\n<li><strong>Spyware / keylogger:</strong> secretly watches what you do.</li>\n</ul>\n<h3>Social engineering</h3>\n<p>Social engineering attacks target <strong>people</strong>, not computers. Examples include <strong>phishing</strong> (fake messages), <strong>pretexting</strong> (a made-up story, like &quot;I&#39;m from IT&quot;), <strong>tailgating</strong> (following someone through a locked door) and <strong>baiting</strong> (a &quot;free&quot; USB drive).</p>\n<h3>Ethics and the law</h3>\n<p>Only test systems you <strong>own</strong> or have <strong>written permission</strong> to test. Unauthorized access is illegal, even if you were &quot;just curious&quot;. In the US it falls under the Computer Fraud and Abuse Act. <strong>White-hat</strong> hackers work with permission and report what they find responsibly.</p>\n","text":"Every security decision protects one or more parts of the CIA triad : Means Attack example Confidentiality Only the right people can see the data a data leak Integrity The data hasn't been secretly changed tampering with grades Availability The system works when people need it a DDoS attack Key terms Vulnerability: a weakness, like an unpatched bug or a weak password. Threat: something that could exploit a vulnerability. Risk: how likely an attack is, combined with how much damage it would do. Malware Virus: attaches to files and spreads when the files are run. Worm: spreads by itself across networks. It doesn't need a host file. Trojan: pretends to be something useful. Ransomware: encrypts your files and demands payment. Spyware / keylogger: secretly watches what you do. Social engineering Social engineering attacks target people , not computers. Examples include phishing (fake messages), pretexting (a made up story, like \"I'm from IT\"), tailgating (following someone through a locked door) and baiting (a \"free\" USB drive). Ethics and the law Only test systems you own or have written permission to test. Unauthorized access is illegal, even if you were \"just curious\". In the US it falls under the Computer Fraud and Abuse Act. White hat hackers work with permission and report what they find responsibly.","quizzes":[]}],"ex":[],"fill":[{"q":"Name all three parts of the CIA triad.","lang":"text","code":"C = \u00000\u0000\nI = \u00001\u0000\nA = \u00002\u0000","why":"Confidentiality, Integrity and Availability are the three goals of information security.","id":"cy1-f1","kind":"fill","title":"The CIA triad","blanks":[["Confidentiality"],["Integrity"],["Availability"]]}],"quiz":[{"q":"What do the letters in the CIA triad stand for?","choices":["Control, Identity, Access","Confidentiality, Integrity, Availability","Cryptography, Internet, Authentication","Confidentiality, Identity, Authorization"],"a":1,"why":"These are the three goals of information security.","id":"cy1-q1","kind":"mcq","type":"quiz"},{"q":"A DDoS attack floods a website with traffic until it goes down. Which part of the CIA triad does it attack?","choices":["Confidentiality","Integrity","Availability","All three equally"],"a":2,"why":"The data isn't stolen or changed. The site just becomes **unavailable**.","id":"cy1-q2","kind":"mcq","type":"quiz"},{"q":"Which kind of malware spreads across a network by itself, without attaching to a file?","choices":["Virus","Worm","Trojan","Adware"],"a":1,"why":"Worms self-replicate across networks. Viruses need a host file to spread.","id":"cy1-q3","kind":"mcq","type":"quiz"},{"q":"Someone follows an employee through a secure door without swiping a badge. What is this called?","choices":["Phishing","Tailgating","Spoofing","Baiting"],"a":1,"why":"Tailgating (also called piggybacking) is a physical social engineering attack.","id":"cy1-q4","kind":"mcq","type":"quiz"},{"q":"When is it OK to run a security scan on a website?","choices":["Whenever you're curious","If the site looks insecure","Only if you own it or have written permission","Only on weekends"],"a":2,"why":"Testing without authorization is illegal. Ethical hackers always get permission first.","id":"cy1-q5","kind":"mcq","type":"quiz"},{"q":"An attacker changes students' grades in a database. Which part of the CIA triad is violated?","choices":["Availability","Integrity","Confidentiality","None of them"],"a":1,"why":"Integrity means data hasn't been altered without authorization.","id":"cy1-q6","kind":"mcq","type":"quiz"}],"trace":[],"bug":[]},{"id":"cy2","title":"Passwords & Access Control","lessons":[{"title":"Passwords, hashing and authentication","mins":12,"html":"<h3>Never store plain passwords</h3>\n<p>Websites should store a <strong>hash</strong> of each password. A hash is a one-way fingerprint that can&#39;t be turned back into the password. At login, the site hashes what you typed and compares the two hashes.</p>\n<p>A <strong>salt</strong> is random data added to each password before hashing. It makes identical passwords produce different hashes and defeats precomputed <strong>rainbow tables</strong>.</p>\n<h3>Password attacks</h3>\n<ul>\n<li><strong>Brute force:</strong> try every possible combination.</li>\n<li><strong>Dictionary attack:</strong> try common words and passwords that leaked in past breaches.</li>\n<li><strong>Credential stuffing:</strong> reuse passwords leaked from <em>other</em> sites.</li>\n</ul>\n<h3>Password strength (entropy)</h3>\n<p>The number of possible passwords is <strong>characters^length</strong>. <strong>Length matters most</strong>: 26¹² is about 457,000 times bigger than 26⁸ (that&#39;s 26⁴).</p>\n<p>A long passphrase like <code>correct-horse-battery-staple</code> beats a short password like <code>P@ss1!</code>.</p>\n<h3>Authentication factors</h3>\n<ul>\n<li>Something you <strong>know</strong>: a password or PIN</li>\n<li>Something you <strong>have</strong>: a phone or a security key</li>\n<li>Something you <strong>are</strong>: a fingerprint or your face</li>\n</ul>\n<p><strong>MFA</strong> combines two or more different factors.</p>\n<h3>Authorization and least privilege</h3>\n<ul>\n<li><strong>Authentication</strong> checks <em>who you are</em>.</li>\n<li><strong>Authorization</strong> decides <em>what you&#39;re allowed to do</em>.</li>\n<li>The <strong>principle of least privilege</strong> says to give people only the access they need.</li>\n</ul>\n<h3>Linux file permissions</h3>\n<p>Linux shows permissions as <code>rwx</code> (read, write, execute) for the <strong>owner</strong>, the <strong>group</strong> and <strong>others</strong>. Each permission is a number: r = 4, w = 2, x = 1. So <code>chmod 754 file</code> means owner rwx (7), group r-x (5) and others r-- (4).</p>\n","text":" Never store plain passwords Websites should store a hash of each password. A hash is a one way fingerprint that can't be turned back into the password. At login, the site hashes what you typed and compares the two hashes. A salt is random data added to each password before hashing. It makes identical passwords produce different hashes and defeats precomputed rainbow tables . Password attacks Brute force: try every possible combination. Dictionary attack: try common words and passwords that leaked in past breaches. Credential stuffing: reuse passwords leaked from other sites. Password strength (entropy) The number of possible passwords is characters^length . Length matters most : 26¹² is about 457,000 times bigger than 26⁸ (that's 26⁴). A long passphrase like correct horse battery staple beats a short password like P@ss1! . Authentication factors Something you know : a password or PIN Something you have : a phone or a security key Something you are : a fingerprint or your face MFA combines two or more different factors. Authorization and least privilege Authentication checks who you are . Authorization decides what you're allowed to do . The principle of least privilege says to give people only the access they need. Linux file permissions Linux shows permissions as rwx (read, write, execute) for the owner , the group and others . Each permission is a number: r = 4, w = 2, x = 1. So chmod 754 file means owner rwx (7), group r x (5) and others r (4).","quizzes":[]}],"ex":[{"id":"cy2-e1","title":"Password strength checker","lang":"python","mins":14,"prompt":"<p>Write <code>strength(pw)</code> that returns:</p>\n<ul>\n<li><code>&quot;strong&quot;</code> if the password is <strong>at least 12 characters</strong> AND has at least one <strong>digit</strong> AND at least one <strong>uppercase letter</strong></li>\n<li><code>&quot;medium&quot;</code> if it&#39;s at least 8 characters, but not strong</li>\n<li><code>&quot;weak&quot;</code> otherwise</li>\n</ul>\n","starter":"def strength(pw):\n    has_digit = False\n    has_upper = False\n    for ch in pw:\n        pass  # check ch.isdigit() and ch.isupper()\n\n    return \"weak\"","tests":["assert strength(\"abc\") == \"weak\", '\"abc\" is weak'","assert strength(\"password\") == \"medium\", '\"password\" (8 characters) is medium'","assert strength(\"longpassword12\") == \"medium\", \"No uppercase, so it's medium\"","assert strength(\"Purple-Tiger-42\") == \"strong\", '\"Purple-Tiger-42\" is strong'","assert strength(\"ABCDEFGHIJKL\") == \"medium\", \"No digit, so it's medium\""],"solution":"def strength(pw):\n    has_digit = False\n    has_upper = False\n    for ch in pw:\n        if ch.isdigit():\n            has_digit = True\n        if ch.isupper():\n            has_upper = True\n    if len(pw) >= 12 and has_digit and has_upper:\n        return \"strong\"\n    if len(pw) >= 8:\n        return \"medium\"\n    return \"weak\"","hint":"Set `has_digit` and `has_upper` to True inside the loop, then check the length rules.","hints":["Set `has_digit` and `has_upper` to True inside the loop, then check the length rules."],"visual":false,"unit":"cy2"}],"fill":[],"quiz":[{"q":"Why do websites store password **hashes** instead of the passwords themselves?","choices":["Hashes are shorter","If the database leaks, attackers don't directly get the passwords","Hashing makes login faster","So admins can read the passwords later"],"a":1,"why":"Hashes are one-way. Even if they leak, attackers still have to guess the original passwords.","id":"cy2-q1","kind":"mcq","type":"quiz"},{"q":"What does adding a **salt** to each password before hashing prevent?","choices":["Brute-force attacks entirely","Precomputed rainbow-table attacks, and identical passwords having the same hash","Phishing","Keyloggers"],"a":1,"why":"Each user gets a unique salt, so attackers can't use one precomputed table for everyone.","id":"cy2-q2","kind":"mcq","type":"quiz"},{"q":"Which password is strongest?","choices":["`P@ssw0rd!`","`Tr0ub4dor`","`purple-tiger-moon-skate-42`","`qwerty123`"],"a":2,"why":"Length adds the most entropy. A long, random passphrase beats short passwords with symbols swapped in.","id":"cy2-q3","kind":"mcq","type":"quiz"},{"q":"What permissions does `chmod 640 notes.txt` give?","choices":["Owner: rw-, group: r--, others: ---","Owner: rwx, group: r--, others: ---","Owner: r--, group: rw-, others: ---","Everyone can read and write"],"a":0,"why":"6 = 4 + 2 (rw), 4 = r, and 0 = no permissions.","id":"cy2-q4","kind":"mcq","type":"quiz"},{"q":"A new intern gets access only to the folders their job needs. Which principle is this?","choices":["Defense in depth","Least privilege","Security through obscurity","Availability"],"a":1,"why":"Least privilege limits the damage if an account is ever compromised.","id":"cy2-q5","kind":"mcq","type":"quiz"},{"q":"What is the difference between authentication and authorization?","choices":["Authentication checks who you are; authorization decides what you can do","They mean the same thing","Authorization checks who you are; authentication decides what you can do","Authentication is only used for passwords"],"a":0,"why":"Logging in is **authentication**. Being allowed into the admin page is **authorization**.","id":"cy2-q6","kind":"mcq","type":"quiz"}],"trace":[{"q":"What permission string does `ls -l` show after this command?","choices":["-rwxrwxr--","-rwxr-xr--","-rw-r-xr--","-rwxr--r-x"],"a":1,"lang":"bash","code":"$ chmod 754 script.sh\n$ ls -l script.sh","why":"7 = rwx (owner), 5 = r-x (group), 4 = r-- (others).","id":"cy2-t1","kind":"mcq","type":"trace"}],"bug":[{"q":"Click the line with the security flaw.","lang":"python","code":"def create_account(db, username, password):\n    if username in db:\n        return \"Username taken\"\n    db[username] = password\n    return \"Account created\"","lines":[4],"fix":"db[username] = hash_with_salt(password)   # e.g. bcrypt or argon2","why":"The password is stored in **plain text**. If the database leaks, every password leaks too. Store a salted hash instead.","id":"cy2-b1","kind":"bug","type":"bug"}]},{"id":"cy3","title":"Cryptography","lessons":[{"title":"From Caesar ciphers to HTTPS","mins":13,"html":"<h3>Classical ciphers</h3>\n<p>A <strong>Caesar cipher</strong> shifts every letter by a fixed amount. With a shift of 3, <code>A→D</code>, <code>B→E</code> and <code>Z→C</code>. There are only <strong>25</strong> useful keys, so it&#39;s easy to brute-force.</p>\n<p>A <strong>substitution cipher</strong> maps each letter to a different letter. It can be broken with <strong>frequency analysis</strong>, because in English, <strong>E</strong>, T and A are the most common letters.</p>\n<h3>Modern encryption</h3>\n<ul>\n<li><strong>Symmetric</strong> encryption (like AES) uses <strong>one shared key</strong> to encrypt and decrypt. It&#39;s fast, but you have to share the key safely.</li>\n<li><strong>Asymmetric</strong> encryption (public key, like RSA) uses a <strong>key pair</strong>. Anyone can encrypt with your <strong>public</strong> key, but only your <strong>private</strong> key can decrypt.</li>\n</ul>\n<p>HTTPS uses asymmetric encryption to <strong>agree on a symmetric key</strong> safely, and then uses that fast symmetric key for the rest of the connection.</p>\n<h3>Hashing vs. encryption</h3>\n<ul>\n<li><strong>Encryption</strong> is <strong>two-way</strong>: with the key, you can get the data back.</li>\n<li><strong>Hashing</strong> (like SHA-256) is <strong>one-way</strong>: you can&#39;t get the original back. Hashes are used to check integrity and to store passwords.</li>\n</ul>\n<h3>Digital signatures</h3>\n<p>To sign, you encrypt a hash of a message with your <strong>private</strong> key. Anyone can check the
