,"Nothing (empty)"],"a":0,"why":"A negative step counts down, and it still stops *before* the stop value (0).","id":"py3-q5","kind":"mcq","type":"quiz"}],"trace":[{"q":"What does this print?","choices":["15","10","4","5"],"a":1,"lang":"python","code":"total = 0\nfor i in range(1, 5):\n    total += i\nprint(total)","why":"`range(1, 5)` is 1, 2, 3, 4, and 1 + 2 + 3 + 4 = 10.","id":"py3-t1","kind":"mcq","type":"trace"},{"q":"What does this print?","choices":["2","3","4","5"],"a":1,"lang":"python","code":"n = 10\ncount = 0\nwhile n > 1:\n    n = n // 2\n    count += 1\nprint(count)","why":"n goes 10 → 5 → 2 → 1. That's 3 loops, and then `n > 1` is False.","id":"py3-t2","kind":"mcq","type":"trace"}],"bug":[{"q":"This should add up the numbers 1 to 10, but it prints 45. Click the bug.","lang":"python","code":"# add up the numbers 1 to 10\ntotal = 0\nfor n in range(1, 10):\n    total = total + n\nprint(total)","lines":[3],"fix":"for n in range(1, 11):","why":"`range(1, 10)` stops at 9. To include 10, the stop value must be 11. This is a classic **off-by-one** error.","id":"py3-b1","kind":"bug","type":"bug"}]},{"id":"py4","title":"Functions","lessons":[{"title":"Writing your own functions","mins":10,"html":"<p>A <strong>function</strong> is a named, reusable block of code. You define it once and call it as many times as you want.</p>\n<pre><code class=\"language-python-run\">def area(width, height):      # parameters\n    return width * height\n\nbig = area(10, 4)             # arguments: 10, 4\nprint(big)                    # 40\n</code></pre>\n<ul>\n<li><strong>Parameters</strong> are the variable names in the definition (<code>width</code>, <code>height</code>).</li>\n<li><strong>Arguments</strong> are the actual values you pass in (<code>10</code>, <code>4</code>).</li>\n</ul>\n<h3>return vs print</h3>\n<p><code>return</code> <strong>sends a value back</strong> to the code that called the function. <code>print</code> only shows text on the screen. A function without a <code>return</code> gives back <code>None</code>.</p>\n<pre><code class=\"language-python-run\">def shout(word):\n    print(word.upper())\n\nx = shout(&quot;hi&quot;)   # prints HI\nprint(x)          # None\n</code></pre>\n<h3>Default parameters</h3>\n<pre><code class=\"language-python\">def greet(name, greeting=&quot;Hello&quot;):\n    return greeting + &quot;, &quot; + name\n\ngreet(&quot;Sam&quot;)            # &quot;Hello, Sam&quot;\ngreet(&quot;Sam&quot;, &quot;Yo&quot;)      # &quot;Yo, Sam&quot;\n</code></pre>\n<h3>Scope</h3>\n<p>Variables created inside a function are <strong>local</strong>. They disappear when the function ends and can&#39;t be seen from outside.</p>\n<blockquote>\n<p><strong>Why functions?</strong> They let you reuse code, make programs easier to read, and hide details. This last idea is called <strong>abstraction</strong>.</p>\n</blockquote>\n","text":"A function is a named, reusable block of code. You define it once and call it as many times as you want. python run def area(width, height): parameters return width height big = area(10, 4) arguments: 10, 4 print(big) 40 Parameters are the variable names in the definition ( width , height ). Arguments are the actual values you pass in ( 10 , 4 ). return vs print return sends a value back to the code that called the function. print only shows text on the screen. A function without a return gives back None . python run def shout(word): print(word.upper()) x = shout(\"hi\") prints HI print(x) None Default parameters python def greet(name, greeting=\"Hello\"): return greeting + \", \" + name greet(\"Sam\") \"Hello, Sam\" greet(\"Sam\", \"Yo\") \"Yo, Sam\" Scope Variables created inside a function are local . They disappear when the function ends and can't be seen from outside. Why functions? They let you reuse code, make programs easier to read, and hide details. This last idea is called abstraction .","quizzes":[]}],"ex":[{"id":"py4-e1","title":"Count the vowels","lang":"python","mins":10,"prompt":"<p>Write <code>count_vowels(word)</code> that returns how many vowels (a, e, i, o, u) the word contains. Count uppercase vowels too.</p>\n","starter":"def count_vowels(word):\n    pass","tests":["assert count_vowels(\"banana\") == 3, \"banana has 3 vowels\"","assert count_vowels(\"rhythm\") == 0, \"rhythm has 0 vowels\"","assert count_vowels(\"AEIOU\") == 5, \"Count uppercase vowels too\"","assert count_vowels(\"\") == 0, \"An empty string has 0 vowels\""],"solution":"def count_vowels(word):\n    count = 0\n    for ch in word.lower():\n        if ch in \"aeiou\":\n            count += 1\n    return count","hint":"Loop over `word.lower()` and check `if ch in \"aeiou\"`.","hints":["Loop over `word.lower()` and check `if ch in \"aeiou\"`."],"visual":false,"unit":"py4"},{"id":"py4-e2","title":"Largest of three","lang":"python","mins":8,"prompt":"<p>Write <code>largest(a, b, c)</code> that returns the biggest of three numbers. <strong>Don&#39;t</strong> use the built-in <code>max()</code>. Use <code>if</code> statements instead.</p>\n","starter":"def largest(a, b, c):\n    pass","tests":["assert largest(1, 2, 3) == 3, \"largest(1, 2, 3) should be 3\"","assert largest(9, 2, 3) == 9, \"largest(9, 2, 3) should be 9\"","assert largest(4, 7, 5) == 7, \"largest(4, 7, 5) should be 7\"","assert largest(-5, -2, -9) == -2, \"Works with negative numbers\""],"solution":"def largest(a, b, c):\n    best = a\n    if b > best:\n        best = b\n    if c > best:\n        best = c\n    return best","hint":"Start with `best = a`, then compare it with `b` and with `c`.","hints":["Start with `best = a`, then compare it with `b` and with `c`."],"visual":false,"unit":"py4"}],"fill":[],"quiz":[{"q":"What does a function return if it has no `return` statement?","choices":["0","An empty string","`None`","It causes an error"],"a":2,"why":"Every Python function returns something. If you don't return a value, it returns `None`.","id":"py4-q1","kind":"mcq","type":"quiz"},{"q":"In `def add(a, b):`, what are `a` and `b`?","choices":["Parameters","Arguments","Return values","Global variables"],"a":0,"why":"Names in the definition are **parameters**. The values you pass when calling are **arguments**.","id":"py4-q2","kind":"mcq","type":"quiz"},{"q":"Given `def f(x=2): return x * 3`, what is `f()`?","choices":["Error","0","6","None"],"a":2,"why":"No argument is passed, so `x` uses its default value 2, and 2 × 3 = 6.","id":"py4-q3","kind":"mcq","type":"quiz"},{"q":"A variable is created inside a function. Can code outside the function use it?","choices":["Yes, always","No, it's local to the function","Only if it's a number","Only after the function is called twice"],"a":1,"why":"Variables made inside a function are **local**. Use `return` to get values out.","id":"py4-q4","kind":"mcq","type":"quiz"},{"q":"What is the main benefit of breaking a program into functions?","choices":["It makes the program run faster","Code can be reused and understood in smaller pieces","Functions use less memory","Python requires it"],"a":1,"why":"Functions give you **reuse** and **abstraction**: you can use `area()` without thinking about how it works inside.","id":"py4-q5","kind":"mcq","type":"quiz"}],"trace":[{"q":"What does this print?","choices":["-5","1","11","6"],"a":2,"lang":"python","code":"def mystery(a, b):\n    if a > b:\n        return a - b\n    return b - a\n\nprint(mystery(3, 8) + mystery(10, 4))","why":"`mystery(3, 8)` gives 8 − 3 = 5 and `mystery(10, 4)` gives 10 − 4 = 6. The function finds the distance between two numbers, and 5 + 6 = 11.","id":"py4-t1","kind":"mcq","type":"trace"},{"q":"What does this print?","choices":["Hi Sam, then Hi Sam","Hi Sam, then None","None","Hi Sam"],"a":1,"lang":"python","code":"def greet(name):\n    print(\"Hi \" + name)\n\nx = greet(\"Sam\")\nprint(x)","why":"`greet` prints \"Hi Sam\" but has no `return`, so `x` is `None`, which is printed next.","id":"py4-t2","kind":"mcq","type":"trace"}],"bug":[{"q":"This prints `Area: None` instead of `Area: 12`. Click the bug.","lang":"python","code":"def area(width, height):\n    result = width * height\n\na = area(3, 4)\nprint(\"Area:\", a)","lines":[2],"fix":"return width * height","why":"The function calculates the result but never **returns** it, so the call gives back `None`.","id":"py4-b1","kind":"bug","type":"bug"}]},{"id":"py5","title":"Lists & Strings","lessons":[{"title":"Working with lists and strings","mins":12,"html":"<p>A <strong>list</strong> holds many values in order. Each item has an <strong>index</strong> that starts at <strong>0</strong>.</p>\n<pre><code class=\"language-python\">nums = [4, 8, 15, 16, 23, 42]\nnums[0]      # 4   (first)\nnums[-1]     # 42  (last)\nlen(nums)    # 6\nnums.append(99)   # adds to the end\nnums[1] = 7       # lists can be changed\n</code></pre>\n<h3>Slicing</h3>\n<p><code>seq[start:stop]</code> takes a piece from <code>start</code> up to, <strong>but not including</strong>, <code>stop</code>. This works on lists and strings.</p>\n<pre><code class=\"language-python\">word = &quot;computer&quot;\nword[0:3]    # &quot;com&quot;\nword[3:]     # &quot;puter&quot;\nword[::-1]   # &quot;retupmoc&quot;  (reversed)\n</code></pre>\n<h3>Strings are immutable</h3>\n<p>You can&#39;t change a single character in a string. <code>word[0] = &quot;C&quot;</code> causes a <strong>TypeError</strong>. Build a new string instead: <code>word = &quot;C&quot; + word[1:]</code>.</p>\n<h3>Looping through a list</h3>\n<pre><code class=\"language-python\">for score in scores:                 # by value\n    print(score)\n\nfor i in range(len(scores)):         # by index\n    print(i, scores[i])\n</code></pre>\n<h3>Handy methods</h3>\n<ul>\n<li><strong>Strings:</strong> <code>.upper()</code>, <code>.lower()</code>, <code>.strip()</code>, <code>.split()</code>, <code>.replace(a, b)</code>, <code>.find(x)</code></li>\n<li><strong>Lists:</strong> <code>.append(x)</code>, <code>.insert(i, x)</code>, <code>.pop()</code>, <code>.remove(x)</code>, <code>.sort()</code>, <code>x in list</code></li>\n</ul>\n","text":"A list holds many values in order. Each item has an index that starts at 0 . python nums = [4, 8, 15, 16, 23, 42] nums[0] 4 (first) nums[ 1] 42 (last) len(nums) 6 nums.append(99) adds to the end nums[1] = 7 lists can be changed Slicing seq[start:stop] takes a piece from start up to, but not including , stop . This works on lists and strings. python word = \"computer\" word[0:3] \"com\" word[3:] \"puter\" word[:: 1] \"retupmoc\" (reversed) Strings are immutable You can't change a single character in a string. word[0] = \"C\" causes a TypeError . Build a new string instead: word = \"C\" + word[1:] . Looping through a list python for score in scores: by value print(score) for i in range(len(scores)): by index print(i, scores[i]) Handy methods Strings: .upper() , .lower() , .strip() , .split() , .replace(a, b) , .find(x) Lists: .append(x) , .insert(i, x) , .pop() , .remove(x) , .sort() , x in list ","quizzes":[]}],"ex":[{"id":"py5-e1","title":"Average of a list","lang":"python","mins":10,"prompt":"<p>Write <code>average(nums)</code> that returns the average of a list of numbers. If the list is empty, return <code>0</code> (don&#39;t divide by zero!).</p>\n","starter":"def average(nums):\n    pass","tests":["assert average([90, 80, 70]) == 80, \"average([90, 80, 70]) should be 80\"","assert average([5]) == 5, \"average([5]) should be 5\"","assert average([]) == 0, \"An empty list should return 0\"","assert abs(average([1, 2]) - 1.5) < 1e-9, \"average([1, 2]) should be 1.5\""],"solution":"def average(nums):\n    if len(nums) == 0:\n        return 0\n    return sum(nums) / len(nums)","hint":"Check `len(nums) == 0` first.","hints":["Check `len(nums) == 0` first."],"visual":false,"unit":"py5"},{"id":"py5-e2","title":"Reverse the words","lang":"python","mins":10,"prompt":"<p>Write <code>reverse_words(sentence)</code> that reverses the <strong>order of the words</strong>. For example, <code>&quot;I love CS&quot;</code> becomes <code>&quot;CS love I&quot;</code>.</p>\n","starter":"def reverse_words(sentence):\n    pass","tests":["assert reverse_words(\"I love CS\") == \"CS love I\", '\"I love CS\" should become \"CS love I\"'","assert reverse_words(\"hello\") == \"hello\", \"A single word stays the same\"","assert reverse_words(\"a b c d\") == \"d c b a\", '\"a b c d\" should become \"d c b a\"'"],"solution":"def reverse_words(sentence):\n    words = sentence.split()\n    return \" \".join(words[::-1])","hint":"Use `.split()` to get a list, reverse it with `[::-1]`, then `\" \".join(...)` it back together.","hints":["Use `.split()` to get a list, reverse it with `[::-1]`, then `\" \".join(...)` it back together."],"visual":false,"unit":"py5"}],"fill":[],"quiz":[{"q":"`nums = [4, 8, 15, 16, 23, 42]`. What is `nums[-2]`?","choices":["8","16","23","42"],"a":2,"why":"Negative indexes count from the end: `-1` is 42 and `-2` is 23.","id":"py5-q1","kind":"mcq","type":"quiz"},{"q":"What is `\"computer\"[1:4]`?","choices":["\"comp\"","\"omp\"","\"ompu\"","\"om\""],"a":1,"why":"The slice takes index 1 up to, but not including, index 4: o, m, p.","id":"py5-q2","kind":"mcq","type":"quiz"},{"q":"What is `len([1, [2, 3], 4])`?","choices":["3","4","2","Error"],"a":0,"why":"The list holds three items. The inner list `[2, 3]` counts as one item.","id":"py5-q3","kind":"mcq","type":"quiz"},{"q":"What happens when you run `s = \"java\"` and then `s[0] = \"J\"`?","choices":["s becomes \"Java\"","TypeError, because strings can't be changed in place","s becomes \"Jjava\"","Nothing"],"a":1,"why":"Strings are **immutable**. Make a new string instead, for example `\"J\" + s[1:]`.","id":"py5-q4","kind":"mcq","type":"quiz"},{"q":"What does `nums.append(5)` do?","choices":["Returns a new list with 5 added","Adds 5 to the end of `nums` itself","Adds 5 to the start","Replaces the last item with 5"],"a":1,"why":"`append` changes the list **in place** and returns `None`.","id":"py5-q5","kind":"mcq","type":"quiz"}],"trace":[{"q":"What does this print?","choices":["3 s","4 s","4 c","4 study"],"a":1,"lang":"python","code":"words = [\"code\", \"study\", \"win\"]\nwords.append(\"repeat\")\nprint(len(words), words[1][0])","why":"After `append` there are 4 items. `words[1]` is \"study\", and its index-0 character is \"s\".","id":"py5-t1","kind":"mcq","type":"trace"},{"q":"What does this print?","choices":["2 BAN","3 BAN","3 ban","3 BANA"],"a":1,"lang":"python","code":"s = \"banana\"\ncount = 0\nfor ch in s:\n    if ch == \"a\":\n        count += 1\nprint(count, s.upper()[0:3])","why":"\"banana\" contains three a's. `s.upper()` is \"BANANA\", and `[0:3]` is \"BAN\".","id":"py5-t2","kind":"mcq","type":"trace"}],"bug":[{"q":"This should find the highest score but crashes with an IndexError. Click the bug.","lang":"python","code":"scores = [90, 85, 77, 100]\nbest = scores[0]\nfor i in range(len(scores) + 1):\n    if scores[i] > best:\n        best = scores[i]\nprint(best)","lines":[3],"fix":"for i in range(len(scores)):","why":"Valid indexes are 0 to 3. `range(len(scores) + 1)` reaches index 4, which doesn't exist.","id":"py5-b1","kind":"bug","type":"bug"}]}]},{"id":"web","title":"Web Development","short":"HTML · CSS · JS","emoji":"🕸️","year":1,"yearLabel":"Freshman / Sophomore","color":"#f97316","blurb":"Build real web pages: structure with HTML, style with CSS, and make them interactive with JavaScript.","units":[{"id":"web1","title":"HTML Structure","lessons":[{"title":"Tags, elements and page structure","mins":10,"html":"<p>HTML describes the <strong>structure</strong> of a web page using <strong>tags</strong>. Most elements have an opening tag and a closing tag:</p>\n<pre><code class=\"language-html\">&lt;p&gt;This is a paragraph.&lt;/p&gt;\n&lt;a href=&quot;https://example.com&quot;&gt;A link&lt;/a&gt;\n&lt;img src=&quot;cat.png&quot; alt=&quot;An orange cat sleeping&quot;&gt;\n</code></pre>\n<ul>\n<li><code>href</code>, <code>src</code> and <code>alt</code> are <strong>attributes</strong>. They give extra information about an element.</li>\n<li><code>&lt;img&gt;</code> is a <strong>void element</strong>, which means it has no closing tag.</li>\n</ul>\n<h3>Every page has a skeleton</h3>\n<pre><code class=\"language-html\">&lt;!DOCTYPE html&gt;\n&lt;html lang=&quot;en&quot;&gt;\n  &lt;head&gt;\n    &lt;title&gt;My Page&lt;/title&gt;      &lt;!-- shows in the browser tab --&gt;\n  &lt;/head&gt;\n  &lt;body&gt;\n    &lt;h1&gt;Hello!&lt;/h1&gt;              &lt;!-- visible content --&gt;\n  &lt;/body&gt;\n&lt;/html&gt;\n</code></pre>\n<h3>Semantic HTML</h3>\n<p>Use tags that describe <strong>meaning</strong>, not just looks: <code>&lt;header&gt;</code>, <code>&lt;nav&gt;</code>, <code>&lt;main&gt;</code>, <code>&lt;section&gt;</code>, <code>&lt;article&gt;</code>, <code>&lt;footer&gt;</code>. Screen readers and search engines understand them better than a pile of <code>&lt;div&gt;</code>s.</p>\n<h3>Headings and lists</h3>\n<ul>\n<li>Headings go from <code>&lt;h1&gt;</code> (biggest, used once per page) down to <code>&lt;h6&gt;</code>.</li>\n<li><code>&lt;ul&gt;</code> makes a bulleted list and <code>&lt;ol&gt;</code> makes a numbered list. Each item goes in an <code>&lt;li&gt;</code>.</li>\n</ul>\n<blockquote>\n<p><strong>Accessibility:</strong> Always give images an <code>alt</code> description so people using screen readers know what they show.</p>\n</blockquote>\n","text":"HTML describes the structure of a web page using tags . Most elements have an opening tag and a closing tag: html <p This is a paragraph.</p <a href=\"https://example.com\" A link</a <img src=\"cat.png\" alt=\"An orange cat sleeping\" href , src and alt are attributes . They give extra information about an element. <img is a void element , which means it has no closing tag. Every page has a skeleton html <!DOCTYPE html <html lang=\"en\" <head <title My Page</title <! shows in the browser tab </head <body <h1 Hello!</h1 <! visible content </body </html Semantic HTML Use tags that describe meaning , not just looks: <header , <nav , <main , <section , <article , <footer . Screen readers and search engines understand them better than a pile of <div s. Headings and lists Headings go from <h1 (biggest, used once per page) down to <h6 . <ul makes a bulleted list and <ol makes a numbered list. Each item goes in an <li . Accessibility: Always give images an alt description so people using screen readers know what they show.","quizzes":[]}],"ex":[{"id":"web1-e1","title":"Build a profile page","lang":"html","mins":12,"prompt":"<p>Build a small &quot;about me&quot; page. It needs:</p>\n<ol>\n<li>An <code>&lt;h1&gt;</code> with your nickname</li>\n<li>A <code>&lt;p&gt;</code> that says something about you</li>\n<li>An <code>&lt;img&gt;</code> with an <code>alt</code> description (any <code>src</code> is fine)</li>\n<li>A <code>&lt;ul&gt;</code> with <strong>at least 3</strong> <code>&lt;li&gt;</code> items (your favorite languages or games)</li>\n<li>A link <code>&lt;a&gt;</code> with an <code>href</code></li>\n</ol>\n","starter":"<!DOCTYPE html>\n<html>\n  <head>\n    <title>About me</title>\n  </head>\n  <body>\n    <!-- build your page here -->\n\n  </body>\n</html>","tests":["assert(doc.querySelector(\"h1\") && doc.querySelector(\"h1\").textContent.trim(), \"Add an <h1> with text in it\")","assert(doc.querySelector(\"p\") && doc.querySelector(\"p\").textContent.trim(), \"Add a <p> paragraph with text\")","assert(doc.querySelector(\"img\") && (doc.querySelector(\"img\").getAttribute(\"alt\") || \"\").trim(), \"Add an <img> with an alt description\")","assert(doc.querySelectorAll(\"ul li\").length >= 3, \"Add a <ul> with at least 3 <li> items\")","assert(doc.querySelector(\"a[href]\"), \"Add a link: <a href=\\\"...\\\">\")"],"solution":"<!DOCTYPE html>\n<html>\n  <head>\n    <title>About me</title>\n  </head>\n  <body>\n    <h1>ByteSized</h1>\n    <p>I'm a sophomore who likes building games.</p>\n    <img src=\"me.png\" alt=\"A cartoon fox wearing headphones\">\n    <ul>\n      <li>Python</li>\n      <li>JavaScript</li>\n      <li>Java</li>\n    </ul>\n    <a href=\"https://example.com\">My projects</a>\n  </body>\n</html>","hint":"Put everything inside `<body>`. Each `<li>` goes inside the `<ul>`.","hints":["Put everything inside `<body>`. Each `<li>` goes inside the `<ul>`."],"visual":false,"unit":"web1"}],"fill":[],"quiz":[{"q":"Which tag makes the largest heading?","choices":["`<h1>`","`<h6>`","`<head>`","`<header>`"],"a":0,"why":"Headings go from `<h1>` (most important and largest) to `<h6>`. `<head>` holds page info, not visible headings.","id":"web1-q1","kind":"mcq","type":"quiz"},{"q":"Which attribute sets where a link goes?","choices":["`src`","`href`","`link`","`alt`"],"a":1,"why":"`<a href=\"...\">` sets the link destination. `src` is used for images and scripts.","id":"web1-q2","kind":"mcq","type":"quiz"},{"q":"What is the `alt` attribute on an image for?","choices":["Making the image bigger","Describing the image for screen readers, or if it fails to load","Adding a caption under the image","Linking the image to another page"],"a":1,"why":"`alt` text is read aloud by screen readers and shown if the image can't load.","id":"web1-q3","kind":"mcq","type":"quiz"},{"q":"Which of these is a **semantic** element?","choices":["`<div>`","`<span>`","`<nav>`","`<b>`"],"a":2,"why":"`<nav>` tells browsers and screen readers that the section holds navigation links. `<div>` has no meaning.","id":"web1-q4","kind":"mcq","type":"quiz"},{"q":"Where does the `<title>` element go?","choices":["Inside `<head>`","Inside `<body>`","Before `<!DOCTYPE html>`","Inside `<h1>`"],"a":0,"why":"`<title>` belongs in `<head>`. It sets the text shown in the browser tab.","id":"web1-q5","kind":"mcq","type":"quiz"}],"trace":[{"q":"How does this HTML appear in the browser?","choices":["Learn HTML first. (all plain text)","Learn **HTML** *first*. (HTML in bold, \"first\" in italics)","Learn *HTML* **first**. (HTML in italics, \"first\" in bold)","The tags are shown as text"],"a":1,"lang":"html","code":"<p>Learn <strong>HTML</strong> <em>first</em>.</p>","why":"`<strong>` shows as bold (and means \"important\"). `<em>` shows as italics (and means \"emphasis\").","id":"web1-t1","kind":"mcq","type":"trace"}],"bug":[{"q":"This page shows up wrong. Click the broken line.","lang":"html","code":"<body>\n  <h1>Welcome</h2>\n  <p>Thanks for visiting.</p>\n  <a href=\"about.html\">About me</a>\n</body>","lines":[2],"fix":"<h1>Welcome</h1>","why":"The opening and closing tags must match. `<h1>` must be closed with `</h1>`.","id":"web1-b1","kind":"bug","type":"bug"}]},{"id":"web2","title":"CSS Styling & Layout","lessons":[{"title":"Selectors, the box model and flexbox","mins":12,"html":"<p>CSS controls how a page <strong>looks</strong>. A rule has a <strong>selector</strong> and a set of <strong>declarations</strong>:</p>\n<pre><code class=\"language-css\">p { color: navy; font-size: 18px; }   /* every &lt;p&gt; */\n.card { border-radius: 8px; }         /* class=&quot;card&quot; */\n#hero { height: 400px; }              /* id=&quot;hero&quot; */\n</code></pre>\n<h3>Specificity</h3>\n<p>When rules conflict, the more <strong>specific</strong> selector wins: <strong>id &gt; class &gt; element</strong>. If two rules are equally specific, the one that comes <strong>later</strong> wins.</p>\n<h3>The box model</h3>\n<p>Every element is a box. From the inside out, the box has four layers:</p>\n<ol>\n<li><strong>content</strong>: the text or image</li>\n<li><strong>padding</strong>: space inside the border</li>\n<li><strong>border</strong>: the edge of the box</li>\n<li><strong>margin</strong>: space outside the border</li>\n</ol>\n<p>By default, <code>width</code> sets the size of the content only, so padding and border are <strong>added</strong> on top. Set <code>box-sizing: border-box</code> to make <code>width</code> include them.</p>\n<h3>Flexbox</h3>\n<pre><code class=\"language-css\">.row {\n  display: flex;\n  justify-content: center;  /* main axis (horizontal by default) */\n  align-items: center;      /* cross axis (vertical) */\n  gap: 12px;\n}\n</code></pre>\n<h3>Responsive design</h3>\n<pre><code class=\"language-css\">@media (max-width: 600px) {\n  .row { flex-direction: column; }  /* stack items on small screens */\n}\n</code></pre>\n","text":"CSS controls how a page looks . A rule has a selector and a set of declarations : css p { color: navy; font size: 18px; } / every <p / .card { border radius: 8px; } / class=\"card\" / hero { height: 400px; } / id=\"hero\" / Specificity When rules conflict, the more specific selector wins: id class element . If two rules are equally specific, the one that comes later wins. The box model Every element is a box. From the inside out, the box has four layers: 1. content : the text or image 2. padding : space inside the border 3. border : the edge of the box 4. margin : space outside the border By default, width sets the size of the content only, so padding and border are added on top. Set box sizing: border box to make width include them. Flexbox css .row { display: flex; justify content: center; / main axis (horizontal by default) / align items: center; / cross axis (vertical) / gap: 12px; } Responsive design css @media (max width: 600px) { .row { flex direction: column; } / stack items on small screens / } ","quizzes":[]}],"ex":[{"id":"web2-e1","title":"Style a button","lang":"html","mins":10,"prompt":"<p>Make the <code>.btn</code> button look like a real button with CSS. It needs:</p>\n<ol>\n<li>A <code>background-color</code></li>\n<li>Rounded corners (<code>border-radius</code> greater than 0)</li>\n<li><code>padding</code></li>\n<li>White text (<code>color: white</code>)</li>\n</ol>\n","starter":"<style>\n  .btn {\n    /* your CSS here */\n  }\n</style>\n\n<button class=\"btn\">Start studying</button>","tests":["assert(win.getComputedStyle(doc.querySelector(\".btn\")).borderRadius !== \"0px\", \"Give .btn a border-radius\")","assert(parseFloat(win.getComputedStyle(doc.querySelector(\".btn\")).paddingLeft) > 2, \"Give .btn some padding\")","assert(win.getComputedStyle(doc.querySelector(\".btn\")).color === \"rgb(255, 255, 255)\", \"Make the text white: color: white\")","assert(![\"rgba(0, 0, 0, 0)\", \"rgb(239, 239, 239)\", \"rgb(240, 240, 240)\"].includes(win.getComputedStyle(doc.querySelector(\".btn\")).backgroundColor), \"Set a background-color\")"],"solution":"<style>\n  .btn {\n    background-color: #2563eb;\n    color: white;\n    padding: 10px 18px;\n    border: none;\n    border-radius: 8px;\n  }\n</style>\n\n<button class=\"btn\">Start studying</button>","hint":"Each property ends with a semicolon, like `padding: 10px 18px;`","hints":["Each property ends with a semicolon, like `padding: 10px 18px;`"],"visual":false,"unit":"web2"},{"id":"web2-e2","title":"Center with flexbox","lang":"html","mins":10,"prompt":"<p>Use flexbox to put the three boxes <strong>in a row</strong> and <strong>center them horizontally</strong> inside <code>.row</code>.</p>\n","starter":"<style>\n  .row {\n    /* make this a flex container and center the items */\n  }\n  .box { width: 60px; height: 60px; background: tomato; margin: 4px; }\n</style>\n\n<div class=\"row\">\n  <div class=\"box\"></div>\n  <div class=\"box\"></div>\n  <div class=\"box\"></div>\n</div>","tests":["assert(win.getComputedStyle(doc.querySelector(\".row\")).display === \"flex\", \"Set display: flex on .row\")","assert(win.getComputedStyle(doc.querySelector(\".row\")).justifyContent === \"center\", \"Center the items with justify-content: center\")"],"solution":"<style>\n  .row {\n    display: flex;\n    justify-content: center;\n  }\n  .box { width: 60px; height: 60px; background: tomato; margin: 4px; }\n</style>\n\n<div class=\"row\">\n  <div class=\"box\"></div>\n  <div class=\"box\"></div>\n  <div class=\"box\"></div>\n</div>","hint":"You need two lines: `display: flex;` and `justify-content: center;`","hints":["You need two lines: `display: flex;` and `justify-content: center;`"],"visual":false,"unit":"web2"}],"fill":[],"quiz":[{"q":"What does the selector `.card` target?","choices":["All `<card>` elements","Elements with `class=\"card\"`","The element with `id=\"card\"`","Only the first card"],"a":1,"why":"A dot means **class** and a `#` means **id**. A selector with no symbol, like `p`, matches a tag name.","id":"web2-q1","kind":"mcq","type":"quiz"},{"q":"What is the box model order from the inside out?","choices":["margin, border, padding, content","content, padding, border, margin","content, margin, border, padding","padding, content, border, margin"],"a":1,"why":"Content sits in the middle, padding surrounds it, then the border, then margin on the outside.","id":"web2-q2","kind":"mcq","type":"quiz"},{"q":"An element has both an id rule and a class rule that set its `color`. Which wins?","choices":["The id rule","The class rule","Whichever is shorter","Neither, so the default color is used"],"a":0,"why":"id selectors are more specific than class selectors.","id":"web2-q3","kind":"mcq","type":"quiz"},{"q":"What does `justify-content: center` do in a flex container (default direction)?","choices":["Centers items horizontally","Centers items vertically","Centers the text inside each item","Nothing without `float`"],"a":0,"why":"`justify-content` works along the **main axis**, which is horizontal for `flex-direction: row`.","id":"web2-q4","kind":"mcq","type":"quiz"},{"q":"When do the rules inside `@media (max-width: 600px)` apply?","choices":["On screens wider than 600px","On screens 600px wide or narrower","Only when printing","Always"],"a":1,"why":"`max-width: 600px` means \"up to 600px wide\". This is how you make layouts adapt to phones.","id":"web2-q5","kind":"mcq","type":"quiz"}],"trace":[{"q":"What color is the text \"Hello\"?","choices":["blue","green","red","black"],"a":2,"lang":"css","code":"p      { color: blue; }\n.note  { color: green; }\n#first { color: red; }\n\n<p id=\"first\" class=\"note\">Hello</p>","why":"All three rules match, and the id selector `#first` has the highest specificity.","id":"web2-t1","kind":"mcq","type":"trace"},{"q":"With the default `box-sizing`, how wide is this box from border edge to border edge?","choices":["200px","220px","224px","234px"],"a":2,"lang":"css","code":".box {\n  width: 200px;\n  padding: 10px;\n  border: 2px solid black;\n  margin: 5px;\n}","why":"200 (content) + 10 + 10 (padding) + 2 + 2 (border) = 224px. Margin is outside the border, so it isn't counted.","id":"web2-t2","kind":"mcq","type":"trace"}],"bug":[{"q":"The button's padding doesn't work. Click the broken line.","lang":"css","code":".btn {\n  background-color: #2563eb;\n  color: white\n  padding: 8px 16px;\n  border-radius: 6px;\n}","lines":[3],"fix":"color: white;","why":"The missing semicolon makes the browser read `color: white padding: 8px 16px` as one broken declaration, so both are ignored.","id":"web2-b1","kind":"bug","type":"bug"}]},{"id":"web3","title":"JavaScript Basics","lessons":[{"title":"Variables, types and functions in JS","mins":12,"html":"<p>JavaScript makes web pages interactive.</p>\n<pre><code class=\"language-js-run\">let score = 0;          // can be reassigned\nconst name = &quot;Ada&quot;;     // can&#39;t be reassigned\nscore = score + 10;\nconsole.log(`${name} has ${score} points`);  // template literal\n</code></pre>\n<p>Use <code>const</code> by default and <code>let</code> when the value needs to change. You&#39;ll see <code>var</code> in old code, but avoid it.</p>\n<h3>Type coercion gotchas</h3>\n<pre><code class=\"language-js\">&quot;5&quot; + 3    // &quot;53&quot;  (+ joins strings)\n&quot;5&quot; - 3    // 2     (- converts to numbers)\n5 == &quot;5&quot;   // true  (loose: converts types)\n5 === &quot;5&quot;  // false (strict: types must match)\n</code></pre>\n<p>Always use <code>===</code> and <code>!==</code>.</p>\n<h3>Functions</h3>\n<pre><code class=\"language-js\">function square(x) { return x * x; }\nconst cube = (x) =&gt; x * x * x;     // arrow function\n</code></pre>\n<h3>Arrays and loops</h3>\n<pre><code class=\"language-js-run\">const nums = [3, 6, 9];\nfor (const n of nums) console.log(n);\nnums.push(12);                        // add to end\nconst doubled = nums.map(n =&gt; n * 2); // [6, 12, 18, 24]\nconst big = nums.filter(n =&gt; n &gt; 5);  // [6, 9, 12]\n</code></pre>\n","text":"JavaScript makes web pages interactive. js run let score = 0; // can be reassigned const name = \"Ada\"; // can't be reassigned score = score + 10; console.log( ${name} has ${score} points ); // template literal Use const by default and let when the value needs to change. You'll see var in old code, but avoid it. Type coercion gotchas js \"5\" + 3 // \"53\" (+ joins strings) \"5\" 3 // 2 ( converts to numbers) 5 == \"5\" // true (loose: converts types) 5 === \"5\" // false (strict: types must match) Always use === and !== . Functions js function square(x) { return x x; } const cube = (x) = x x x; // arrow function Arrays and loops js run const nums = [3, 6, 9]; for (const n of nums) console.log(n); nums.push(12); // add to end const doubled = nums.map(n = n 2); // [6, 12, 18, 24] const big = nums.filter(n = n 5); // [6, 9, 12] ","quizzes":[]},{"title":"Making decisions in JavaScript","mins":10,"html":"<p>JavaScript&#39;s <code>if</code> works like Python&#39;s. The condition goes in <strong>parentheses</strong>, and the block goes in <strong>curly braces</strong>:</p>\n<pre><code class=\"language-js-run\">const score = 82;\nif (score &gt;= 90) {\n  console.log(&quot;A&quot;);\n} else if (score &gt;= 80) {\n  console.log(&quot;B&quot;);\n} else {\n  console.log(&quot;Keep practicing!&quot;);\n}\n</code></pre>\n<p>Notice it&#39;s <code>else if</code> (two words). Indentation is just for humans, because the braces decide what belongs to the block.</p>\n<div class=\"lq\" data-lq=\"0\"></div><h3>Logical operators</h3>\n<table>\n<thead>\n<tr>\n<th>JavaScript</th>\n<th>Python</th>\n<th>Meaning</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><code>&amp;&amp;</code></td>\n<td><code>and</code></td>\n<td>both are true</td>\n</tr>\n<tr>\n<td><code>||</code></td>\n<td><code>or</code></td>\n<td>at least one is true</td>\n</tr>\n<tr>\n<td><code>!</code></td>\n<td><code>not</code></td>\n<td>flips true and false</td>\n</tr>\n</tbody></table>\n<p>Always compare with <code>===</code> and <code>!==</code> (strict), never <code>==</code>.</p>\n<h3>Truthy and falsy</h3>\n<p>In a condition, these count as <strong>false</strong>: <code>false</code>, <code>0</code>, <code>&quot;&quot;</code>, <code>null</code>, <code>undefined</code> and <code>NaN</code>. Everything else is truthy, including <code>&quot;0&quot;</code> and <code>[]</code>!</p>\n<pre><code class=\"language-js-run\">const name = &quot;&quot;;\nif (name) {\n  console.log(&quot;Hi &quot; + name);\n} else {\n  console.log(&quot;No name given&quot;);\n}\nconsole.log(Boolean(&quot;0&quot;), Boolean([]), Boolean(0));\n</code></pre>\n<div class=\"lq\" data-lq=\"1\"></div><h3>The ternary operator</h3>\n<p><code>condition ? valueIfTrue : valueIfFalse</code> picks one of two values:</p>\n<pre><code class=\"language-js-run\">const age = 15;\nconst label = age &gt;= 13 ? &quot;teen&quot; : &quot;kid&quot;;\nconsole.log(label);\n</code></pre>\n<h3>switch</h3>\n<p><code>switch</code> compares one value against many <code>case</code>s. Don&#39;t forget <code>break</code>, or the code <strong>falls through</strong> into the next case!</p>\n<pre><code class=\"language-js-run\">const light = &quot;yellow&quot;;\nswitch (light) {\n  case &quot;green&quot;:\n    console.log(&quot;Go&quot;);\n    break;\n  case &quot;yellow&quot;:\n    console.log(&quot;Slow down&quot;);\n    break;\n  default:\n    console.log(&quot;Stop&quot;);\n}\n</code></pre>\n<div class=\"lq\" data-lq=\"2\"></div>\n","text":"JavaScript's if works like Python's. The condition goes in parentheses , and the block goes in curly braces : js run const score = 82; if (score = 90) { console.log(\"A\"); } else if (score = 80) { console.log(\"B\"); } else { console.log(\"Keep practicing!\"); } Notice it's else if (two words). Indentation is just for humans, because the braces decide what belongs to the block. Logical operators JavaScript Python Meaning && and both are true \\ \\ or at least one is true ! not flips true and false Always compare with === and !== (strict), never == . Truthy and falsy In a condition, these count as false : false , 0 , \"\" , null , undefined and NaN . Everything else is truthy, including \"0\" and [] ! js run const name = \"\"; if (name) { console.log(\"Hi \" + name); } else { console.log(\"No name given\"); } console.log(Boolean(\"0\"), Boolean([]), Boolean(0)); The ternary operator condition ? valueIfTrue : valueIfFalse picks one of two values: js run const age = 15; const label = age = 13 ? \"teen\" : \"kid\"; console.log(label); switch switch compares one value against many case s. Don't forget break , or the code falls through into the next case! js run const light = \"yellow\"; switch (light) { case \"green\": console.log(\"Go\"); break; case \"yellow\": console.log(\"Slow down\"); break; default: console.log(\"Stop\"); } ","quizzes":[{"q":"Which line correctly starts an if statement in JavaScript?","choices":["`if score > 90:`","`if (score > 90) {`","`if score > 90 {`","`if (score > 90):`"],"a":1,"why":"JavaScript needs parentheses around the condition and braces around the block.","id":"web3-L2q1","kind":"mcq","type":"quiz","inline":true},{"q":"Which value is **falsy** in JavaScript?","choices":["`\"0\"`","`[]`","`0`","`\"false\"`"],"a":2,"why":"The number `0` is falsy. Non-empty strings like `\"0\"`, and empty arrays, are truthy.","id":"web3-L2q2","kind":"mcq","type":"quiz","inline":true},{"q":"What happens if you leave out `break` at the end of a `case`?","choices":["Nothing changes","The code keeps running into the next case's code","A SyntaxError","The switch restarts"],"a":1,"why":"Without `break`, execution falls through to the following case. Sometimes that's on purpose, but usually it's a bug.","id":"web3-L2q3","kind":"mcq","type":"quiz","inline":true}]}],"ex":[{"id":"web3-e1","title":"Celsius to Fahrenheit","lang":"js","mins":8,"prompt":"<p>Write a function <code>celsiusToF(c)</code> that returns the temperature in Fahrenheit. The formula is F = C × 9/5 + 32.</p>\n","starter":"function celsiusToF(c) {\n  // return the Fahrenheit value\n}\n\nconsole.log(celsiusToF(100));","tests":["assert(celsiusToF(0) === 32, \"celsiusToF(0) should be 32\")","assert(celsiusToF(100) === 212, \"celsiusToF(100) should be 212\")","assert(celsiusToF(-40) === -40, \"celsiusToF(-40) should be -40\")"],"solution":"function celsiusToF(c) {\n  return c * 9 / 5 + 32;\n}\n\nconsole.log(celsiusToF(100));","hint":"Don't forget `return`.","hints":["Don't forget `return`."],"visual":false,"unit":"web3"},{"id":"web3-e2","title":"Count the evens","lang":"js","mins":10,"prompt":"<p>Write <code>countEvens(arr)</code> that returns how many numbers in the array are even.</p>\n","starter":"function countEvens(arr) {\n  let count = 0;\n  // loop through arr\n  return count;\n}","tests":["assert(countEvens([1, 2, 3, 4]) === 2, \"countEvens([1, 2, 3, 4]) should be 2\")","assert(countEvens([]) === 0, \"An empty array should give 0\")","assert(countEvens([7, 9, 11]) === 0, \"countEvens([7, 9, 11]) should be 0\")","assert(countEvens([0, -2, 10]) === 3, \"0, -2 and 10 are all even\")"],"solution":"function countEvens(arr) {\n  let count = 0;\n  for (const n of arr) {\n    if (n % 2 === 0) count++;\n  }\n  return count;\n}","hint":"`n % 2 === 0` means n is even.","hints":["`n % 2 === 0` means n is even."],"visual":false,"unit":"web3"},{"id":"web3-e3","title":"Ticket price (JavaScript)","lang":"js","mins":10,"prompt":"<p>Write <code>ticketPrice(age)</code> using <code>if</code> / <code>else if</code> / <code>else</code>:</p>\n<ul>\n<li>Under 5: <code>0</code></li>\n<li>5 to 12: <code>8</code></li>\n<li>65 and over: <code>9</code></li>\n<li>Everyone else: <code>14</code></li>\n</ul>\n","starter":"function ticketPrice(age) {\n  // if / else if / else\n}\n\nconsole.log(ticketPrice(30));","tests":["assert(ticketPrice(2) === 0, \"Under 5 is free\")","assert(ticketPrice(12) === 8, \"12 costs 8\")","assert(ticketPrice(65) === 9, \"65 costs 9\")","assert(ticketPrice(30) === 14, \"30 costs 14\")"],"solution":"function ticketPrice(age) {\n  if (age < 5) {\n    return 0;\n  } else if (age <= 12) {\n    return 8;\n  } else if (age >= 65) {\n    return 9;\n  } else {\n    return 14;\n  }\n}\n\nconsole.log(ticketPrice(30));","hint":"In JavaScript, the condition goes in parentheses and the block goes in braces: `if (age < 5) { ... }`.","hints":["In JavaScript, the condition goes in parentheses and the block goes in braces: `if (age < 5) { ... }`."],"visual":false,"unit":"web3"},{"id":"web3-e4","title":"Day type with switch","lang":"js","mins":10,"prompt":"<p>Write <code>dayType(day)</code> using a <strong>switch</strong> statement. Return <code>&quot;weekend&quot;</code> for <code>&quot;Sat&quot;</code> or <code>&quot;Sun&quot;</code>, <code>&quot;weekday&quot;</code> for <code>&quot;Mon&quot;</code> to <code>&quot;Fri&quot;</code>, and <code>&quot;unknown&quot;</code> for anything else.</p>\n","starter":"function dayType(day) {\n  switch (day) {\n    // your cases here\n  }\n}","tests":["assert(dayType(\"Sat\") === \"weekend\", \"Sat is the weekend\")","assert(dayType(\"Sun\") === \"weekend\", \"Sun is the weekend\")","assert(dayType(\"Wed\") === \"weekday\", \"Wed is a weekday\")","assert(dayType(\"Mon\") === \"weekday\", \"Mon is a weekday\")","assert(dayType(\"Funday\") === \"unknown\", \"Anything else is unknown\")"],"solution":"function dayType(day) {\n  switch (day) {\n    case \"Sat\":\n    case \"Sun\":\n      return \"weekend\";\n    case \"Mon\":\n    case \"Tue\":\n    case \"Wed\":\n    case \"Thu\":\n    case \"Fri\":\n      return \"weekday\";\n    default:\n      return \"unknown\";\n  }\n}","hint":"Stack several `case` lines to share one result. `default:` catches everything else.","hints":["Stack several `case` lines to share one result. `default:` catches everything else."],"visual":false,"unit":"web3"}],"fill":[],"quiz":[{"q":"What is logged? `const x = 0; console.log(x ? \"yes\" : \"no\");`","choices":["yes","no","0","undefined"],"a":1,"why":"`0` is falsy, so the ternary gives the value after `:`.","id":"web3-q1","kind":"mcq","type":"quiz"},{"q":"Which is the JavaScript version of Python's `if a and not b:`?","choices":["`if (a && !b) {`","`if (a and not b) {`","`if (a & ~b):`","`if a && !b {`"],"a":0,"why":"JavaScript uses `&&` for and and `!` for not, with the condition in parentheses.","id":"web3-q2","kind":"mcq","type":"quiz"},{"q":"What is `\"5\" + 3` in JavaScript?","choices":["8","\"53\"","NaN","Error"],"a":1,"why":"If either side of `+` is a string, JS joins them as text.","id":"web3-q3","kind":"mcq","type":"quiz"},{"q":"What is `\"5\" - 3`?","choices":["2","\"53\"","\"2\"","NaN"],"a":0,"why":"`-` only works on numbers, so JS converts `\"5\"` to 5 first.","id":"web3-q4","kind":"mcq","type":"quiz"},{"q":"What is `5 === \"5\"`?","choices":["true","false","Error","undefined"],"a":1,"why":"`===` is strict equality. A number and a string are different types, so it's false.","id":"web3-q5","kind":"mcq","type":"quiz"},{"q":"You write `const x = 1;` and later `x = 2;`. What happens?","choices":["x becomes 2","TypeError: Assignment to constant variable","x becomes \"12\"","Nothing"],"a":1,"why":"`const` variables can't be reassigned. Use `let` if the value needs to change.","id":"web3-q6","kind":"mcq","type":"quiz"},{"q":"Given `const sq = x => x * x;`, what is `sq(4)`?","choices":["8","16","\"44\"","undefined"],"a":1,"why":"An arrow function with a single expression returns that expression automatically: 4 × 4 = 16.","id":"web3-q7","kind":"mcq","type":"quiz"}],"trace":[{"q":"What is logged?","choices":["Total: 18","Total: 6","Total: 18/3","Total: NaN"],"a":1,"lang":"js","code":"let total = 0;\nconst nums = [3, 6, 9];\nfor (const n of nums) {\n  total += n;\n}\nconsole.log(`Total: ${total / nums.length}`);","why":"The total is 18, the array has 3 items, and 18 / 3 = 6. This code computes the average.","id":"web3-t1","kind":"mcq","type":"trace"},{"q":"What is logged?","choices":["[85, 100, 75]","[85, 100]","[100]","[95]"],"a":1,"lang":"js","code":"const scores = [80, 95, 70];\nconst curved = scores.map(s => s + 5).filter(s => s > 80);\nconsole.log(curved);","why":"`map` gives [85, 100, 75]. Then `filter` keeps only the scores above 80: [85, 100].","id":"web3-t2","kind":"mcq","type":"trace"}],"bug":[{"q":"`checkAnswer(7)` returns \"Correct!\". Click the bug.","lang":"js","code":"function checkAnswer(answer) {\n  if (answer = 42) {\n    return \"Correct!\";\n  }\n  return \"Try again\";\n}\nconsole.log(checkAnswer(7));","lines":[2],"fix":"if (answer === 42) {","why":"A single `=` **assigns** 42 to `answer`, and 42 is truthy. Use `===` to compare.","id":"web3-b1","kind":"bug","type":"bug"}]},{"id":"web4","title":"The DOM & Events","lessons":[{"title":"Making pages interactive","mins":12,"html":"<p>The <strong>DOM</strong> (Document Object Model) is the browser&#39;s live, tree-shaped version of your HTML. JavaScript can read and change it.</p>\n<pre><code class=\"language-js\">const title = document.querySelector(&quot;h1&quot;);       // first &lt;h1&gt;\nconst btn   = document.querySelector(&quot;#start&quot;);   // id=&quot;start&quot;\nconst cards = document.querySelectorAll(&quot;.card&quot;); // every .card\n\ntitle.textContent = &quot;Ready!&quot;;\nbtn.classList.add(&quot;active&quot;);\nbtn.classList.toggle(&quot;dark&quot;);\n</code></pre>\n<h3>Events</h3>\n<pre><code class=\"language-js\">btn.addEventListener(&quot;click&quot;, handleClick);   // pass the function...\n// NOT addEventListener(&quot;click&quot;, handleClick()) ...which calls it right away\n\nfunction handleClick(event) {\n  console.log(&quot;Clicked!&quot;, event.target);\n}\n</code></pre>\n<h3>Forms</h3>\n<p>A form reloads the page when submitted unless you stop it:</p>\n<pre><code class=\"language-js\">form.addEventListener(&quot;submit&quot;, (e) =&gt; {\n  e.preventDefault();\n  const value = form.querySelector(&quot;input&quot;).value;\n});\n</code></pre>\n<h3>textContent vs innerHTML</h3>\n<p><code>textContent</code> inserts plain text. <code>innerHTML</code> parses HTML, so if you put <strong>user input</strong> in <code>innerHTML</code>, attackers can inject scripts. This attack is called <strong>XSS</strong>. Use <code>textContent</code> for user data.</p>\n","text":"The DOM (Document Object Model) is the browser's live, tree shaped version of your HTML. JavaScript can read and change it. js const title = document.querySelector(\"h1\"); // first <h1 const btn = document.querySelector(\" start\"); // id=\"start\" const cards = document.querySelectorAll(\".card\"); // every .card title.textContent = \"Ready!\"; btn.classList.add(\"active\"); btn.classList.toggle(\"dark\"); Events js btn.addEventListener(\"click\", handleClick); // pass the function... // NOT addEventListener(\"click\", handleClick()) ...which calls it right away function handleClick(event) { console.log(\"Clicked!\", event.target); } Forms A form reloads the page when submitted unless you stop it: js form.addEventListener(\"submit\", (e) = { e.preventDefault(); const value = form.querySelector(\"input\").value; }); textContent vs innerHTML textContent inserts plain text. innerHTML parses HTML, so if you put user input in innerHTML , attackers can inject scripts. This attack is called XSS . Use textContent for user data.","quizzes":[]}],"ex":[{"id":"web4-e1","title":"Click counter","lang":"html","mins":12,"prompt":"<p>Make the button work: each click should add 1 to the number in <code>#count</code>.</p>\n","starter":"<button id=\"btn\">Click me</button>\n<p>Clicks: <span id=\"count\">0</span></p>\n\n<script>\n  let clicks = 0;\n  const btn = document.querySelector(\"#btn\");\n  const count = document.querySelector(\"#count\");\n  // add a click event listener here\n\n<\/script>","tests":["assert(doc.querySelector(\"#btn\") && doc.querySelector(\"#count\"), \"Keep the #btn and #count elements\")","assert((doc.querySelector(\"#btn\").click(), doc.querySelector(\"#count\").textContent.trim() === \"1\"), \"After 1 click, #count should show 1\")","assert((doc.querySelector(\"#btn\").click(), doc.querySelector(\"#count\").textContent.trim() === \"2\"), \"After 2 clicks, #count should show 2\")"],"solution":"<button id=\"btn\">Click me</button>\n<p>Clicks: <span id=\"count\">0</span></p>\n\n<script>\n  let clicks = 0;\n  const btn = document.querySelector(\"#btn\");\n  const count = document.querySelector(\"#count\");\n  btn.addEventListener(\"click\", () => {\n    clicks++;\n    count.textContent = clicks;\n  });\n<\/script>","hint":"`btn.addEventListener(\"click\", () => { ... })`. Inside it, add 1 to `clicks` and set `count.textContent`.","hints":["`btn.addEventListener(\"click\", () => { ... })`. Inside it, add 1 to `clicks` and set `count.textContent`."],"visual":false,"unit":"web4"}],"fill":[],"quiz":[{"q":"What does `document.querySelector(\"#score\")` return?","choices":["Every element with class \"score\"","The first element with id \"score\"","The text inside #score","An array of matches"],"a":1,"why":"`querySelector` returns the **first** match for a CSS selector. `#score` matches the element with that id.","id":"web4-q1","kind":"mcq","type":"quiz"},{"q":"Why is `el.innerHTML = userInput` dangerous?","choices":["It's slower than textContent","User input could contain HTML or scripts that run on the page (XSS)","It deletes the element","It only works on divs"],"a":1,"why":"`innerHTML` parses its input as HTML. For user data, use `textContent`, which treats everything as plain text.","id":"web4-q2","kind":"mcq","type":"quiz"},{"q":"Which line correctly runs `save` when the button is clicked?","choices":["`btn.addEventListener(\"click\", save);`","`btn.addEventListener(\"click\", save());`","`btn.addEventListener(save, \"click\");`","`btn.onClick = \"save\";`"],"a":0,"why":"Pass the function itself. Writing `save()` calls it right away and passes its return value instead.","id":"web4-q3","kind":"mcq","type":"quiz"},{"q":"What does `event.preventDefault()` do in a form's submit handler?","choices":["Deletes the form","Stops the browser from reloading or navigating the page","Clears the inputs","Submits the form twice"],"a":1,"why":"It cancels the browser's default action, so your JS can handle the data instead.","id":"web4-q4","kind":"mcq","type":"quiz"},{"q":"What does `el.classList.toggle(\"dark\")` do?","choices":["Always adds \"dark\"","Always removes \"dark\"","Adds \"dark\" if it's missing and removes it if it's there","Changes the text color to dark"],"a":2,"why":"`toggle` flips the class on and off. It's handy for dark mode buttons.","id":"web4-q5","kind":"mcq","type":"quiz"}],"trace":[{"q":"The user clicks the button 3 times. What does it say?","choices":["Clicks: 3","Clicks: 6","Clicks: 2","Clicks: 0"],"a":1,"lang":"html","code":"<button id=\"btn\">Clicks: 0</button>\n<script>\n  let clicks = 0;\n  const btn = document.querySelector(\"#btn\");\n  btn.addEventListener(\"click\", () => {\n    clicks += 2;\n    btn.textContent = \"Clicks: \" + clicks;\n  });\n<\/script>","why":"Each click adds 2, and 3 clicks × 2 = 6.","id":"web4-t1","kind":"mcq","type":"trace"}],"bug":[{"q":"\"Saved!\" is logged as soon as the page loads, and clicking does nothing. Click the bug.","lang":"js","code":"const button = document.querySelector(\"#save\");\nbutton.addEventListener(\"click\", saveGame());\n\nfunction saveGame() {\n  console.log(\"Saved!\");\n}","lines":[2],"fix":"button.addEventListener(\"click\", saveGame);","why":"`saveGame()` runs the function immediately and passes its return value (`undefined`) as the listener. Pass `saveGame` without the parentheses.","id":"web4-b1","kind":"bug","type":"bug"}]}]},{"id":"csp","title":"AP CS Principles","short":"AP CSP","emoji":"🌐","year":2,"yearLabel":"Sophomore","color":"#10b981","blurb":"All 5 Big Ideas of AP CSP: creative development, data, algorithms and programming, networks, and the impact of computing. Uses the AP exam's pseudocode.","units":[{"id":"csp1","title":"Big Idea 1: Creative Development","lessons":[{"title":"Collaboration, design and program purpose","mins":9,"html":"<p><strong>Exam weight: 10–13%.</strong> This Big Idea covers <em>how</em> programs get made.</p>\n<h3>Collaboration</h3>\n<p>Teams with <strong>diverse perspectives</strong> build better software. They catch more bugs and reduce <strong>bias</strong> in the design. Pair programming, giving feedback and getting input from users are all forms of collaboration.</p>\n<h3>Purpose vs. function</h3>\n<ul>\n<li>A program&#39;s <strong>purpose</strong> is the problem it solves or the creative goal behind it (&quot;help students study&quot;).</li>\n<li>Its <strong>function</strong> is how it behaves when it runs: its inputs, its behavior and its outputs.</li>\n</ul>\n<h3>The development process</h3>\n<p>Programs are usually built <strong>iteratively</strong>: investigate the problem, design, prototype, test, refine, and repeat. Writing down <strong>requirements</strong> first keeps everyone aligned.</p>\n<p><strong>Program inputs</strong> come from users (taps, typing), sensors or other programs. <strong>Event-driven</strong> programs run code when an <em>event</em> happens, like a key press or a click.</p>\n<h3>Documentation</h3>\n<p><strong>Comments</strong> and other documentation explain what the code does and why. This helps teammates, and future you. Always <strong>give credit</strong> for code you didn&#39;t write.</p>\n","text":" Exam weight: 10–13%. This Big Idea covers how programs get made. Collaboration Teams with diverse perspectives build better software. They catch more bugs and reduce bias in the design. Pair programming, giving feedback and getting input from users are all forms of collaboration. Purpose vs. function A program's purpose is the problem it solves or the creative goal behind it (\"help students study\"). Its function is how it behaves when it runs: its inputs, its behavior and its outputs. The development process Programs are usually built iteratively : investigate the problem, design, prototype, test, refine, and repeat. Writing down requirements first keeps everyone aligned. Program inputs come from users (taps, typing), sensors or other programs. Event driven programs run code when an event happens, like a key press or a click. Documentation Comments and other documentation explain what the code does and why. This helps teammates, and future you. Always give credit for code you didn't write.","quizzes":[]},{"title":"Finding and fixing errors","mins":8,"html":"<table>\n<thead>\n<tr>\n<th>Error</th>\n<th>What happens</th>\n<th>Example</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>Syntax</strong></td>\n<td>Code breaks the language&#39;s rules, so it won&#39;t run</td>\n<td>a missing bracket</td>\n</tr>\n<tr>\n<td><strong>Runtime</strong></td>\n<td>It crashes <em>while running</em></td>\n<td>dividing by zero</td>\n</tr>\n<tr>\n<td><strong>Logic</strong></td>\n<td>It runs but gives the <strong>wrong answer</strong></td>\n<td><code>sum / 2</code> instead of <code>sum / LENGTH(list)</code></td>\n</tr>\n<tr>\n<td><strong>Overflow</strong></td>\n<td>A number is too big for the space it&#39;s stored in</td>\n<td>adding 1 to the max int</td>\n</tr>\n</tbody></table>\n<h3>Debugging strategies</h3>\n<ul>\n<li>Add <strong>output statements</strong> (DISPLAY) to check values as the program runs.</li>\n<li><strong>Hand-trace</strong> the code with a table of variable values.</li>\n<li>Use <strong>test cases</strong>, including <strong>boundary values</strong> at and just past the edges of the valid input (0, −1, the maximum).</li>\n<li>Use visualizations and debuggers.</li>\n</ul>\n<blockquote>\n<p><strong>Exam trap:</strong> Testing can show that a program <em>has</em> errors. It can&#39;t prove that a program has <em>no</em> errors.</p>\n</blockquote>\n","text":" Error What happens Example Syntax Code breaks the language's rules, so it won't run a missing bracket Runtime It crashes while running dividing by zero Logic It runs but gives the wrong answer sum / 2 instead of sum / LENGTH(list) Overflow A number is too big for the space it's stored in adding 1 to the max int Debugging strategies Add output statements (DISPLAY) to check values as the program runs. Hand trace the code with a table of variable values. Use test cases , including boundary values at and just past the edges of the valid input (0, −1, the maximum). Use visualizations and debuggers. Exam trap: Testing can show that a program has errors. It can't prove that a program has no errors.","quizzes":[]}],"ex":[],"fill":[{"q":"Fill in the blank so this always displays the correct average.","lang":"pseudo","code":"sum ← 0\nFOR EACH n IN nums\n{\n   sum ← sum + n\n}\navg ← sum / \u00000\u0000\nDISPLAY(avg)","why":"Divide the total by how many items are in the list, `LENGTH(nums)`.","id":"csp1-f1","kind":"fill","title":"Fix the average","blanks":[["LENGTH(nums)"]]}],"quiz":[{"q":"A program runs without crashing but calculates the wrong average. What kind of error is this?","choices":["Syntax error","Runtime error","Logic error","Overflow error"],"a":2,"why":"The code is valid and doesn't crash, but the result is wrong. That makes it a **logic** error.","id":"csp1-q1","kind":"mcq","type":"quiz"},{"q":"A program accepts ages from 0 to 120. Which set of test inputs is best?","choices":["20, 30, 40","−1, 0, 120, 121","50 only","1, 2, 3"],"a":1,"why":"Test **boundary values** at and just beyond the edges of the valid range. That's where bugs usually hide.","id":"csp1-q2","kind":"mcq","type":"quiz"},{"q":"What is the main benefit of collaborating with people from diverse backgrounds?","choices":["The program runs faster","Different perspectives help catch bias and improve the design","Less documentation is needed","Testing is no longer required"],"a":1,"why":"Diverse teams think of more users and edge cases, which reduces bias in the finished program.","id":"csp1-q3","kind":"mcq","type":"quiz"},{"q":"Why should programmers document their code with comments?","choices":["Comments make code run faster","They explain how and why the code works, which helps others maintain it","The computer needs them to run the program","To hide how the code works"],"a":1,"why":"Comments are ignored by the computer. They help **people** understand the code, and they're also where you credit code from other sources.","id":"csp1-q4","kind":"mcq","type":"quiz"},{"q":"A program adds 1 to the largest number a variable can hold and gets a strange result. What is this called?","choices":["Rounding error","Overflow error","Syntax error","Logic error"],"a":1,"why":"When a value goes past the range a fixed number of bits can store, an **overflow** happens.","id":"csp1-q5","kind":"mcq","type":"quiz"}],"trace":[{"q":"What is displayed?","choices":["3","10","13","x"],"a":0,"lang":"pseudo","code":"x ← 3\ny ← x\nx ← 10\nDISPLAY(y)","why":"`y ← x` copies the **value** 3 into y. Changing x afterward doesn't change y.","id":"csp1-t1","kind":"mcq","type":"trace"}],"bug":[{"q":"This is supposed to display the average of `nums`. Click the line with the logic error.","lang":"pseudo","code":"// find the average of the list nums\nsum ← 0\nFOR EACH n IN nums\n{\n   sum ← sum + n\n}\navg ← sum / 2\nDISPLAY(avg)","lines":[7],"fix":"avg ← sum / LENGTH(nums)","why":"Dividing by 2 only works for a list with exactly two items. Divide by `LENGTH(nums)`.","id":"csp1-b1","kind":"bug","type":"bug"}]},{"id":"csp2","title":"Big Idea 2: Data","lessons":[{"title":"Binary and how data is represented","mins":10,"html":"<p><strong>Exam weight: 17–22%.</strong> Computers store <em>everything</em> as <strong>bits</strong> (0s and 1s). 8 bits make <strong>1 byte</strong>.</p>\n<h3>Converting binary to decimal</h3>\n<p>Each place value is a power of 2:</p>\n<table>\n<thead>\n<tr>\n<th>128</th>\n<th>64</th>\n<th>32</th>\n<th>16</th>\n<th>8</th>\n<th>4</th>\n<th>2</th>\n<th>1</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>0</td>\n<td>0</td>\n<td>0</td>\n<td>0</td>\n<td>1</td>\n<td>0</td>\n<td>1</td>\n<td>1</td>\n</tr>\n</tbody></table>\n<p><code>00001011</code> = 8 + 2 + 1 = <strong>11</strong></p>\n<h3>How many values can n bits hold?</h3>\n<p><strong>2ⁿ.</strong> 4 bits can hold 16 values (0 to 15), and 8 bits can hold 256 values (0 to 255). <strong>Adding one bit doubles</strong> the number of values.</p>\n<p>To find how many bits you need, find the smallest n where 2ⁿ ≥ the number of values. For 100 values that&#39;s 7 bits, because 2⁷ = 128.</p>\n<h3>Limits</h3>\n<ul>\n<li><strong>Overflow:</strong> the number is too big for the fixed number of bits.</li>\n<li><strong>Rounding errors:</strong> decimals like 0.1 can&#39;t be stored exactly, so results come out <em>approximately</em> right.</li>\n</ul>\n<p>The <strong>same bits</strong> can mean a number, a letter, a color or a sound. It depends on how the program interprets them. This is an example of <strong>abstraction</strong>.</p>\n","text":" Exam weight: 17–22%. Computers store everything as bits (0s and 1s). 8 bits make 1 byte . Converting binary to decimal Each place value is a power of 2: 128 64 32 16 8 4 2 1 0 0 0 0 1 0 1 1 00001011 = 8 + 2 + 1 = 11 How many values can n bits hold? 2ⁿ. 4 bits can hold 16 values (0 to 15), and 8 bits can hold 256 values (0 to 255). Adding one bit doubles the number of values. To find how many bits you need, find the smallest n where 2ⁿ ≥ the number of values. For 100 values that's 7 bits, because 2⁷ = 128. Limits Overflow: the number is too big for the fixed number of bits. Rounding errors: decimals like 0.1 can't be stored exactly, so results come out approximately right. The same bits can mean a number, a letter, a color or a sound. It depends on how the program interprets them. This is an example of abstraction .","quizzes":[]},{"title":"Compression and extracting information","mins":9,"html":"<h3>Compression</h3>\n<ul>\n<li><strong>Lossless</strong> compression means the original can be rebuilt <strong>exactly</strong>. ZIP and PNG are examples. Use it for text, code and anything that must be perfect.</li>\n<li><strong>Lossy</strong> compression throws away some detail to make files much <strong>smaller</strong>. JPEG and MP3 are examples. Use it when &quot;close enough&quot; is fine and size matters most.</li>\n</ul>\n<h3>Metadata</h3>\n<p><strong>Metadata</strong> is data <em>about</em> data, like a photo&#39;s date, location or file size. Changing metadata doesn&#39;t change the main data, but it helps you find and organize files.</p>\n<h3>Using data</h3>\n<ul>\n<li><strong>Cleaning</strong> data makes it uniform (for example, &quot;NY&quot;, &quot;N.Y.&quot; and &quot;New York&quot; all become one value) and removes errors.</li>\n<li>Larger datasets can reveal <strong>patterns</strong> and <strong>trends</strong>, but <strong>correlation doesn&#39;t prove causation</strong>.</li>\n<li>Data can be <strong>biased</strong> if it doesn&#39;t represent everyone. Collecting <em>more</em> biased data doesn&#39;t fix that.</li>\n<li>Big datasets may need <strong>parallel</strong> systems to process.</li>\n</ul>\n","text":" Compression Lossless compression means the original can be rebuilt exactly . ZIP and PNG are examples. Use it for text, code and anything that must be perfect. Lossy compression throws away some detail to make files much smaller . JPEG and MP3 are examples. Use it when \"close enough\" is fine and size matters most. Metadata Metadata is data about data, like a photo's date, location or file size. Changing metadata doesn't change the main data, but it helps you find and organize files. Using data Cleaning data makes it uniform (for example, \"NY\", \"N.Y.\" and \"New York\" all become one value) and removes errors. Larger datasets can reveal patterns and trends , but correlation doesn't prove causation . Data can be biased if it doesn't represent everyone. Collecting more biased data doesn't fix that. Big datasets may need parallel systems to process.","quizzes":[]}],"ex":[],"fill":[{"q":"Fill in the blanks.","lang":"text","code":"13 in binary is \u00000\u0000\nThe largest number 8 bits can hold is \u00001\u0000\nWith 5 bits you can represent \u00002\u0000 different values","why":"13 = 8 + 4 + 1, so it's 1101. 8 bits hold 0 to 255. And 2⁵ = 32 values.","id":"csp2-f1","kind":"fill","title":"Binary facts","blanks":[["1101"],["255"],["32"]]}],"quiz":[{"q":"What is the binary number `1011` in decimal?","choices":["9","11","13","1011"],"a":1,"why":"8 + 0 + 2 + 1 = 11.","id":"csp2-q1","kind":"mcq","type":"quiz"},{"q":"How many different values can be represented with 4 bits?","choices":["4","8","16","32"],"a":2,"why":"n bits can represent 2ⁿ values, and 2⁴ = 16.","id":"csp2-q2","kind":"mcq","type":"quiz"},{"q":"A student needs to compress an essay so it can be restored perfectly. Which kind of compression should they use?","choices":["Lossless","Lossy","Either one works the same","Text can't be compressed"],"a":0,"why":"Only **lossless** compression guarantees the exact original can be rebuilt.","id":"csp2-q3","kind":"mcq","type":"quiz"},{"q":"Which of these is **metadata** for a photo?","choices":["The colors of the pixels","The date and location where it was taken","The people in the photo","The photo's brightness"],"a":1,"why":"Metadata describes the data. The pixels themselves are the data.","id":"csp2-q4","kind":"mcq","type":"quiz"},{"q":"What happens to the number of values you can represent when you add 1 bit?","choices":["It goes up by 1","It doubles","It goes up by 8","It stays the same"],"a":1,"why":"The number of values goes from 2ⁿ to 2ⁿ⁺¹, which is twice as many.","id":"csp2-q5","kind":"mcq","type":"quiz"},{"q":"What is 25 in binary?","choices":["10101","11001","11010","10011"],"a":1,"why":"25 = 16 + 8 + 1, so the bits are 1 (16), 1 (8), 0 (4), 0 (2), 1 (1).","id":"csp2-q6","kind":"mcq","type":"quiz"}],"trace":[{"q":"What is `01101010` in decimal?","choices":["104","106","170","74"],"a":1,"lang":"pseudo","code":"place:  128  64  32  16   8   4   2   1\nbit:      0   1   1   0   1   0   1   0","why":"64 + 32 + 8 + 2 = 106.","id":"csp2-t1","kind":"mcq","type":"trace"},{"q":"A school wants to give each of its 100 clubs a unique binary ID. What is the fewest bits it can use?","choices":["6","7","8","100"],"a":1,"why":"6 bits gives only 64 IDs, which isn't enough. 7 bits gives 128 IDs, which covers all 100 clubs.","id":"csp2-t2","kind":"mcq","type":"trace"}],"bug":[{"q":"A student converted 13 to binary. Click the line where the mistake **starts**.","lang":"pseudo","code":"// convert 13 to binary\n13 = 8 + 4 + 1\n8 → 1,  4 → 1,  2 → 1,  1 → 1\nbinary: 1111","lines":[3],"fix":"8 → 1,  4 → 1,  2 → 0,  1 → 1   (binary: 1101)","why":"13 doesn't use the 2's place, so that bit should be 0. The correct answer is 1101.","id":"csp2-b1","kind":"bug","type":"bug"}]},{"id":"csp3","title":"Big Idea 3: Algorithms & Programming","lessons":[{"title":"AP pseudocode essentials","mins":14,"html":"<p><strong>Exam weight: 30–35%, the biggest Big Idea.</strong> The exam uses its own pseudocode (you get a reference sheet).</p>\n<pre><code class=\"language-pseudo\">a ← 5                 // assignment\nDISPLAY(a)\nx ← INPUT()\nr ← 17 MOD 5          // remainder → 2\nn ← RANDOM(1, 6)      // 1 through 6, both included\n</code></pre>\n<h3>Lists start at index 1</h3>\n<pre><code class=\"language-pseudo\">list ← [10, 20, 30]\nlist[1]               // 10  ← first item!\nAPPEND(list, 40)      // [10, 20, 30, 40]\nINSERT(list, 2, 15)   // [10, 15, 20, 30, 40]\nREMOVE(list, 1)       // [15, 20, 30, 40]\nLENGTH(list)          // 4\n</code></pre>\n<h3>Selection and iteration</h3>\n<pre><code class=\"language-pseudo\">IF (score ≥ 90)\n{ DISPLAY(&quot;A&quot;) }\nELSE\n{ DISPLAY(&quot;keep going&quot;) }\n\nREPEAT 3 TIMES\n{ moveForward() }\n\nREPEAT UNTIL (x &gt; 20)    // checks the condition BEFORE each loop\n{ x ← x * 3 }\n\nFOR EACH item IN list\n{ DISPLAY(item) }\n</code></pre>\n<h3>Procedures</h3>\n<pre><code class=\"language-pseudo\">PROCEDURE double(n)\n{\n   RETURN(n * 2)\n}\n</code></pre>\n<p>Procedures provide <strong>abstraction</strong>: you can use one without knowing how it works inside. That reduces complexity and lets you reuse code. <strong>Libraries</strong> and <strong>APIs</strong> are collections of procedures that other people wrote.</p>\n","text":" Exam weight: 30–35%, the biggest Big Idea. The exam uses its own pseudocode (you get a reference sheet). pseudo a ← 5 // assignment DISPLAY(a) x ← INPUT() r ← 17 MOD 5 // remainder → 2 n ← RANDOM(1, 6) // 1 through 6, both included Lists start at index 1 pseudo list ← [10, 20, 30] list[1] // 10 ← first item! APPEND(list, 40) // [10, 20, 30, 40] INSERT(list, 2, 15) // [10, 15, 20, 30, 40] REMOVE(list, 1) // [15, 20, 30, 40] LENGTH(list) // 4 Selection and iteration pseudo IF (score ≥ 90) { DISPLAY(\"A\") } ELSE { DISPLAY(\"keep going\") } REPEAT 3 TIMES { moveForward() } REPEAT UNTIL (x 20) // checks the condition BEFORE each loop { x ← x 3 } FOR EACH item IN list { DISPLAY(item) } Procedures pseudo PROCEDURE double(n) { RETURN(n 2) } Procedures provide abstraction : you can use one without knowing how it works inside. That reduces complexity and lets you reuse code. Libraries and APIs are collections of procedures that other people wrote.","quizzes":[]},{"title":"Selection with IF and ELSE","mins":9,"html":"<p>On the AP exam, <strong>selection</strong> means choosing which code runs with <code>IF</code> and <code>ELSE</code>:</p>\n<pre><code class=\"language-pseudo\">IF (temperature &gt; 85)\n{\n   DISPLAY(&quot;Hot&quot;)\n}\nELSE\n{\n   DISPLAY(&quot;Not hot&quot;)\n}\n</code></pre>\n<p>The condition goes in <strong>parentheses</strong>, and each block goes in <strong>braces</strong>. The block-based version on the reference sheet works the same way.</p>\n<h3>Relational and logical operators</h3>\n<ul>\n<li><strong>Relational:</strong> <code>=</code> (equal: one sign on the AP exam!), <code>≠</code>, <code>&lt;</code>, <code>&gt;</code>, <code>≤</code>, <code>≥</code></li>\n<li><strong>Logical:</strong> <code>AND</code>, <code>OR</code>, <code>NOT</code></li>\n</ul>\n<blockquote>\n<p><strong>Watch out:</strong> In AP pseudocode <code>a = b</code> <strong>compares</strong>. Assignment uses the arrow: <code>a ← b</code>.</p>\n</blockquote>\n<div class=\"lq\" data-lq=\"0\"></div><h3>Nested and chained selection</h3>\n<p>There&#39;s no <code>ELSE IF</code> keyword, so you <strong>nest</strong> another IF inside the ELSE:</p>\n<pre><code class=\"language-pseudo\">IF (score ≥ 90)\n{\n   grade ← &quot;A&quot;\n}\nELSE\n{\n   IF (score ≥ 80)\n   {\n      grade ← &quot;B&quot;\n   }\n   ELSE\n   {\n      grade ← &quot;C&quot;\n   }\n}\n</code></pre>\n<div class=\"lq\" data-lq=\"1\"></div><h3>Exam tip</h3>\n<p>Many AP questions ask which code segments give the <strong>same result</strong>. Trace each one with a few test values, including the <strong>boundaries</strong> (like exactly 80).</p>\n","text":"On the AP exam, selection means choosing which code runs with IF and ELSE : pseudo IF (temperature 85) { DISPLAY(\"Hot\") } ELSE { DISPLAY(\"Not hot\") } The condition goes in parentheses , and each block goes in braces . The block based version on the reference sheet works the same way. Relational and logical operators Relational: = (equal: one sign on the AP exam!), ≠ , < , , ≤ , ≥ Logical: AND , OR , NOT Watch out: In AP pseudocode a = b compares . Assignment uses the arrow: a ← b . Nested and chained selection There's no ELSE IF keyword, so you nest another IF inside the ELSE: pseudo IF (score ≥ 90) { grade ← \"A\" } ELSE { IF (score ≥ 80) { grade ← \"B\" } ELSE { grade ← \"C\" } } Exam tip Many AP questions ask which code segments give the same result . Trace each one with a few test values, including the boundaries (like exactly 80).","quizzes":[{"q":"In AP pseudocode, what does `IF (x = 5)` do?","choices":["Stores 5 in x","Checks whether x equals 5","Causes an error","Always runs"],"a":1,"why":"On the AP exam, `=` is the equality comparison. Assignment is `←`.","id":"csp3-L2q1","kind":"mcq","type":"quiz","inline":true},{"q":"With the code above, what is `grade` when `score` is 80?","choices":["\"A\"","\"B\"","\"C\"","Nothing is assigned"],"a":1,"why":"80 ≥ 90 is false, so the ELSE runs. Inside it, 80 ≥ 80 is true, so grade is \"B\".","id":"csp3-L2q2","kind":"mcq","type":"quiz","inline":true}]},{"title":"Algorithms, searching and efficiency","mins":12,"html":"<h3>Building blocks</h3>\n<p>Every algorithm can be built from three things: <strong>sequencing</strong> (steps in order), <strong>selection</strong> (if) and <strong>iteration</strong> (loops).</p>\n<h3>Searching</h3>\n<ul>\n<li><strong>Linear search</strong> checks each item one by one. It works on <strong>any</strong> list.</li>\n<li><strong>Binary search</strong> checks the middle item and throws away half the list each time. It&#39;s much faster, but the list <strong>must be sorted</strong>. For a list of n items, it checks at most about log₂(n) + 1 items, so a list of 64 items needs at most 7 checks.</li>\n</ul>\n<h3>Efficiency</h3>\n<ul>\n<li><strong>Reasonable time</strong> means the steps grow like a polynomial (n, n², n³).</li>\n<li><strong>Unreasonable time</strong> means the steps grow exponentially or faster (2ⁿ, n!).</li>\n<li>When an exact solution would take unreasonable time, use a <strong>heuristic</strong>: an approach that finds a <em>good enough</em> answer.</li>\n</ul>\n<h3>Limits of computing</h3>\n<p>An <strong>undecidable</strong> problem is one where no algorithm can always give a correct yes/no answer for every input. The <strong>halting problem</strong> is the famous example.</p>\n<h3>Simulations</h3>\n<p><strong>Simulations</strong> model the real world with simplifications. They can be cheaper and safer than experiments, but they may leave out details that matter, which can introduce bias.</p>\n","text":" Building blocks Every algorithm can be built from three things: sequencing (steps in order), selection (if) and iteration (loops). Searching Linear search checks each item one by one. It works on any list. Binary search checks the middle item and throws away half the list each time. It's much faster, but the list must be sorted . For a list of n items, it checks at most about log₂(n) + 1 items, so a list of 64 items needs at most 7 checks. Efficiency Reasonable time means the steps grow like a polynomial (n, n², n³). Unreasonable time means the steps grow exponentially or faster (2ⁿ, n!). When an exact solution would take unreasonable time, use a heuristic : an approach that finds a good enough answer. Limits of computing An undecidable problem is one where no algorithm can always give a correct yes/no answer for every input. The halting problem is the famous example. Simulations Simulations model the real world with simplifications. They can be cheaper and safer than experiments, but they may leave out details that matter, which can introduce bias.","quizzes":[]}],"ex":[],"fill":[{"q":"Complete the procedure so it returns how many numbers in `list` are even.","lang":"pseudo","code":"PROCEDURE countEvens(list)\n{\n   count ← 0\n   FOR EACH n IN list\n   {\n      IF (n MOD 2 = \u00000\u0000)\n      {\n         count ← count + \u00001\u0000\n      }\n   }\n   RETURN(\u00002\u0000)\n}","why":"A number is even when `n MOD 2 = 0`. Add 1 for each even number, then return the count.","id":"csp3-f1","kind":"fill","title":"Count the evens","blanks":[["0"],["1"],["count"]]},{"q":"Complete the procedure so it returns \"pass\" when `score` is at least 70, and \"retry\" otherwise.","lang":"pseudo","code":"PROCEDURE check(score)\n{\n   \u00000\u0000 (score \u00001\u0000 70)\n   {\n      RETURN(\"pass\")\n   }\n   \u00002\u0000\n   {\n      RETURN(\"retry\")\n   }\n}","why":"AP pseudocode writes `IF (condition)` and `ELSE`, with the blocks in braces. \"At least\" is `≥`.","id":"csp3-f2","kind":"fill","title":"IF / ELSE in AP pseudocode","blanks":[["IF"],["≥",">="],["ELSE"]]},{"q":"Fill in the blanks about searching.","lang":"text","code":"Binary search only works if the list is \u00000\u0000.\nOn a sorted list of 1,000 items, binary search needs at most about \u00001\u0000 checks.","why":"Binary search halves the list each time, and 2¹⁰ = 1024, so about 10 checks.","id":"csp3-f3","kind":"fill","title":"Binary search setup","blanks":[["sorted"],["10"]]}],"quiz":[{"q":"What is displayed when `x ← 4` and `y ← 9`?","choices":["yes","no","yes no","Nothing"],"a":0,"lang":"pseudo","code":"IF ((x > 3) AND (NOT (y > 10)))\n{\n   DISPLAY(\"yes\")\n}\nELSE\n{\n   DISPLAY(\"no\")\n}","why":"x > 3 is true, and y > 10 is false, so NOT makes it true. true AND true is true.","id":"csp3-q1","kind":"mcq","type":"quiz"},{"q":"Which symbol means \"not equal to\" in AP pseudocode?","choices":["!=","≠","<>","=/="],"a":1,"why":"The AP reference sheet uses `≠`.","id":"csp3-q2","kind":"mcq","type":"quiz"},{"q":"What is `17 MOD 5`?","choices":["3","2","3.4","12"],"a":1,"why":"17 = 5 × 3 + 2, and MOD gives the remainder, 2.","id":"csp3-q3","kind":"mcq","type":"quiz"},{"q":"In AP pseudocode, `list ← [8, 3, 5]`. What is `list[1]`?","choices":["8","3","5","Error"],"a":0,"why":"AP pseudocode lists start at index **1**, not 0.","id":"csp3-q4","kind":"mcq","type":"quiz"},{"q":"What must be true before you can use binary search on a list?","choices":["The list has an even number of items","The list is sorted","The list has no duplicates","The list holds only numbers"],"a":1,"why":"Binary search decides which half to throw away based on order, so the list must be sorted.","id":"csp3-q5","kind":"mcq","type":"quiz"},{"q":"What is the maximum number of items binary search checks in a sorted list of 64 items?","choices":["6","7","32","64"],"a":1,"why":"Each check halves the list: 64 → 32 → 16 → 8 → 4 → 2 → 1. That's at most 7 checks.","id":"csp3-q6","kind":"mcq","type":"quiz"},{"q":"Which kind of algorithm runs in **unreasonable** time?","choices":["One that takes n² steps","One that takes 5n steps","One that takes 2ⁿ steps","One that takes n³ steps"],"a":2,"why":"Exponential growth like 2ⁿ is unreasonable. Polynomial growth like n, n² and n³ is reasonable.","id":"csp3-q7","kind":"mcq","type":"quiz"},{"q":"What makes a problem **undecidable**?","choices":["It takes a long time to solve","No algorithm can always give a correct yes/no answer for every input","It has no solution at all","Only a supercomputer can solve it"],"a":1,"why":"Undecidable means no algorithm works for *all* inputs. The halting problem is the classic example.","id":"csp3-q8","kind":"mcq","type":"quiz"},{"q":"When should a programmer use a **heuristic**?","choices":["When finding the exact best solution would take unreasonable time","When the problem is undecidable and has no answer","When the list is already sorted","Always, because heuristics are guaranteed to be optimal"],"a":0,"why":"A heuristic gives a good-enough answer in reasonable time. It isn't guaranteed to be the best answer.","id":"csp3-q9","kind":"mcq","type":"quiz"},{"q":"What values can `RANDOM(1, 6)` return?","choices":["1 to 5","1 to 6, including both 1 and 6","0 to 6","Any decimal between 1 and 6"],"a":1,"why":"`RANDOM(a, b)` returns a whole number from a to b, including both ends.","id":"csp3-q10","kind":"mcq","type":"quiz"}],"trace":[{"q":"What is displayed?","choices":["22","6","16","2"],"a":1,"lang":"pseudo","code":"nums ← [4, 7, 2, 9]\ntotal ← 0\nFOR EACH n IN nums\n{\n   IF (n MOD 2 = 0)\n
