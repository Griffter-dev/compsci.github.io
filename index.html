signature with your <strong>public</strong> key. This proves <strong>who</strong> sent the message (authenticity) and that it wasn&#39;t <strong>changed</strong> (integrity).</p>\n","text":" Classical ciphers A Caesar cipher shifts every letter by a fixed amount. With a shift of 3, A→D , B→E and Z→C . There are only 25 useful keys, so it's easy to brute force. A substitution cipher maps each letter to a different letter. It can be broken with frequency analysis , because in English, E , T and A are the most common letters. Modern encryption Symmetric encryption (like AES) uses one shared key to encrypt and decrypt. It's fast, but you have to share the key safely. Asymmetric encryption (public key, like RSA) uses a key pair . Anyone can encrypt with your public key, but only your private key can decrypt. HTTPS uses asymmetric encryption to agree on a symmetric key safely, and then uses that fast symmetric key for the rest of the connection. Hashing vs. encryption Encryption is two way : with the key, you can get the data back. Hashing (like SHA 256) is one way : you can't get the original back. Hashes are used to check integrity and to store passwords. Digital signatures To sign, you encrypt a hash of a message with your private key. Anyone can check the signature with your public key. This proves who sent the message (authenticity) and that it wasn't changed (integrity).","quizzes":[]}],"ex":[{"id":"cy3-e1","title":"Caesar cipher","lang":"python","mins":15,"prompt":"<p>Write <code>caesar(text, shift)</code> that shifts every <strong>uppercase letter</strong> by <code>shift</code> places and wraps around after Z. Leave spaces and punctuation unchanged. A negative shift should decrypt.</p>\n","starter":"def caesar(text, shift):\n    out = \"\"\n    for ch in text:\n        out += ch   # change this\n    return out\n\nprint(caesar(\"HELLO, WORLD\", 3))","tests":["assert caesar(\"ABC\", 1) == \"BCD\", 'caesar(\"ABC\", 1) should be \"BCD\"'","assert caesar(\"XYZ\", 3) == \"ABC\", \"Wrap around after Z\"","assert caesar(\"HELLO, WORLD\", 3) == \"KHOOR, ZRUOG\", \"Leave spaces and punctuation unchanged\"","assert caesar(caesar(\"ATTACK AT DAWN\", 7), -7) == \"ATTACK AT DAWN\", \"A negative shift should decrypt\""],"solution":"def caesar(text, shift):\n    out = \"\"\n    for ch in text:\n        if \"A\" <= ch <= \"Z\":\n            out += chr((ord(ch) - 65 + shift) % 26 + 65)\n        else:\n            out += ch\n    return out\n\nprint(caesar(\"HELLO, WORLD\", 3))","hint":"`ord(\"A\")` is 65. Use `(ord(ch) - 65 + shift) % 26 + 65`, then turn it back into a letter with `chr()`.","hints":["`ord(\"A\")` is 65. Use `(ord(ch) - 65 + shift) % 26 + 65`, then turn it back into a letter with `chr()`."],"visual":false,"unit":"cy3"}],"fill":[],"quiz":[{"q":"What is `CAT` encrypted with a Caesar cipher, shift 3?","choices":["FDW","DBU","ZXQ","FEW"],"a":0,"why":"C→F, A→D, T→W.","id":"cy3-q1","kind":"mcq","type":"quiz"},{"q":"Why is a Caesar cipher easy to break?","choices":["It uses binary","There are only 25 possible shifts, so you can try them all","The key is always 3","It only works on vowels"],"a":1,"why":"Such a tiny keyspace makes brute force trivial.","id":"cy3-q2","kind":"mcq","type":"quiz"},{"q":"Which technique breaks simple substitution ciphers?","choices":["Rainbow tables","Frequency analysis","Port scanning","Hashing"],"a":1,"why":"Letter frequencies survive substitution. The most common symbol is probably E.","id":"cy3-q3","kind":"mcq","type":"quiz"},{"q":"In public key encryption, which key decrypts a message that was encrypted with your public key?","choices":["Your public key","Your private key","The sender's private key","Any key"],"a":1,"why":"The keys work as a pair. What the public key locks, only the matching private key unlocks.","id":"cy3-q4","kind":"mcq","type":"quiz"},{"q":"Which statement about hashing is TRUE?","choices":["Hashing can be reversed with the right key","Hashing is one-way, and the same input always gives the same hash","Hashing is the same as encryption","Hashes are always longer than the input"],"a":1,"why":"Hashes are one-way and deterministic (the same input always gives the same output), which is why they're used for integrity checks and password storage.","id":"cy3-q5","kind":"mcq","type":"quiz"},{"q":"What does a digital signature prove?","choices":["That the message is secret","Who sent the message, and that it wasn't changed","That the message was sent quickly","That the receiver read it"],"a":1,"why":"A signature gives you **authenticity** and **integrity**, but not confidentiality.","id":"cy3-q6","kind":"mcq","type":"quiz"}],"trace":[{"q":"What is printed?","choices":["[\\]","ABC","XYZ","ABD"],"a":1,"lang":"python","code":"def caesar(text, shift):\n    out = \"\"\n    for ch in text:\n        out += chr((ord(ch) - 65 + shift) % 26 + 65)\n    return out\n\nprint(caesar(\"XYZ\", 3))","why":"`% 26` wraps past Z: X(23) + 3 = 26 → 0 = A, then B, then C.","id":"cy3-t1","kind":"mcq","type":"trace"}],"bug":[{"q":"`decrypt(caesar(\"HELLO\", 5), 5)` should give back \"HELLO\", but it doesn't. Click the bug.","lang":"python","code":"def decrypt(text, shift):\n    out = \"\"\n    for ch in text:\n        out += chr((ord(ch) - 65 + shift) % 26 + 65)\n    return out","lines":[4],"fix":"out += chr((ord(ch) - 65 - shift) % 26 + 65)","why":"To decrypt, you shift **backward**, so subtract the shift. Python's `%` handles negative numbers correctly.","id":"cy3-b1","kind":"bug","type":"bug"}]},{"id":"cy4","title":"Networks & Defense","lessons":[{"title":"Ports, firewalls and web attacks","mins":13,"html":"<h3>Common ports</h3>\n<table>\n<thead>\n<tr>\n<th>Port</th>\n<th>Service</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>22</td>\n<td>SSH (secure remote login)</td>\n</tr>\n<tr>\n<td>25</td>\n<td>SMTP (email)</td>\n</tr>\n<tr>\n<td>53</td>\n<td>DNS</td>\n</tr>\n<tr>\n<td>80</td>\n<td>HTTP</td>\n</tr>\n<tr>\n<td>443</td>\n<td>HTTPS</td>\n</tr>\n</tbody></table>\n<h3>Network defenses</h3>\n<ul>\n<li><strong>Firewall:</strong> allows or blocks traffic based on rules (such as which ports and addresses are allowed).</li>\n<li><strong>IDS/IPS:</strong> detects (and may block) suspicious activity.</li>\n<li><strong>VPN:</strong> an encrypted tunnel that protects traffic on untrusted networks.</li>\n<li><strong>Patching:</strong> fixes known vulnerabilities. Many attacks use bugs that already had a fix available.</li>\n<li><strong>Logs:</strong> records you review to spot attacks, like 500 failed logins from one IP address.</li>\n</ul>\n<h3>Defense in depth</h3>\n<p>Use <strong>multiple layers</strong> of security, so that if one fails, another still protects you.</p>\n<h3>Web attacks</h3>\n<p><strong>SQL injection</strong> happens when user input is pasted directly into a database query:</p>\n<pre><code class=\"language-sql\">SELECT * FROM users WHERE name = &#39;&#39; OR &#39;1&#39;=&#39;1&#39;\n</code></pre>\n<p>The fix is <strong>parameterized queries</strong> (also called prepared statements), which treat input as data, never as code.</p>\n<p><strong>XSS (cross-site scripting)</strong> happens when an attacker injects a script into a page that other people view. The fix is to escape output and to use <code>textContent</code> instead of <code>innerHTML</code>.</p>\n<p><strong>Input validation:</strong> never trust input from users. Check its type, length and format on the <strong>server</strong>.</p>\n","text":" Common ports Port Service 22 SSH (secure remote login) 25 SMTP (email) 53 DNS 80 HTTP 443 HTTPS Network defenses Firewall: allows or blocks traffic based on rules (such as which ports and addresses are allowed). IDS/IPS: detects (and may block) suspicious activity. VPN: an encrypted tunnel that protects traffic on untrusted networks. Patching: fixes known vulnerabilities. Many attacks use bugs that already had a fix available. Logs: records you review to spot attacks, like 500 failed logins from one IP address. Defense in depth Use multiple layers of security, so that if one fails, another still protects you. Web attacks SQL injection happens when user input is pasted directly into a database query: sql SELECT FROM users WHERE name = '' OR '1'='1' The fix is parameterized queries (also called prepared statements), which treat input as data, never as code. XSS (cross site scripting) happens when an attacker injects a script into a page that other people view. The fix is to escape output and to use textContent instead of innerHTML . Input validation: never trust input from users. Check its type, length and format on the server .","quizzes":[]}],"ex":[],"fill":[{"q":"Fill in the blanks to make this query safe by using parameters.","lang":"python","code":"query = \"SELECT * FROM users WHERE name = \u00000\u0000 AND pw = \u00001\u0000\"\ndb.execute(query, (username, pw_hash))","why":"The `?` placeholders keep user input as **data**, so it can't change the SQL.","id":"cy4-f1","kind":"fill","title":"Stop SQL injection","blanks":[["?"],["?"]]}],"quiz":[{"q":"Which port does HTTPS use by default?","choices":["80","22","443","53"],"a":2,"why":"HTTP uses 80 and HTTPS uses 443.","id":"cy4-q1","kind":"mcq","type":"quiz"},{"q":"What does a firewall do?","choices":["Encrypts your hard drive","Allows or blocks network traffic based on rules","Removes viruses","Speeds up the network"],"a":1,"why":"Firewalls filter traffic, for example by blocking ports that should never be reachable.","id":"cy4-q2","kind":"mcq","type":"quiz"},{"q":"A user types `' OR '1'='1` into a login box and gets in. What attack is this?","choices":["XSS","SQL injection","Phishing","DDoS"],"a":1,"why":"The input changes the SQL query's logic, so the WHERE clause is always true.","id":"cy4-q3","kind":"mcq","type":"quiz"},{"q":"What is the best defense against SQL injection?","choices":["Hiding the login page","Making users type slowly","Parameterized queries (prepared statements)","Using HTTPS"],"a":2,"why":"Parameters keep user input as **data**, so it can never be run as SQL code.","id":"cy4-q4","kind":"mcq","type":"quiz"},{"q":"What does **defense in depth** mean?","choices":["One very strong firewall","Several layers of security, so one failure isn't fatal","Hiding servers underground","Encrypting everything twice"],"a":1,"why":"Layered defenses like firewalls, MFA, patching and monitoring back each other up.","id":"cy4-q5","kind":"mcq","type":"quiz"},{"q":"A log shows 500 failed logins in 2 minutes from one IP address. What is the most likely explanation?","choices":["A forgetful user","A brute-force or password-guessing attack","A DNS failure","Normal traffic"],"a":1,"why":"Defenses include rate limiting, account lockouts and MFA.","id":"cy4-q6","kind":"mcq","type":"quiz"}],"trace":[],"bug":[{"q":"Click the line that makes this login vulnerable to attack.","lang":"python","code":"def login(db, username, password):\n    pw_hash = hash_password(password)\n    query = \"SELECT * FROM users WHERE name = '\" + username + \"' AND pw = '\" + pw_hash + \"'\"\n    return db.execute(query)","lines":[3],"fix":"return db.execute(\"SELECT * FROM users WHERE name = ? AND pw = ?\", (username, pw_hash))","why":"Building SQL by gluing strings together allows **SQL injection**. Use a parameterized query instead.","id":"cy4-b1","kind":"bug","type":"bug"}]}]},{"id":"dsa","title":"Data Structures & Algorithms","short":"Post-AP","emoji":"🌲","year":4,"yearLabel":"Senior","color":"#14b8a6","blurb":"Post-AP data structures and algorithms: Big-O, linked lists, stacks, queues, trees, hashing, sorting and recursion. These are the topics behind college CS2 courses and technical interviews.","units":[{"id":"ds1","title":"Big-O & Efficiency","lessons":[{"title":"Measuring how algorithms scale","mins":12,"html":"<p><strong>Big-O</strong> describes how the number of steps an algorithm takes <strong>grows</strong> as the input size <em>n</em> grows. It ignores constants and focuses on the worst case.</p>\n<table>\n<thead>\n<tr>\n<th>Big-O</th>\n<th>Name</th>\n<th>Example</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>O(1)</td>\n<td>constant</td>\n<td>getting <code>arr[i]</code></td>\n</tr>\n<tr>\n<td>O(log n)</td>\n<td>logarithmic</td>\n<td>binary search</td>\n</tr>\n<tr>\n<td>O(n)</td>\n<td>linear</td>\n<td>one loop through the data</td>\n</tr>\n<tr>\n<td>O(n log n)</td>\n<td>linearithmic</td>\n<td>merge sort</td>\n</tr>\n<tr>\n<td>O(n²)</td>\n<td>quadratic</td>\n<td>nested loops over the data</td>\n</tr>\n<tr>\n<td>O(2ⁿ)</td>\n<td>exponential</td>\n<td>trying every subset</td>\n</tr>\n</tbody></table>\n<h3>Rules of thumb</h3>\n<ul>\n<li><strong>Drop constants and smaller terms:</strong> O(3n + 100) becomes <strong>O(n)</strong>, and O(n² + n) becomes <strong>O(n²)</strong>.</li>\n<li><strong>Steps one after another add up:</strong> O(n) + O(n) = O(n).</li>\n<li><strong>Nested loops multiply:</strong> O(n) × O(n) = O(n²).</li>\n<li><strong>Halving each time means log n:</strong> if a loop divides n by 2 each pass, it&#39;s O(log n).</li>\n</ul>\n<pre><code class=\"language-python\">i = 1\nwhile i &lt; n:      # i = 1, 2, 4, 8, ... → about log₂(n) passes\n    i *= 2\n</code></pre>\n<h3>Space complexity</h3>\n<p>Big-O also measures <strong>memory</strong>. Making a copy of the input uses O(n) space, while a few variables use O(1).</p>\n<blockquote>\n<p>For n = 1,000,000: O(log n) is about 20 steps, O(n) is a million, and O(n²) is a <strong>trillion</strong>.</p>\n</blockquote>\n","text":" Big O describes how the number of steps an algorithm takes grows as the input size n grows. It ignores constants and focuses on the worst case. Big O Name Example O(1) constant getting arr[i] O(log n) logarithmic binary search O(n) linear one loop through the data O(n log n) linearithmic merge sort O(n²) quadratic nested loops over the data O(2ⁿ) exponential trying every subset Rules of thumb Drop constants and smaller terms: O(3n + 100) becomes O(n) , and O(n² + n) becomes O(n²) . Steps one after another add up: O(n) + O(n) = O(n). Nested loops multiply: O(n) × O(n) = O(n²). Halving each time means log n: if a loop divides n by 2 each pass, it's O(log n). python i = 1 while i < n: i = 1, 2, 4, 8, ... → about log₂(n) passes i = 2 Space complexity Big O also measures memory . Making a copy of the input uses O(n) space, while a few variables use O(1). For n = 1,000,000: O(log n) is about 20 steps, O(n) is a million, and O(n²) is a trillion .","quizzes":[]}],"ex":[{"id":"ds1-e1","title":"Pair sum, fast","lang":"python","mins":15,"prompt":"<p>Write <code>has_pair_sum(nums, target)</code> that returns <code>True</code> if any <strong>two different items</strong> add up to <code>target</code>. It must be <strong>O(n)</strong>, so no nested loops. The last test uses 20,000 numbers, and nested loops will time out!</p>\n","starter":"def has_pair_sum(nums, target):\n    seen = set()\n    # one loop only!\n    return False","tests":["assert has_pair_sum([1, 4, 6, 9], 10) == True, \"1 + 9 = 10, so True\"","assert has_pair_sum([1, 2, 3], 7) == False, \"No pair adds to 7\"","assert has_pair_sum([5], 10) == False, \"You can't use the same item twice\"","assert has_pair_sum(list(range(0, 40000, 2)), 3) == False, \"Too slow or wrong on 20,000 items (evens can't sum to 3)\""],"solution":"def has_pair_sum(nums, target):\n    seen = set()\n    for n in nums:\n        if target - n in seen:\n            return True\n        seen.add(n)\n    return False","hint":"For each `n`, check whether `target - n` is already in `seen`, then add `n` to `seen`.","hints":["For each `n`, check whether `target - n` is already in `seen`, then add `n` to `seen`."],"visual":false,"unit":"ds1"}],"fill":[],"quiz":[{"q":"What is the Big-O of a loop where `i` **doubles** each time until it reaches n?","choices":["O(n)","O(log n)","O(n²)","O(1)"],"a":1,"why":"Doubling reaches n after about log₂(n) steps.","id":"ds1-q1","kind":"mcq","type":"quiz"},{"q":"Two nested loops each run n times. What is the Big-O?","choices":["O(2n)","O(n)","O(n²)","O(log n)"],"a":2,"why":"The inner loop runs n times for each of the outer loop's n passes, so n × n.","id":"ds1-q2","kind":"mcq","type":"quiz"},{"q":"Simplify O(3n + 100).","choices":["O(n)","O(3n)","O(100)","O(n + 100)"],"a":0,"why":"Big-O drops constant factors and smaller terms.","id":"ds1-q3","kind":"mcq","type":"quiz"},{"q":"Which grows the fastest as n gets large?","choices":["n²","n log n","2ⁿ","n³"],"a":2,"why":"Exponential growth beats any polynomial eventually.","id":"ds1-q4","kind":"mcq","type":"quiz"},{"q":"What is the Big-O of getting `arr[500]` from an array?","choices":["O(1)","O(n)","O(log n)","O(500)"],"a":0,"why":"Arrays jump straight to any index in constant time.","id":"ds1-q5","kind":"mcq","type":"quiz"}],"trace":[{"q":"What does `f(32)` return?","choices":["16","5","6","32"],"a":1,"lang":"python","code":"def f(n):\n    count = 0\n    i = n\n    while i > 1:\n        i //= 2\n        count += 1\n    return count","why":"i goes 32 → 16 → 8 → 4 → 2 → 1, which is 5 halvings. The function computes log₂(n).","id":"ds1-t1","kind":"mcq","type":"trace"},{"q":"What is the Big-O of this function?","choices":["O(n)","O(n²)","O(n log n)","O(1)"],"a":1,"lang":"python","code":"def has_pair_sum(nums, target):\n    for i in range(len(nums)):\n        for j in range(i + 1, len(nums)):\n            if nums[i] + nums[j] == target:\n                return True\n    return False","why":"The nested loops check about n²/2 pairs, and dropping the ½ gives O(n²). Using a set brings this down to O(n).","id":"ds1-t2","kind":"mcq","type":"trace"}],"bug":[]},{"id":"ds2","title":"Linked Lists, Stacks & Queues","lessons":[{"title":"Linked lists","mins":11,"html":"<p>A <strong>linked list</strong> is a chain of <strong>nodes</strong>. Each node holds a value and a reference to the <strong>next</strong> node.</p>\n<pre><code class=\"language-python\">class Node:\n    def __init__(self, val):\n        self.val = val\n        self.next = None\n\n# 3 → 7 → 9\nhead = Node(3)\nhead.next = Node(7)\nhead.next.next = Node(9)\n</code></pre>\n<h3>Traversal</h3>\n<pre><code class=\"language-python\">cur = head\nwhile cur is not None:\n    print(cur.val)\n    cur = cur.next\n</code></pre>\n<table>\n<thead>\n<tr>\n<th>Operation</th>\n<th>Array</th>\n<th>Linked list</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Get the k-th item</td>\n<td>O(1)</td>\n<td>O(k)</td>\n</tr>\n<tr>\n<td>Insert at the front</td>\n<td>O(n) (shift everything)</td>\n<td><strong>O(1)</strong></td>\n</tr>\n<tr>\n<td>Insert after a known node</td>\n<td>O(n)</td>\n<td><strong>O(1)</strong></td>\n</tr>\n</tbody></table>\n","text":"A linked list is a chain of nodes . Each node holds a value and a reference to the next node. python class Node: def init (self, val): self.val = val self.next = None 3 → 7 → 9 head = Node(3) head.next = Node(7) head.next.next = Node(9) Traversal python cur = head while cur is not None: print(cur.val) cur = cur.next Operation Array Linked list Get the k th item O(1) O(k) Insert at the front O(n) (shift everything) O(1) Insert after a known node O(n) O(1) ","quizzes":[]},{"title":"Stacks and queues","mins":10,"html":"<h3>Stack: LIFO (last in, first out)</h3>\n<p>Think of a stack of plates.</p>\n<pre><code class=\"language-python\">stack = []\nstack.append(&quot;a&quot;)   # push\nstack.pop()         # pop → the newest item\n</code></pre>\n<p>Stacks are used for undo buttons, the browser back button, the <strong>function call stack</strong>, checking balanced parentheses and depth-first search (DFS).</p>\n<h3>Queue: FIFO (first in, first out)</h3>\n<p>Think of a lunch line.</p>\n<pre><code class=\"language-python\">from collections import deque\nq = deque()\nq.append(&quot;a&quot;)       # enqueue at the back\nq.popleft()         # dequeue from the front\n</code></pre>\n<p>Queues are used for printer jobs, task scheduling and <strong>breadth-first search</strong> (BFS).</p>\n<blockquote>\n<p>Use <code>deque</code> for queues in Python. <code>list.pop(0)</code> is O(n) because it shifts everything left.</p>\n</blockquote>\n","text":" Stack: LIFO (last in, first out) Think of a stack of plates. python stack = [] stack.append(\"a\") push stack.pop() pop → the newest item Stacks are used for undo buttons, the browser back button, the function call stack , checking balanced parentheses and depth first search (DFS). Queue: FIFO (first in, first out) Think of a lunch line. python from collections import deque q = deque() q.append(\"a\") enqueue at the back q.popleft() dequeue from the front Queues are used for printer jobs, task scheduling and breadth first search (BFS). Use deque for queues in Python. list.pop(0) is O(n) because it shifts everything left.","quizzes":[]}],"ex":[{"id":"ds2-e1","title":"Balanced brackets","lang":"python","mins":15,"prompt":"<p>Write <code>is_balanced(s)</code> that returns <code>True</code> if every <code>(</code>, <code>[</code> and <code>{</code> is closed by the matching bracket in the right order. Use a <strong>stack</strong>.</p>\n","starter":"def is_balanced(s):\n    stack = []\n    pairs = {\")\": \"(\", \"]\": \"[\", \"}\": \"{\"}\n    for ch in s:\n        pass\n    return True","tests":["assert is_balanced(\"([]{})\") == True, '\"([]{})\" is balanced'","assert is_balanced(\"([)]\") == False, '\"([)]\" closes in the wrong order'","assert is_balanced(\"((\") == False, '\"((\" never closes'","assert is_balanced(\"\") == True, \"An empty string is balanced\"","assert is_balanced(\"a(b)c\") == True, \"Ignore non-bracket characters\"","assert is_balanced(\")(\") == False, '\")(\" closes before it opens'"],"solution":"def is_balanced(s):\n    stack = []\n    pairs = {\")\": \"(\", \"]\": \"[\", \"}\": \"{\"}\n    for ch in s:\n        if ch in \"([{\":\n            stack.append(ch)\n        elif ch in pairs:\n            if not stack or stack.pop() != pairs[ch]:\n                return False\n    return len(stack) == 0","hint":"Push opening brackets. On a closing bracket, pop and check it matches. At the end, the stack must be empty.","hints":["Push opening brackets. On a closing bracket, pop and check it matches. At the end, the stack must be empty."],"visual":false,"unit":"ds2"}],"fill":[],"quiz":[{"q":"Which data structure is LIFO?","choices":["Stack","Queue","Linked list","Hash table"],"a":0,"why":"Last in, first out: the most recently added item comes out first.","id":"ds2-q1","kind":"mcq","type":"quiz"},{"q":"Which data structure fits a printer that handles jobs in the order they arrive?","choices":["Stack","Queue","Binary tree","Set"],"a":1,"why":"First come, first served is FIFO, which is a queue.","id":"ds2-q2","kind":"mcq","type":"quiz"},{"q":"What is the time to insert at the **front** of a singly linked list?","choices":["O(1)","O(n)","O(log n)","O(n²)"],"a":0,"why":"Create a node, point it at the old head, and update head. No shifting is needed.","id":"ds2-q3","kind":"mcq","type":"quiz"},{"q":"What is the time to get the k-th element of a linked list?","choices":["O(1)","O(k)","O(log k)","O(1) if the list is sorted"],"a":1,"why":"You must follow k `next` pointers from the head. Linked lists don't allow random access.","id":"ds2-q4","kind":"mcq","type":"quiz"},{"q":"Which data structure checks whether brackets like `{[()]}` are balanced?","choices":["Stack","Queue","Array sorted first","Hash table"],"a":0,"why":"Push each opening bracket. Each closing bracket must match the item on top of the stack.","id":"ds2-q5","kind":"mcq","type":"quiz"}],"trace":[{"q":"What is printed?","choices":["abcd","abd","dab","bcd"],"a":1,"lang":"python","code":"stack = []\nfor ch in \"abc\":\n    stack.append(ch)\nstack.pop()\nstack.append(\"d\")\nprint(\"\".join(stack))","why":"The stack becomes [a, b, c], `pop` removes c, and then d is pushed, giving [a, b, d].","id":"ds2-t1","kind":"mcq","type":"trace"},{"q":"What is printed?","choices":["[1, 2, 3]","[3, 1, 20]","[20, 1, 3]","[3, 10, 20]"],"a":1,"lang":"python","code":"from collections import deque\nq = deque([1, 2, 3])\nq.append(q.popleft())\nq.append(q.popleft() * 10)\nprint(list(q))","why":"The 1 moves to the back, giving [2, 3, 1]. Then the 2 comes off the front, and 2 × 10 = 20 goes on the back, giving [3, 1, 20].","id":"ds2-t2","kind":"mcq","type":"trace"}],"bug":[{"q":"`length(None)` crashes, and `length` of a 3-node list returns 2. Click the bug.","lang":"python","code":"def length(head):\n    count = 0\n    cur = head\n    while cur.next is not None:\n        count += 1\n        cur = cur.next\n    return count","lines":[4],"fix":"while cur is not None:","why":"Checking `cur.next` stops one node early and crashes when `cur` is None. Check `cur` itself.","id":"ds2-b1","kind":"bug","type":"bug"}]},{"id":"ds3","title":"Trees & Hash Tables","lessons":[{"title":"Binary search trees","mins":12,"html":"<p>A <strong>binary tree</strong> node has at most two children, <strong>left</strong> and <strong>right</strong>. The top node is the <strong>root</strong>, and nodes with no children are <strong>leaves</strong>.</p>\n<h3>The BST property</h3>\n<p>In a <strong>binary search tree</strong> (BST), everything in a node&#39;s <strong>left</strong> subtree is smaller than the node, and everything in its <strong>right</strong> subtree is larger.</p>\n<pre><code>        50\n       /  \\\n     30    70\n    /  \\   /\n  20   40 60\n</code></pre>\n<p>Searching, inserting and deleting in a <strong>balanced</strong> tree take <strong>O(log n)</strong> time. If you insert values that are already sorted, the tree becomes a &quot;linked list&quot; shape and those operations slow down to <strong>O(n)</strong>.</p>\n<h3>Traversals</h3>\n<ul>\n<li><strong>In-order</strong> (left, node, right): 20 30 40 50 60 70. This gives <strong>sorted order</strong>.</li>\n<li><strong>Pre-order</strong> (node, left, right): 50 30 20 40 70 60. Use it to copy a tree.</li>\n<li><strong>Post-order</strong> (left, right, node): 20 40 30 60 70 50. Use it to delete a tree.</li>\n<li><strong>Level-order</strong> visits each level from left to right, using a queue (BFS).</li>\n</ul>\n","text":"A binary tree node has at most two children, left and right . The top node is the root , and nodes with no children are leaves . The BST property In a binary search tree (BST), everything in a node's left subtree is smaller than the node, and everything in its right subtree is larger. 50 / \\ 30 70 / \\ / 20 40 60 Searching, inserting and deleting in a balanced tree take O(log n) time. If you insert values that are already sorted, the tree becomes a \"linked list\" shape and those operations slow down to O(n) . Traversals In order (left, node, right): 20 30 40 50 60 70. This gives sorted order . Pre order (node, left, right): 50 30 20 40 70 60. Use it to copy a tree. Post order (left, right, node): 20 40 30 60 70 50. Use it to delete a tree. Level order visits each level from left to right, using a queue (BFS).","quizzes":[]},{"title":"Hash tables","mins":10,"html":"<p>A <strong>hash table</strong> uses a <strong>hash function</strong> to turn a key into an array index. Python&#39;s <code>dict</code> and <code>set</code>, and Java&#39;s <code>HashMap</code>, are hash tables.</p>\n<pre><code class=\"language-python\">ages = {&quot;ada&quot;: 36, &quot;alan&quot;: 41}\nages[&quot;grace&quot;] = 85      # insert: average O(1)\n&quot;ada&quot; in ages           # lookup: average O(1)\n</code></pre>\n<h3>Collisions</h3>\n<p>A <strong>collision</strong> happens when two keys hash to the same index. There are two common fixes:</p>\n<ul>\n<li><strong>Chaining:</strong> each slot holds a small list of entries.</li>\n<li><strong>Open addressing:</strong> probe for the next open slot.</li>\n</ul>\n<p>If the table gets too full, it <strong>resizes</strong> (rehashes everything) to keep operations fast. The worst case is O(n), but with a good hash function the average is O(1).</p>\n<blockquote>\n<p><strong>Interview trick:</strong> many O(n²) &quot;check all pairs&quot; problems become O(n) with a set or dict.</p>\n</blockquote>\n","text":"A hash table uses a hash function to turn a key into an array index. Python's dict and set , and Java's HashMap , are hash tables. python ages = {\"ada\": 36, \"alan\": 41} ages[\"grace\"] = 85 insert: average O(1) \"ada\" in ages lookup: average O(1) Collisions A collision happens when two keys hash to the same index. There are two common fixes: Chaining: each slot holds a small list of entries. Open addressing: probe for the next open slot. If the table gets too full, it resizes (rehashes everything) to keep operations fast. The worst case is O(n), but with a good hash function the average is O(1). Interview trick: many O(n²) \"check all pairs\" problems become O(n) with a set or dict.","quizzes":[]}],"ex":[{"id":"ds3-e1","title":"Word counts with a dict","lang":"python","mins":12,"prompt":"<p>Write <code>word_counts(text)</code> that returns a <strong>dictionary</strong> mapping each lowercase word to how many times it appears.</p>\n","starter":"def word_counts(text):\n    counts = {}\n    return counts","tests":["assert word_counts(\"the cat and the hat\") == {\"the\": 2, \"cat\": 1, \"and\": 1, \"hat\": 1}, \"Count each word\"","assert word_counts(\"Go go GO\") == {\"go\": 3}, \"Make words lowercase first\"","assert word_counts(\"\") == {}, \"Empty text gives an empty dict\""],"solution":"def word_counts(text):\n    counts = {}\n    for w in text.lower().split():\n        counts[w] = counts.get(w, 0) + 1\n    return counts","hint":"`counts.get(w, 0) + 1` handles words you haven't seen yet.","hints":["`counts.get(w, 0) + 1` handles words you haven't seen yet."],"visual":false,"unit":"ds3"}],"fill":[],"quiz":[{"q":"Which traversal of a BST visits the values in sorted order?","choices":["Pre-order","In-order","Post-order","Level-order"],"a":1,"why":"In-order visits the left subtree, then the node, then the right subtree, which gives smallest to largest.","id":"ds3-q1","kind":"mcq","type":"quiz"},{"q":"You insert 1, 2, 3, 4, 5 (in that order) into an empty BST. What shape does the tree have?","choices":["Perfectly balanced","A straight line to the right, so searches take O(n)","A straight line to the left","Impossible to tell"],"a":1,"why":"Each new value is larger than everything before it, so it always goes right. The tree degenerates into a list.","id":"ds3-q2","kind":"mcq","type":"quiz"},{"q":"What is a hash collision?","choices":["A hash function that crashes","Two different keys mapping to the same index","Two equal keys","A full table"],"a":1,"why":"Collisions are unavoidable. Chaining and probing are the standard fixes.","id":"ds3-q3","kind":"mcq","type":"quiz"},{"q":"What is the average time for `x in my_set` in Python?","choices":["O(1)","O(n)","O(log n)","O(n²)"],"a":0,"why":"Sets are hash tables, so lookups take constant time on average.","id":"ds3-q4","kind":"mcq","type":"quiz"},{"q":"A balanced BST holds about 1,000,000 nodes. About how tall is it?","choices":["1,000","20","500,000","1,000,000"],"a":1,"why":"The height of a balanced tree is about log₂(1,000,000), which is roughly 20.","id":"ds3-q5","kind":"mcq","type":"quiz"}],"trace":[{"q":"You insert 50, 30, 70, 20, 40, 60 into an empty BST in that order. What is the **pre-order** traversal?","choices":["20 30 40 50 60 70","50 30 20 40 70 60","20 40 30 60 70 50","50 30 70 20 40 60"],"a":1,"lang":"text","code":"insert: 50, 30, 70, 20, 40, 60","why":"Pre-order visits the node, then the left subtree, then the right subtree: 50, then 30 → 20 → 40, then 70 → 60.","id":"ds3-t1","kind":"mcq","type":"trace"},{"q":"What is printed?","choices":["1 5","2 4","2 5","1 4"],"a":1,"lang":"python","code":"counts = {}\nfor w in \"the cat and the hat\".split():\n    counts[w] = counts.get(w, 0) + 1\nprint(counts[\"the\"], len(counts))","why":"\"the\" appears twice. The unique words are the, cat, and, hat, so there are 4 keys.","id":"ds3-t2","kind":"mcq","type":"trace"}],"bug":[{"q":"`bst_search` can't find values that are in the tree. Click the bug.","lang":"python","code":"def bst_search(node, target):\n    if node is None:\n        return False\n    if target == node.val:\n        return True\n    if target < node.val:\n        return bst_search(node.right, target)\n    return bst_search(node.left, target)","lines":[7,8],"fix":"return bst_search(node.left, target)   # smaller values are on the LEFT","why":"The directions are swapped. Smaller targets should go **left** and larger targets should go **right**.","id":"ds3-b1","kind":"bug","type":"bug"}]},{"id":"ds4","title":"Sorting, Searching & Recursion","lessons":[{"title":"Sorting algorithms compared","mins":12,"html":"<table>\n<thead>\n<tr>\n<th>Algorithm</th>\n<th>Best</th>\n<th>Average</th>\n<th>Worst</th>\n<th>Notes</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Selection</td>\n<td>O(n²)</td>\n<td>O(n²)</td>\n<td>O(n²)</td>\n<td>simple, few swaps</td>\n</tr>\n<tr>\n<td>Insertion</td>\n<td><strong>O(n)</strong></td>\n<td>O(n²)</td>\n<td>O(n²)</td>\n<td>great for nearly sorted data</td>\n</tr>\n<tr>\n<td>Merge</td>\n<td>O(n log n)</td>\n<td>O(n log n)</td>\n<td>O(n log n)</td>\n<td>stable; needs O(n) extra space</td>\n</tr>\n<tr>\n<td>Quick</td>\n<td>O(n log n)</td>\n<td>O(n log n)</td>\n<td><strong>O(n²)</strong></td>\n<td>fast in practice; the pivot choice matters</td>\n</tr>\n</tbody></table>\n<h3>Merge sort</h3>\n<ol>\n<li>Split the array in half.</li>\n<li>Recursively sort each half.</li>\n<li><strong>Merge</strong> the two sorted halves.</li>\n</ol>\n<p>There are about log n levels of splitting, and each level does O(n) work to merge, so the total is <strong>O(n log n)</strong>.</p>\n<h3>Stability</h3>\n<p>A <strong>stable</strong> sort keeps items that compare as equal in their original order. This matters when you sort by one field after another.</p>\n<h3>Binary search (iterative)</h3>\n<pre><code class=\"language-python\">def binary_search(arr, target):\n    lo, hi = 0, len(arr) - 1\n    while lo &lt;= hi:\n        mid = (lo + hi) // 2\n        if arr[mid] == target: return mid\n        if arr[mid] &lt; target: lo = mid + 1\n        else: hi = mid - 1\n    return -1\n</code></pre>\n","text":" Algorithm Best Average Worst Notes Selection O(n²) O(n²) O(n²) simple, few swaps Insertion O(n) O(n²) O(n²) great for nearly sorted data Merge O(n log n) O(n log n) O(n log n) stable; needs O(n) extra space Quick O(n log n) O(n log n) O(n²) fast in practice; the pivot choice matters Merge sort 1. Split the array in half. 2. Recursively sort each half. 3. Merge the two sorted halves. There are about log n levels of splitting, and each level does O(n) work to merge, so the total is O(n log n) . Stability A stable sort keeps items that compare as equal in their original order. This matters when you sort by one field after another. Binary search (iterative) python def binary search(arr, target): lo, hi = 0, len(arr) 1 while lo <= hi: mid = (lo + hi) // 2 if arr[mid] == target: return mid if arr[mid] < target: lo = mid + 1 else: hi = mid 1 return 1 ","quizzes":[]},{"title":"Recursion and memoization","mins":11,"html":"<p>Every recursive function needs:</p>\n<ol>\n<li>A <strong>base case</strong> that stops the recursion.</li>\n<li>A <strong>recursive case</strong> that moves toward the base case.</li>\n</ol>\n<p>Each call gets a new frame on the <strong>call stack</strong>. If the recursion goes too deep, you get a stack overflow.</p>\n<h3>Memoization</h3>\n<p>Naive recursive Fibonacci recomputes the same values again and again, which takes <strong>O(2ⁿ)</strong> time. <strong>Memoization</strong> caches the answers, which brings it down to <strong>O(n)</strong>.</p>\n<pre><code class=\"language-python\">memo = {}\ndef fib(n):\n    if n &lt; 2: return n\n    if n not in memo:\n        memo[n] = fib(n - 1) + fib(n - 2)\n    return memo[n]\n</code></pre>\n<p>This is the core idea behind <strong>dynamic programming</strong>.</p>\n","text":"Every recursive function needs: 1. A base case that stops the recursion. 2. A recursive case that moves toward the base case. Each call gets a new frame on the call stack . If the recursion goes too deep, you get a stack overflow. Memoization Naive recursive Fibonacci recomputes the same values again and again, which takes O(2ⁿ) time. Memoization caches the answers, which brings it down to O(n) . python memo = {} def fib(n): if n < 2: return n if n not in memo: memo[n] = fib(n 1) + fib(n 2) return memo[n] This is the core idea behind dynamic programming .","quizzes":[]}],"ex":[{"id":"ds4-e1","title":"Binary search","lang":"python","mins":15,"prompt":"<p>Write <code>binary_search(arr, target)</code> for a <strong>sorted</strong> list. Return the index of <code>target</code>, or <code>-1</code> if it isn&#39;t there. Don&#39;t use <code>.index()</code> or <code>in</code>.</p>\n","starter":"def binary_search(arr, target):\n    lo, hi = 0, len(arr) - 1\n    while lo <= hi:\n        mid = (lo + hi) // 2\n        # compare arr[mid] with target\n        break\n    return -1","tests":["assert binary_search([2, 5, 8, 12, 16, 23], 23) == 5, \"Find 23 at index 5\"","assert binary_search([2, 5, 8, 12, 16, 23], 2) == 0, \"Find 2 at index 0\"","assert binary_search([2, 5, 8, 12, 16, 23], 7) == -1, \"7 isn't in the list, so return -1\"","assert binary_search([], 3) == -1, \"An empty list returns -1\"","assert binary_search([7], 7) == 0, \"A single-item list works\""],"solution":"def binary_search(arr, target):\n    lo, hi = 0, len(arr) - 1\n    while lo <= hi:\n        mid = (lo + hi) // 2\n        if arr[mid] == target:\n            return mid\n        elif arr[mid] < target:\n            lo = mid + 1\n        else:\n            hi = mid - 1\n    return -1","hint":"If `arr[mid]` is too small, move `lo` to `mid + 1`. If it's too big, move `hi` to `mid - 1`.","hints":["If `arr[mid]` is too small, move `lo` to `mid + 1`. If it's too big, move `hi` to `mid - 1`."],"visual":false,"unit":"ds4"},{"id":"ds4-e2","title":"Merge two sorted lists","lang":"python","mins":15,"prompt":"<p>Write <code>merge(a, b)</code> that merges two <strong>sorted</strong> lists into one sorted list in O(n + m) time. This is the heart of merge sort! Don&#39;t call <code>sorted()</code>.</p>\n","starter":"def merge(a, b):\n    result = []\n    i = j = 0\n    # take the smaller front item each time\n    return result","tests":["assert merge([1, 4, 9], [2, 3, 10]) == [1, 2, 3, 4, 9, 10], \"merge([1, 4, 9], [2, 3, 10])\"","assert merge([], [1, 2]) == [1, 2], \"An empty first list works\"","assert merge([5], []) == [5], \"An empty second list works\"","assert merge([1, 1], [1]) == [1, 1, 1], \"Duplicates are kept\""],"solution":"def merge(a, b):\n    result = []\n    i = j = 0\n    while i < len(a) and j < len(b):\n        if a[i] <= b[j]:\n            result.append(a[i]); i += 1\n        else:\n            result.append(b[j]); j += 1\n    result.extend(a[i:])\n    result.extend(b[j:])\n    return result","hint":"Loop while both lists still have items. Then add whatever is left in either list.","hints":["Loop while both lists still have items. Then add whatever is left in either list."],"visual":false,"unit":"ds4"}],"fill":[],"quiz":[{"q":"What is merge sort's worst-case time?","choices":["O(n²)","O(n log n)","O(n)","O(log n)"],"a":1,"why":"Merge sort always splits evenly, so it's O(n log n) in every case.","id":"ds4-q1","kind":"mcq","type":"quiz"},{"q":"When does quicksort hit its O(n²) worst case?","choices":["On random data","When it keeps picking bad pivots (like the first item of an already sorted array)","When n is small","Never"],"a":1,"why":"Bad pivots create very lopsided splits, so you get n levels instead of log n.","id":"ds4-q2","kind":"mcq","type":"quiz"},{"q":"Which sort is fastest on an **almost sorted** array?","choices":["Selection sort","Insertion sort","Merge sort, always","They're all the same"],"a":1,"why":"Insertion sort does very little work when items are already close to their final positions, approaching O(n).","id":"ds4-q3","kind":"mcq","type":"quiz"},{"q":"What does memoization do for recursive Fibonacci?","choices":["Nothing","Turns exponential time into linear time by caching results","Makes it use less memory","Removes the need for a base case"],"a":1,"why":"Each fib(k) is computed only once and then reused.","id":"ds4-q4","kind":"mcq","type":"quiz"},{"q":"What does it mean for a sort to be **stable**?","choices":["It never crashes","Items with equal keys stay in their original relative order","It always takes the same amount of time","It sorts in place"],"a":1,"why":"Stability matters when you sort by multiple fields, for example by grade, then by name.","id":"ds4-q5","kind":"mcq","type":"quiz"}],"trace":[{"q":"What does `fib(7)` return?","choices":["8","13","21","7"],"a":1,"lang":"python","code":"def fib(n):\n    if n < 2:\n        return n\n    return fib(n - 1) + fib(n - 2)\n\nprint(fib(7))","why":"The sequence goes 0, 1, 1, 2, 3, 5, 8, 13, so fib(7) = 13.","id":"ds4-t1","kind":"mcq","type":"trace"},{"q":"Binary search looks for 23 in this list. How many elements does it check?","choices":["1","2","3","6"],"a":2,"lang":"python","code":"arr = [2, 5, 8, 12, 16, 23, 38, 56, 72, 91]\n# lo=0, hi=9 to start; mid = (lo + hi) // 2","why":"It checks index 4 (16, too small), then index 7 (56, too big), then index 5 (23, found). That's 3 checks.","id":"ds4-t2","kind":"mcq","type":"trace"}],"bug":[{"q":"This binary search can't find the target when the search range shrinks to a single item. Click the bug.","lang":"python","code":"def binary_search(arr, target):\n    lo, hi = 0, len(arr) - 1\n    while lo < hi:\n        mid = (lo + hi) // 2\n        if arr[mid] == target:\n            return mid\n        elif arr[mid] < target:\n            lo = mid + 1\n        else:\n            hi = mid - 1\n    return -1","lines":[3],"fix":"while lo <= hi:","why":"When `lo == hi`, one item is still left to check. `<` skips it, so for example `binary_search([7], 7)` returns −1.","id":"ds4-b1","kind":"bug","type":"bug"}]}]}];
window.GLOSSARY = [{"term":"variable","aliases":["variables"],"def":"A name that refers to a value stored in memory, like `score = 10`."},{"term":"value","aliases":["values"],"def":"A piece of data, such as a number, some text or `True`."},{"term":"data type","aliases":["data types","type","types"],"def":"The kind of a value, such as int, float, str, bool or list. It decides what you can do with the value."},{"term":"integer","aliases":["int","ints","integers"],"def":"A whole number with no decimal point, like `42` or `-7`."},{"term":"float","aliases":["floats","double","doubles"],"def":"A number with a decimal point, like `3.14`."},{"term":"string","aliases":["strings","str"],"def":"Text in quotes, like `\"hello\"`."},{"term":"boolean","aliases":["booleans","bool"],"def":"A value that is either True or False."},{"term":"condition","aliases":["conditions"],"def":"An expression that is either True or False. It decides whether an if statement's code runs."},{"term":"if statement","aliases":["if statements","if-statement","selection"],"def":"Code that runs a block only when its condition is True."},{"term":"else","aliases":[],"def":"The part of an if statement that runs when the condition is False."},{"term":"elif","aliases":["else if"],"def":"\"Else if\". It checks another condition when the earlier ones were False."},{"term":"comparison operator","aliases":["comparison operators","relational operator","relational operators"],"def":"An operator that compares two values and gives a boolean: `==`, `!=`, `<`, `>`, `<=`, `>=`."},{"term":"logical operator","aliases":["logical operators","boolean operator"],"def":"`and`, `or` and `not` (or `&&`, `||` and `!`). They combine or flip boolean values."},{"term":"nested","aliases":["nesting"],"def":"Code placed inside another block, like an if inside another if, or a loop inside a loop."},{"term":"indentation","aliases":["indent","indented"],"def":"Spaces at the start of a line. In Python, they show which lines belong to a block."},{"term":"block","aliases":["blocks","code block"],"def":"A group of lines that run together, like the body of an if, a loop or a function."},{"term":"truthy","aliases":["falsy","truthiness"],"def":"How a value acts in a condition. Falsy values (0, empty text, empty lists, None/null) count as False. Everything else is truthy."},{"term":"short-circuit","aliases":["short-circuiting","short-circuit evaluation"],"def":"When `and`/`or` stop checking as soon as the answer is known."},{"term":"conditional expression","aliases":["ternary","ternary operator"],"def":"A one-line if that picks between two values: `a if cond else b` in Python, or `cond ? a : b` in JavaScript and Java."},{"term":"loop","aliases":["loops","iteration","iterate"],"def":"Code that repeats. `for` loops go through a range or a collection, and `while` loops repeat while a condition is True."},{"term":"infinite loop","aliases":[],"def":"A loop that never ends because its condition never becomes False."},{"term":"function","aliases":["functions","procedure","procedures"],"def":"A named, reusable block of code that you call by name."},{"term":"method","aliases":["methods"],"def":"A function that belongs to an object, called with a dot: `name.upper()`."},{"term":"parameter","aliases":["parameters"],"def":"A variable in a function definition that receives a value when the function is called."},{"term":"argument","aliases":["arguments"],"def":"The actual value you pass into a function when you call it."},{"term":"return","aliases":["return value","returns"],"def":"Sends a value back from a function to the code that called it."},{"term":"scope","aliases":[],"def":"Where in the code a variable exists and can be used."},{"term":"list","aliases":["lists","array","arrays","ArrayList"],"def":"An ordered collection of values that you can access by index."},{"term":"index","aliases":["indexes","indices"],"def":"The position of an item in a list or string. Python, Java and JavaScript start counting at 0. AP pseudocode starts at 1."},{"term":"dictionary","aliases":["dictionaries","dict","hash table","hash map"],"def":"A collection of key-value pairs, like `{\"ada\": 36}`."},{"term":"syntax error","aliases":["SyntaxError","syntax errors"],"def":"An error from code that breaks the language's rules, so it can't run."},{"term":"runtime error","aliases":["runtime errors","exception","exceptions"],"def":"An error that happens while the program is running, like dividing by zero."},{"term":"logic error","aliases":["logic errors","bug","bugs"],"def":"The program runs but gives the wrong result."},{"term":"debugging","aliases":["debug"],"def":"Finding and fixing bugs."},{"term":"algorithm","aliases":["algorithms"],"def":"A step-by-step set of instructions to solve a problem."},{"term":"class","aliases":["classes"],"def":"A blueprint for making objects. It defines their data and methods."},{"term":"object","aliases":["objects","instance","instances"],"def":"A specific thing made from a class."},{"term":"constructor","aliases":["constructors"],"def":"A special method that sets up a new object."},{"term":"recursion","aliases":["recursive"],"def":"When a function calls itself. It needs a base case to stop."},{"term":"base case","aliases":[],"def":"The simple case where a recursive function stops calling itself."},{"term":"abstraction","aliases":[],"def":"Hiding details so you can use something without knowing how it works inside."},{"term":"binary","aliases":[],"def":"Base-2 numbers that use only 0 and 1. Every bit is a power of 2."},{"term":"modulo","aliases":["mod","MOD","remainder","modulus"],"def":"The `%` operator (`MOD` in AP pseudocode). It gives the remainder after division, so `7 % 3` is 1."},{"term":"concatenation","aliases":["concatenate"],"def":"Joining strings together with `+`."},{"term":"encryption","aliases":["encrypt","decrypt"],"def":"Scrambling data so only someone with the key can read it."},{"term":"Big-O","aliases":["big o","time complexity"],"def":"A way to describe how an algorithm's work grows as its input gets bigger."}];

const $ = (s, el = document) => el.querySelector(s);

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
// inline formatting for question text: `code` and **bold**
const fmt = s => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/\*([^*]+)\*/g, '<i>$1</i>');
const clamp = (n, a, b) => Math.max(a, Math.min(b, n));
const pick = a => a[Math.floor(Math.random() * a.length)];
function shuffle(a, rnd = Math.random) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function seeded(seed) { let s = 0; for (const c of String(seed)) s = (s * 31 + c.charCodeAt(0)) >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const today = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
function isoWeek(d = new Date()) {

    const y = new Date(); y.setDate(y.getDate() - 1);

const KW = {

/* ================= Glossary: clickable terms in lessons + glossary page ================= */
const GLOSS = (window.GLOSSARY || []).map(g => ({ ...g, forms: [g.term, ...g.aliases] }));
const NO_AUTO = new Set(['value', 'values', 'type', 'types', 'block', 'blocks', 'return', 'returns', 'else', 'list', 'lists', 'index', 'bug', 'bugs', 'debug', 'mod', 'remainder', 'iterate', 'instance', 'instances', 'objects', 'object', 'int', 'str', 'dict', 'bool', 'indent', 'double', 'doubles', 'exception', 'exceptions', 'iteration', 'loop', 'loops', 'nesting', 'selection', 'array', 'arrays']);
const glossFind = word => { const w = word.toLowerCase(); return GLOSS.find(g => g.forms.some(f => f.toLowerCase() === w)); };
function linkGlossary(root) {
  if (!GLOSS.length) return;
  const used = new Set();
  const forms = GLOSS.flatMap(g => g.forms.filter(f => !NO_AUTO.has(f.toLowerCase())).map(f => [f, g])).sort((a, b) => b[0].length - a[0].length);
  const re = new RegExp('\\b(' + forms.map(([f]) => f.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + ')\\b', 'i');
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, { acceptNode: n => n.parentElement.closest('code,pre,a,button,h1,h2,h3,h4,th,textarea,.lq,.iq,.gl,.choice,.explain,.example') ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT });
  const nodes = []; while (walker.nextNode()) nodes.push(walker.currentNode);
  for (const node of nodes) {
    let n = node;
    for (let guard = 0; guard < 6 && n; guard++) {
      const m = n.textContent.match(re); if (!m) break;
      const g = glossFind(m[1]); if (!g || used.has(g.term)) {
        // skip this match: split after it and keep scanning the rest
        const rest = n.splitText(m.index + m[1].length); n = rest; continue;
      }
      used.add(g.term);
      const mid = n.splitText(m.index), after = mid.splitText(m[1].length);
      const b = document.createElement('button'); b.className = 'gl'; b.type = 'button'; b.dataset.term = g.term; b.textContent = mid.textContent; b.setAttribute('aria-label', `${mid.textContent}: show definition`);
      mid.replaceWith(b); n = after;
    }
  }
}

  const ta = $('.ed-ta', host), hl = $('.ed-hl code', host), gut = $('.ed-gutter', host);
  const indent = lang === 'python' || lang === 'java' ? '    ' : '  ';
  let escaped = false;
  const paint = () => {
    hl.innerHTML = highlight(ta.value, lang) + '\n ';
    const n = ta.value.split('\n').length;
    gut.innerHTML = Array.from({ length: n }, (_, i) => `<span>${i + 1}</span>`).join('');
  };
  ta.value = code; paint();
  ta.addEventListener('input', () => { paint(); onChange && onChange(ta.value); });
  ta.addEventListener('keydown', e => {

    if (e.key === 'Tab' && !escaped) {

      const ls = v.lastIndexOf('\n', s - 1) + 1;
      if (e.shiftKey) { if (v.slice(ls, ls + indent.length) === indent) { ta.setRangeText('', ls, ls + indent.length, 'preserve'); ta.selectionStart = ta.selectionEnd = Math.max(ls, s - indent.length); } }

    }

function runCode(lang, code, { tests = [], stdin = '', onStatus } = {}) {
  return new Promise(resolve => {
    let w, timer;
    const isPy = lang === 'python';
    if (isPy) { if (!pyW) { pyW = workerFrom(PY_WORKER); pyReady = false; } w = pyW; }
    else w = workerFrom(JS_WORKER);
    const kill = (msg) => { w.terminate(); if (isPy) { pyW = null; pyReady = false; } resolve({ out: '', err: msg, res: tests.map(() => [false, msg]), timeout: true }); };
    const arm = () => { clearTimeout(timer); timer = setTimeout(() => kill('Timed out after 8 seconds. Is there an infinite loop, or is your code too slow?'), 8000); };
    w.onmessage = e => {
      const d = e.data;
      if (d.type === 'ready') { pyReady = true; onStatus && onStatus('running'); arm(); return; }
      clearTimeout(timer); if (!isPy) w.terminate();
      if (d.type === 'fatal') { if (isPy) { pyW.terminate(); pyW = null; } resolve({ out: '', err: /importScripts|NetworkError|Failed to fetch|load/i.test(d.error) ? 'Could not download Python. Your network may block cdn.jsdelivr.net, or you might be offline.' : d.error, res: tests.map(() => [false, 'Could not run']), blocked: true }); return; }
      resolve(d);
    };
    w.onerror = e => { clearTimeout(timer); resolve({ out: '', err: e.message || 'Worker error', res: tests.map(() => [false, 'Could not run']) }); };
    if (isPy && !pyReady) { onStatus && onStatus('loading'); timer = setTimeout(() => kill('Python took too long to load. Check your connection and try again.'), 45000); }
    else arm();
    w.postMessage({ url: PYODIDE_URL, code, tests, stdin });
  });
}
function runHtml(frame, code, tests = []) {
  return new Promise(resolve => {
    const pre = `<script>window.__logs=[];['log','error','warn'].forEach(k=>{const o=console[k];console[k]=(...a)=>{__logs.push(a.map(x=>typeof x==='string'?x:JSON.stringify(x)).join(' '));o.apply(console,a)}});window.onerror=(m,s,l)=>{__logs.push('Error: '+m+(l?' (line '+l+')':''))};<\/script>`;
    frame.onload = () => setTimeout(() => {
      let res = [], out = '';
      try {
        const doc = frame.contentDocument, win = frame.contentWindow;
        res = tests.map(t => { try { new Function('doc', 'win', 'assert', t)(doc, win, (c, m) => { if (!c) throw new Error(m || 'Test failed'); }); return [true, '']; } catch (e) { return [false, e.message]; } });
        out = (win.__logs || []).join('\n');
      } catch (e) { res = tests.map(() => [false, 'Preview could not be checked']); }
      resolve({ out, err: null, res });
    }, 120);
    frame.srcdoc = (/<head[^>]*>/i.test(code) ? code.replace(/<head[^>]*>/i, m => m + pre) : pre + code);
  });
}

/* ---------- Friendly error explanations ---------- */
const ERR_HELP = [
  [/expected ':'/, "Lines that start with <code>if</code>, <code>elif</code>, <code>else</code>, <code>for</code>, <code>while</code> or <code>def</code> must end with a colon <code>:</code>."],
  [/IndentationError: expected an indented block/, "After a line that ends in a colon, the next line must be indented (4 spaces)."],
  [/IndentationError: unexpected indent/, "This line is indented but shouldn't be. Line it up with the code around it."],
  [/IndentationError: unindent does not match|TabError/, "The indentation doesn't line up. Lines in the same block need exactly the same number of spaces."],
  [/Maybe you meant '==' or ':='|cannot assign to/, "To <b>compare</b> two values, use <code>==</code>. A single <code>=</code> <b>stores</b> a value."],
  [/unterminated string|EOL while scanning/, "A string is missing its closing quote mark."],
  [/was never closed|unexpected EOF/, "A bracket <code>( [ {</code> was opened but never closed."],
  [/invalid syntax|SyntaxError/, "Python couldn't understand this line. Check for a missing colon, quote, bracket or operator."],
  [/NameError: name '(\w+)' is not defined/, "Python doesn't know the name <code>$1</code>. Check the spelling and capital letters, and make sure you created it before using it. If you meant text, put it in quotes."],
  [/can only concatenate str|unsupported operand type\(s\) for \+: 'int' and 'str'|must be str, not int/, "You're mixing text and numbers. Convert first with <code>str(...)</code> or <code>int(...)</code>."],
  [/'(<|>|<=|>=)' not supported between/, "You're comparing two different kinds of values (like a number and text). Convert one so they match."],
  [/missing \d+ required positional argument/, "You called a function without giving it all the values (arguments) it needs."],
  [/ZeroDivisionError|division by zero/, "You divided by zero. Check the number you're dividing by first, maybe with an <code>if</code> statement!"],
  [/IndexError|index out of range/, "You used an index that doesn't exist. Indexes start at 0 and end at <code>len(...) - 1</code>."],
  [/KeyError/, "That key isn't in the dictionary. Check the spelling, or use <code>.get(key, default)</code>."],
  [/AttributeError: '(\w+)' object has no attribute '(\w+)'/, "A <code>$1</code> doesn't have <code>.$2</code>. Check the method name."],
  [/ValueError: invalid literal for int/, "<code>int()</code> can only convert text that looks like a whole number."],
  [/RecursionError|Maximum call stack/, "A function keeps calling itself forever. Add or fix the base case."],
  [/ReferenceError: (\w+) is not defined/, "JavaScript doesn't know <code>$1</code>. Check the spelling, and declare it with <code>let</code> or <code>const</code> first."],
  [/TypeError: (\S+) is not a function/, "<code>$1</code> isn't a function. Check the name, or whether you added <code>()</code> to something that isn't a function."],
  [/Assignment to constant variable/, "You can't change a <code>const</code>. Use <code>let</code> if the value needs to change."],
  [/Unexpected token|Unexpected end of input/, "JavaScript found something it didn't expect. Look for a missing <code>)</code>, <code>}</code> or quote."],
  [/Timed out/, "Your code ran too long. Check that every loop has a way to stop: does the condition ever become False?"],
];
function explainError(err) {
  if (!err) return '';
  for (const [re, msg] of ERR_HELP) { const m = err.match(re); if (m) return `<div class="err-help">💡 <b>What this means:</b> ${msg.replace(/\$(\d)/g, (_, i) => esc(m[+i] || ''))}<br><small class="muted">Errors are normal. Every programmer sees them all day. Read the line number, fix it, and run again!</small></div>`; }
  return '';
}

/* ================= Quiz engine (used by practice, games, bosses, duels) ================= */
const XP_BY_TYPE = { quiz: 10, trace: 15, bug: 20, fill: 15, squad: 10 };
const evMult = q => (EVENT.units.includes(q.unit) ? 2 : 1);

function runQuiz(view, o) {
  const st = {
    idx: 0, score: 0, correct: 0, wrong: 0, combo: 0, maxCombo: 0, lives: o.lives ?? Infinity,
    timeLeft: o.timeLimit ?? null, start: Date.now(), qStart: Date.now(), answered: false, results: [], xp: 0, done: false,
    bossHp: o.boss ? 100 : 0,
  };
  const qs = o.questions.slice();
  const rnd = o.seed ? seeded(o.seed) : Math.random;
  const order = qs.map(q => q.kind === 'mcq' ? (o.shuffleChoices === false ? q.choices.map((_, i) => i) : shuffle(q.choices.map((_, i) => i), rnd)) : null);
  let timer = null, autoT = null;
  const finish = (reason) => {
    if (st.done) return; st.done = true;
    clearInterval(timer); clearTimeout(autoT); document.removeEventListener('keydown', onKey);
    st.reason = reason; st.elapsed = (Date.now() - st.start) / 1000;
    o.onFinish ? o.onFinish(st, view) : showResult(view, st, o);
  };
  onLeave(() => { st.done = true; clearInterval(timer); clearTimeout(autoT); document.removeEventListener('keydown', onKey); o.onAbort && o.onAbort(st); });

  if (st.timeLeft != null) {
    timer = setInterval(() => {
      st.timeLeft = Math.max(0, st.timeLeft - 0.25);
      const t = $('#q-timer', view);
      if (t) { t.textContent = Math.ceil(st.timeLeft) + 's'; t.classList.toggle('low', st.timeLeft <= 10); }
      if (st.timeLeft <= 10 && Math.abs(st.timeLeft - Math.round(st.timeLeft)) < 0.01 && st.timeLeft > 0) sfx('tick');
      if (st.timeLeft <= 0) finish('time');
    }, 250);
  }

  function header() {
    const total = o.endless ? null : qs.length;
    const pct = total ? (st.idx / total) * 100 : 0;
    return `<div class="qhead">
      <button class="btn ghost sm" id="q-quit" aria-label="Quit">✕ Quit</button>
      ${total ? `<div class="bar" aria-label="Progress"><i style="width:${pct}%"></i></div><span class="mono muted">${Math.min(st.idx + 1, total)}/${total}</span>` : `<div style="flex:1"></div><span class="mono">Score: <b>${st.score}</b></span>`}
      ${st.combo >= 3 ? `<span class="combo">×${comboMult()} combo</span>` : ''}
      ${o.lives != null ? `<span class="hearts" aria-label="${st.lives} lives">${'❤️'.repeat(Math.max(0, st.lives))}${'🖤'.repeat(Math.max(0, o.lives - st.lives))}</span>` : ''}
      ${st.timeLeft != null ? `<span class="timer" id="q-timer">${Math.ceil(st.timeLeft)}s</span>` : ''}
    </div>
    ${o.boss ? `<div class="boss" id="boss"><span class="face">${o.boss.face}</span><div class="hp"><div class="spread"><b>${esc(o.boss.name)}</b><span class="mono">${Math.ceil(st.bossHp)} HP</span></div><div class="bar"><i style="width:${st.bossHp}%"></i></div></div></div>` : ''}
    ${o.extra ? `<div id="q-extra">${o.extra(st)}</div>` : ''}`;
  }
  const quit = async () => { if (o.confirmQuit === false || !st.results.length || await confirmBox('Quit this round?', 'Your progress in this round will be lost.', 'Quit')) { st.done = true; clearInterval(timer); clearTimeout(autoT); o.onQuit && o.onQuit(st); go(o.back || '/practice'); } };
  const comboMult = () => st.combo >= 10 ? 3 : st.combo >= 5 ? 2 : st.combo >= 3 ? 1.5 : 1;

  function show() {
    if (st.done) return;
    if (st.idx >= qs.length) { if (o.endless && o.more) { qs.push(...o.more()); order.push(...qs.slice(order.length).map(q => q.kind === 'mcq' ? shuffle(q.choices.map((_, i) => i)) : null)); } else return finish('done'); }
    const q = qs[st.idx]; st.answered = false; st.qStart = Date.now();
    const typeLabel = q.type === 'trace' ? 'Trace the code' : q.type === 'bug' ? 'Find the bug' : q.type === 'fill' ? 'Fill in the code' : q.type === 'squad' ? `Squad question · by ${esc(q.authorName || 'a squadmate')}` : 'Question';
    const src = UNIT[q.unit] ? `${COURSE[q.course].short} · ${UNIT[q.unit].title}` : '';
    view.innerHTML = `<div class="wrap"><div class="qcard">${header()}
      <div class="card" id="qbox" data-qid="${esc(q.id)}">
        <div class="spread" style="margin-bottom:10px"><span class="pill accent">${typeLabel}</span>${src ? `<small class="muted">${esc(src)}</small>` : ''}</div>
        <div class="qtext">${fmt(q.q)}</div>
        ${q.kind === 'fill' ? `<div id="q-fill">${fillHtml(q, 'qb')}</div><div class="row" style="justify-content:flex-end"><button class="btn primary" id="q-check">✓ Check</button></div>` : q.kind === 'bug' ? bugHtml(q) : (q.code ? codeBlock(q.code, q.lang, false) : '') + `<div class="choices" role="group" aria-label="Answer choices">${order[st.idx].map((ci, k) => `<button class="choice" data-ci="${ci}"><span class="key">${k + 1}</span><span>${fmt(q.choices[ci])}</span></button>`).join('')}</div>`}
        <div id="q-after"></div>
      </div></div></div>`;
    $('#q-quit', view).onclick = quit;
    $$('.choice', view).forEach(b => b.onclick = () => answer(+b.dataset.ci === q.a, b, q));
    $$('.buglines button', view).forEach(b => b.onclick = () => answer(q.lines.includes(+b.dataset.ln), b, q));
    if (q.kind === 'fill') { const fb = $('#q-fill', view); $$('.blank', fb).forEach(i => i.addEventListener('keydown', ev => { if (ev.key === 'Enter') $('#q-check', view).click(); })); $('.blank', fb)?.focus(); $('#q-check', view).onclick = () => { const ok = checkFill(fb, q); if (!ok) revealFill(fb, q); $$('.blank', fb).forEach(i => i.disabled = true); $('#q-check', view).remove(); answer(ok, null, q); }; }

  function bugHtml(q) {

    return `<p class="muted" style="margin-top:-6px">Click the line with the bug.</p><ol class="buglines" aria-label="Code lines">${lines.map((l, i) => `<li><button data-ln="${i + 1}"><span class="ln">${i + 1}</span><span>${highlight(l, q.lang) || ' '}</span></button></li>`).join('')}</ol>`;
  }
  function answer(ok, btn, q) {
    if (st.answered || st.done) return; st.answered = true;
    const ms = Date.now() - st.qStart;
    $$('.choice, .buglines button', view).forEach(b => b.disabled = true);

    else { btn.classList.add(ok ? 'right' : 'wrong'); if (!ok) q.lines.forEach(n => $(`.buglines button[data-ln="${n}"]`, view)?.classList.add('right')); }
    $('#qbox', view).classList.add(ok ? 'flash-ok' : 'flash-bad');
    sfx(ok ? 'ok' : 'bad');
    if (ok) { st.correct++; st.combo++; st.maxCombo = Math.max(st.maxCombo, st.combo); } else { st.wrong++; st.combo = 0; if (o.lives != null) st.lives--; }
    if (o.record !== false) recordAnswer(q, ok);
    if (ok && o.mode === 'review') clearMistake(q.id);
    if (ok && q.kind === 'bug') S.stats.bugs++;
    st.results.push({ id: q.id, ok, ms });
    const gained = o.scoreFn ? o.scoreFn(q, ok, ms, st) : (ok ? 1 : 0);
    st.score += gained;
    if (ok) st.xp += (o.xpPer ? o.xpPer(q, ms, st) : XP_BY_TYPE[q.type] || 10) * evMult(q);
    if (o.boss && ok) { st.bossHp = Math.max(0, st.bossHp - o.boss.dmg); const b = $('#boss', view); if (b) { b.classList.add('hit'); $('.bar>i', b).style.width = st.bossHp + '%'; $('.mono', b).textContent = Math.ceil(st.bossHp) + ' HP'; } sfx('hit'); }
    if (o.timePenalty && !ok && st.timeLeft != null) st.timeLeft = Math.max(0, st.timeLeft - o.timePenalty);
    o.onAnswer && o.onAnswer(q, ok, ms, st);
    const head = $('.qhead', view); if (head) { const tmp = document.createElement('div'); tmp.innerHTML = header(); head.replaceWith(tmp.firstElementChild); $('#q-quit', view).onclick = quit; }

      <div class="qfoot"><button class="btn primary" id="q-next" autofocus>${gameOver || st.idx + 1 >= qs.length && !o.endless ? 'See results' : 'Next'} →</button></div>`;

route('/quiz', (view, p) => {
  const types = (p.types || 'quiz,trace,bug').split(',');
  let pool = [], title = 'Practice', back = '/practice';
  if (p.mode === 'review') { pool = S.mistakes.map(id => Q[id] || squadQ(id)).filter(Boolean); title = 'Mistake review'; if (!pool.length) { view.innerHTML = `<div class="wrap empty"><span class="big">🎉</span><h2>No mistakes to review</h2><p>Questions you miss will show up here so you can try them again.</p><a class="btn primary" href="#/practice">Practice something</a></div>`; return; } }
  else if (p.mode === 'squad') { pool = squadBankQs(); title = 'Squad question bank'; if (!pool.length) { view.innerHTML = `<div class="wrap empty"><span class="big">✍️</span><h2>The squad bank is empty</h2><p>Join a squad and write questions for each other in the Squad tab.</p><a class="btn primary" href="#/squad">Go to Squad</a></div>`; return; } }
  else if (p.mode === 'topic' && p.topic === 'if') {
    const core = ['py2', 'csa2'], re = /\bif\b|\belif\b|\belse\b|\bIF\b|\bELSE\b|boolean|\band\b|\bor\b|\bnot\b|&&|\|\||switch|ternary|condition|truthy|falsy|De Morgan|short-circuit/i;
    pool = allQs(['quiz', 'trace', 'bug', 'fill']).filter(q => core.includes(q.unit) || (['web3', 'csp3', 'csp1', 'py3'].includes(q.unit) && re.test(q.q + ' ' + (q.code || '') + ' ' + (q.why || ''))));
    title = 'If statements: all courses';
  }
  else if (p.daily) { const rnd = seeded(today() + S.profile.name); const cs = myCourseIds(); pool = shuffle([...allQs(types).filter(q => cs.includes(q.course)), ...EVENT.units.flatMap(u => unitQs(u)).filter(q => cs.includes(q.course))], rnd); title = 'Daily mix'; }
  else if (p.units) { pool = p.units.split(',').flatMap(u => unitQs(u, types)); title = p.mode === 'unit' ? `${UNIT[p.units]?.title || 'Unit'} · ${types.includes('quiz') ? 'Quiz' : 'Code challenges'}` : 'Practice set'; if (p.mode === 'unit') back = `/course/${UNIT[p.units]?.course}`; }
  else if (p.course) { pool = courseQs(p.course, types); title = COURSE[p.course]?.title + ' quiz'; back = `/course/${p.course}`; }
  else pool = allQs(types);
  if (S.settings.squadQs && p.mode === 'practice' && p.units) pool.push(...squadBankQs().filter(q => p.units.split(',').includes(q.unit)));
  const n = +p.n || (p.mode === 'unit' ? 999 : 10);
  if (p.mode === 'unit' && p.n) back = `/learn/${p.units}/0`;
  const qs = shuffle([...new Map(pool.map(q => [q.id, q])).values()]).slice(0, n);
  const unitMode = p.mode === 'unit' && UNIT[p.units];
  runQuiz(view, { title, questions: qs, mode: p.mode || 'practice', back, backLabel: 'Back', again: () => render(),
    onFinish: unitMode ? (st) => {
      const pct = st.results.length ? st.correct / st.results.length : 0, rec = S.units[p.units] = S.units[p.units] || {};
      const kind = types.includes('quiz') ? 'quiz' : 'code';
      if (!p.n || +p.n >= 999) { rec[kind + 'Best'] = Math.max(rec[kind + 'Best'] || 0, pct); if (pct >= 0.7 && !rec[kind + 'At']) rec[kind + 'At'] = Date.now(); save(); squadSync(); }
      showResult(view, st, { title, mode: 'unit', back, backLabel: 'Back to course', again: () => render() }, pct >= 0.7 || p.n ? '' : `<p class="muted">Score 70% or higher to count this ${kind === 'quiz' ? 'quiz' : 'challenge set'} as complete.</p>`);
    } : null });
});

const BOSSES = { py1: ['Type Error Troll', '👺'], py2: ['The Elif Hydra', '🐉'], py3: ['The Infinite Loop', '🌀'], py4: ['None the Nameless', '👻'], py5: ['Index Out-of-Range-r', '🦂'],

  csa1: ['NullPointer Knight', '🤺'], csa2: ['Off-By-One Golem', '🗿'], csa3: ['Shadow Variable', '🥷'], csa4: ['StackOverflow Titan', '🦖'],
  cy1: ['Worm Queen', '🪱'], cy2: ['Rainbow Table Wraith', '🌈'], cy3: ['Caesar\'s Ghost', '🏛️'], cy4: ['SQL Injector', '💉'],

route('/boss/:uid', (view, p) => {
  const u = UNIT[p.uid]; if (!u) return;
  const [name, face] = BOSSES[u.id] || ['Unit Guardian', '🛡️'];
  const pool = shuffle(unitQs(u.id));
  const need = Math.min(8, Math.max(4, pool.length - 3));
  const beaten = S.units[u.id]?.boss;
  view.innerHTML = `<div class="wrap narrow"><div class="card" style="text-align:center">
    <div style="font-size:5rem;line-height:1">${face}</div><span class="eyebrow">Boss battle · ${esc(COURSE[u.course].short)}</span><h1 style="font-size:2rem">${esc(name)}</h1>
    <p class="muted">Guardian of <b>${esc(u.title)}</b>. Land <b>${need}</b> correct answers to drain its HP. You have <b>3 hearts</b>, and every wrong answer costs one.</p>
    <div class="row" style="justify-content:center"><span class="pill">${pool.length} questions in the deck</span><span class="pill accent">Win: +150 XP</span>${beaten ? '<span class="pill">🏆 already beaten</span>' : ''}</div>
    <div class="row" style="justify-content:center;margin-top:20px"><button class="btn primary lg" id="fight">⚔️ Fight!</button><a class="btn lg" href="#/learn/${u.id}/0">Study first</a></div></div></div>`;
  $('#fight', view).onclick = () => runQuiz(view, {
    title: `Boss: ${name}`, questions: pool, mode: 'boss', lives: 3, boss: { name, face, dmg: 100 / need }, back: `/course/${u.course}`,
    onFinish: (st) => {
      const win = st.reason === 'win';
      if (win) {
        const first = !S.units[u.id]?.boss;
        S.units[u.id] = { ...(S.units[u.id] || {}), boss: S.units[u.id]?.boss || Date.now() };
        S.stats.bossWins++; save();
        st.xp += first ? 150 : 40;
        award('boss1');
        if (Object.values(S.units).filter(x => x.boss).length >= 5) award('boss5');
        if (COURSE[u.course].units.every(x => S.units[x.id]?.boss)) award('course-master');
      }
      showResult(view, st, { title: win ? `${name} defeated!` : `${name} wins this round`, resultBig: win ? '🏆' : '💀', resultSub: win ? `You beat the boss with ${st.lives} heart${st.lives === 1 ? '' : 's'} left.` : `You got ${st.correct} hits in. Study the unit and try again!`, back: `/course/${u.course}`, backLabel: 'Back to course', again: () => render() });
    },
  });
});

    for (const c of COURSES) for (const u of c.units) u.lessons.forEach((l, i) => {
      const hay = (l.title + ' ' + l.text).toLowerCase();
      if (terms.every(t => hay.includes(t))) { const idx = hay.indexOf(terms[0]); hits.push({ c, u, l, i, score: (l.title.toLowerCase().includes(q) ? 10 : 0) + terms.length, snip: l.text.slice(Math.max(0, idx - (l.title.length + 60)), idx - l.title.length + 140) }); }
    });
    hits.sort((a, b) => b.score - a.score);
    const mark = s => { let h = esc(s); for (const t of terms) h = h.replace(new RegExp(t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'), m => `<mark>${m}</mark>`); return h; };
    res.innerHTML = hits.length ? `<p class="muted">${hits.length} result${hits.length === 1 ? '' : 's'}</p><div class="stack">${hits.slice(0, 30).map(h => `<a class="card hover search-hit" href="#/learn/${h.u.id}/${h.i}"><small class="muted">${h.c.emoji} ${esc(h.c.title)} · ${esc(h.u.title)}</small><h3 style="margin:4px 0">${mark(h.l.title)}</h3><small>…${mark(h.snip)}…</small></a>`).join('')}</div>` : `<div class="empty"><span class="big">🔍</span>No notes match "${esc(q)}".</div>`;
  };
  inp.oninput = doSearch; doSearch(); inp.focus();
});

// the item after `key` inside the same course (lessons → exercises → fill-ins, module by module)
function neighbors(c, key) {
  const flat = c.units.flatMap(u => unitItems(u).map(it => ({ ...it, u })));
  const i = flat.findIndex(x => x.key === key);
  return { prev: flat[i - 1], next: flat[i + 1], cur: flat[i], pos: i, total: flat.length };
}
function goNextAfter(c, u, key) {

function testLabel(t, lang) {
  const m = lang === 'python' ? t.match(/,\s*(["'])(.*)\1\s*$/) : t.match(/,\s*(["'])(.*)\1\s*\)\s*\)?\s*$/);

}

function fillHtml(q, prefix = 'b') {

    if (i % 2 === 0) h += highlight(seg, q.lang);
    else { const b = +seg, w = Math.max(3, ...q.blanks[b].map(a => a.length)) + 1; h += `<input class="blank" id="${prefix}${b}" data-b="${b}" size="${w}" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Blank ${b + 1}">`; }
  });
  return `<pre class="code fill"><div class="chead"><span>${esc(LANG_LABEL[q.lang] || q.lang)}</span></div><code>${h}</code></pre>`;
}

  return all;
}

function fillView(view, q, u, c, head, prev) {

const KIND = { lesson: ['📖', 'Lesson'], ex: ['💻', 'Coding exercise'], fill: ['🧩', 'Fill in the code'], quiz: ['📝', 'Unit quiz (70%+)'], code: ['🐛', 'Code challenges (70%+)'], boss: ['👹', 'Boss battle'], unit: ['📦', 'Whole module'] };
function assignHref(a) {
  if (a.kind === 'lesson') { const [u, i] = a.ref.split(':'); return `#/learn/${u}/${i}`; }
  if (a.kind === 'ex' || a.kind === 'fill') return `#/ex/${a.ref}`;
  if (a.kind === 'quiz') return `#/quiz?mode=unit&units=${a.ref}&types=quiz`;
  if (a.kind === 'code') return `#/quiz?mode=unit&units=${a.ref}&types=trace,bug,fill`;
  if (a.kind === 'boss') return `#/boss/${a.ref}`;
  const u = UNIT[a.ref]; return u ? (unitItems(u).find(x => !itemDoneAt(x)) || unitItems(u)[0]).href : '#/';
}
function assignDoneAt(a) {
  switch (a.kind) {
    case 'lesson': return S.lessons[a.ref] || null;
    case 'ex': return S.exercises[a.ref]?.at || null;
    case 'fill': return S.fills[a.ref]?.at || null;
    case 'quiz': return S.units[a.ref]?.quizAt || null;
    case 'code': return S.units[a.ref]?.codeAt || null;
    case 'boss': return S.units[a.ref]?.boss || null;
    case 'unit': { const u = UNIT[a.ref]; return u && unitDone(u) ? Math.max(...unitItems(u).map(itemDoneAt)) : null; }
  }
  return null;
}
const assignScore = a => a.kind === 'quiz' ? S.units[a.ref]?.quizBest : a.kind === 'code' ? S.units[a.ref]?.codeBest : null;
function dueText(due, doneAt) {
  if (!due) return 'No due date';
  const d = new Date(due), now = Date.now(), days = Math.round((new Date(today(d)) - new Date(today())) / 86400000);
  const time = d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  if (doneAt) return doneAt > due ? `Turned in late (due ${d.toLocaleDateString([], { month: 'short', day: 'numeric' })})` : `Done ✓ (due ${d.toLocaleDateString([], { month: 'short', day: 'numeric' })})`;
  if (due < now) { const late = Math.max(0, -days); return late ? `Overdue by ${late} day${late === 1 ? '' : 's'}` : `Was due today at ${time}`; }
  if (days === 0) return `Due today at ${time}`;
  if (days === 1) return `Due tomorrow at ${time}`;
  if (days < 7) return `Due ${d.toLocaleDateString([], { weekday: 'long' })} at ${time}`;
  return `Due ${d.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' })}`;
}
function dueList() {
  const all = [...(S.plan || []).map(a => ({ ...a, src: 'plan' })), ...(squadState().inSquad ? (S.squadAssign || []).map(a => ({ ...a, src: 'squad' })) : [])];
  return all.filter(a => a.kind === 'unit' || a.kind === 'quiz' || a.kind === 'code' || a.kind === 'boss' ? UNIT[a.ref] : a.kind === 'lesson' ? UNIT[a.ref.split(':')[0]] : (EX[a.ref] || Q[a.ref])).map(a => {
    const doneAt = assignDoneAt(a), now = Date.now();
    return { ...a, done: !!doneAt, doneAt, late: !!(doneAt && a.due && doneAt > a.due), overdue: !doneAt && a.due && a.due < now, soon: !doneAt && a.due && a.due - now < 3 * 86400000,
      icon: KIND[a.kind]?.[0] || '📌', href: assignHref(a), dueText: dueText(a.due, doneAt), from: a.src === 'plan' ? 'My plan' : `Squad · from ${a.byName || 'leader'}`, score: assignScore(a) };
  }).sort((x, y) => (x.done - y.done) || ((x.due || 9e15) - (y.due || 9e15)));
}
const dueBadgeCount = () => { try { return dueList().filter(a => !a.done && (a.overdue || a.soon)).length; } catch (e) { return 0; } };

  const bot = BOTS[p.level] || BOTS.normal;
  const qs = shuffle(poolFor(p.course || 'mine', ['quiz', 'trace'])).slice(0, 7);
  const bs = { score: 0, idx: 0, last: '' }; let bt = null;
  const extra = st => `<div class="duel-vs"><div class="side-p">${avatarHtml(S.profile, 'sm')}<div style="min-width:0"><div class="nm">${esc(S.profile.name || 'You')}</div><div class="pts">${st.score} pts</div></div></div><span class="vs">VS</span><div class="side-p"><span class="avatar sm" style="border-color:var(--accent2)">${bot.a}</span><div style="min-width:0"><div class="nm">${bot.n}</div><div class="pts" id="bot-pts">${bs.score} pts ${bs.last}</div></div></div></div>`;
  const resolveBot = () => { clearTimeout(bt); if (bs.pending == null) return; const ok = Math.random() < bot.acc; bs.score += duelPoints(ok, bs.pending); bs.last = ok ? '✓' : '✗'; bs.pending = null; updateBot(); };

  });
});
