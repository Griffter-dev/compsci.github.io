// ---- squad.js ----
/* ================= Squad backend: Firebase (Firestore + anonymous auth) =================
   The site itself is static (GitHub Pages). Live squad features talk to a free Firebase
   project whose config lives in firebase-config.js. If that file is missing, or the school
   network blocks Firebase, everything else keeps working in solo mode.                    */
const FB_VERSION = '10.12.2';
const FB = { status: 'off', err: '', uid: null, db: null, f: null };
const SQ_ALPHA = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
const genCode = () => Array.from({ length: 6 }, () => SQ_ALPHA[Math.floor(Math.random() * SQ_ALPHA.length)]).join('');
const fmtCode = c => c ? c.slice(0, 3) + '-' + c.slice(3) : '';
const normCode = c => String(c || '').toUpperCase().replace(/[^A-Z0-9]/g, '');

function squadState() {
  const cfg = window.COMPCI_FIREBASE_CONFIG;
  return { configured: !!(cfg && cfg.apiKey && !/PASTE/i.test(cfg.apiKey)), status: FB.status, err: FB.err, inSquad: !!S.squad?.code, code: S.squad?.code, name: S.squad?.name, isLeader: !!(S.squad && FB.uid && S.squad.owner === FB.uid) };
}
const withTimeout = (p, ms, msg = 'timeout') => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error(msg)), ms))]);
let fbReady;
function fbInit() {
  if (fbReady) return fbReady;
  fbReady = (async () => {
    if (!squadState().configured) { FB.status = 'off'; return false; }
    FB.status = 'loading';
    try {
      const base = `https://www.gstatic.com/firebasejs/${FB_VERSION}/`;
      const [appM, authM, fsM] = await withTimeout(Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'), import(base + 'firebase-firestore.js')]), 12000, 'Could not download Firebase (blocked or offline)');
      const app = appM.initializeApp(window.COMPCI_FIREBASE_CONFIG);
      const auth = authM.getAuth(app);
      const user = await withTimeout(new Promise((res, rej) => {
        const un = authM.onAuthStateChanged(auth, u => { if (u) { un(); res(u); } });
        authM.signInAnonymously(auth).catch(rej);
      }), 12000, 'Could not sign in to Firebase (is Anonymous sign-in enabled?)');
      FB.uid = user.uid; FB.f = fsM; FB.db = fsM.getFirestore(app); FB.status = 'ok';
      if (S.squad?.code) { refreshSquadMeta(); writeMember(); startBankSync(); startAssignSync(); }
      return true;
    } catch (e) {
      console.warn('Firebase init failed', e); FB.status = 'error'; FB.err = e.code || e.message || String(e); return false;
    } finally { if (location.hash.startsWith('#/squad') || location.hash.startsWith('#/live')) render(); }
  })();
  return fbReady;
}
const fdoc = (...p) => FB.f.doc(FB.db, ...p);
const fcol = (...p) => FB.f.collection(FB.db, ...p);
const sqPath = () => ['squads', S.squad.code];

/* ---------- Squad membership ---------- */
async function createSquad(name) {
  await fbInit(); if (FB.status !== 'ok') throw new Error('The squad server isn\'t reachable.');
  let code;
  for (let i = 0; i < 5; i++) { code = genCode(); const s = await FB.f.getDoc(fdoc('squads', code)); if (!s.exists()) break; }
  await FB.f.setDoc(fdoc('squads', code), { name: name.slice(0, 40), owner: FB.uid, banned: [], created: FB.f.serverTimestamp() });
  await joinSquad(code);
  return code;
}
async function joinSquad(code) {
  await fbInit(); if (FB.status !== 'ok') throw new Error('The squad server isn\'t reachable.');
  code = normCode(code);
  if (code.length !== 6) throw new Error('Squad codes are 6 characters, like K7Q-2MX.');
  const snap = await FB.f.getDoc(fdoc('squads', code));
  if (!snap.exists()) throw new Error('No squad found with that code. Check for typos.');
  const d = snap.data();
  if ((d.banned || []).includes(FB.uid)) throw new Error('You were removed from this squad.');
  S.squad = { code, name: d.name, owner: d.owner, joinedAt: Date.now() }; save();
  await writeMember(true);
  award('squad'); startBankSync(); startAssignSync();
}
async function leaveSquad() {
  if (!S.squad) return;
  try { if (FB.status === 'ok') await FB.f.deleteDoc(fdoc(...sqPath(), 'members', FB.uid)); } catch (e) { }
  S.squad = null; S.squadBank = []; S.squadAssign = []; save(); stopBankSync(); stopAssignSync();
}
async function refreshSquadMeta() {
  try { const s = await FB.f.getDoc(fdoc(...sqPath())); if (s.exists()) { const d = s.data(); S.squad.name = d.name; S.squad.owner = d.owner; if ((d.banned || []).includes(FB.uid)) { toast('You were removed from the squad'); S.squad = null; } save(); } } catch (e) { }
}
function memberData() {
  return { name: S.profile.name || 'Student', avatar: S.profile.avatar, color: S.profile.color, title: myTitle(), year: S.profile.year,
    xp: S.xp, level: levelFor(S.xp), streak: streakAlive(), week: isoWeek().id, weekXp: thisIsoWeekXP(), badges: Object.keys(S.badges).length,
    bosses: Object.values(S.units).filter(u => u.boss).length, lessons: Object.keys(S.lessons).length, lastActive: Date.now(),
    assign: Object.fromEntries((S.squadAssign || []).map(a => [a.id, assignDoneAt(a)]).filter(([, at]) => at).map(([id, at]) => { const a = S.squadAssign.find(x => x.id === id); const s = assignScore(a); return [id, s != null ? { at, s } : { at }]; })) };
}
async function writeMember(isNew) {
  if (FB.status !== 'ok' || !S.squad?.code) return;
  try { await FB.f.setDoc(fdoc(...sqPath(), 'members', FB.uid), { ...memberData(), ...(isNew ? { joined: Date.now() } : {}) }, { merge: true }); } catch (e) { console.warn('member sync failed', e); }
}
let syncT;
function squadSync() { if (FB.status !== 'ok' || !S.squad?.code) return; clearTimeout(syncT); syncT = setTimeout(writeMember, 1200); }

function subMembers(cb) { return FB.f.onSnapshot(fcol(...sqPath(), 'members'), s => cb(s.docs.map(d => ({ id: d.id, ...d.data() }))), e => cb(null, e)); }
async function homeLeaderboard(el) {
  await fbInit();
  if (FB.status !== 'ok') { el.innerHTML = `<p class="muted">Squad server not reachable right now.</p>`; return; }
  try {
    const s = await FB.f.getDocs(fcol(...sqPath(), 'members'));
    const w = isoWeek().id;
    const list = s.docs.map(d => ({ id: d.id, ...d.data() })).map(m => ({ ...m, wk: m.week === w ? m.weekXp : 0 })).sort((a, b) => b.wk - a.wk).slice(0, 3);
    el.innerHTML = `<ul class="lb" style="margin:8px 0 14px">${list.map((m, i) => `<li class="${m.id === FB.uid ? 'me' : ''}"><span class="rank">${['🥇', '🥈', '🥉'][i]}</span>${avatarHtml(m, 'sm')}<span class="who"><b>${esc(m.name)}</b></span><span class="val">${fmtNum(m.wk)} XP</span></li>`).join('')}</ul><small class="muted">This week's XP</small><br>`;
  } catch (e) { el.innerHTML = `<p class="muted">Couldn't load the leaderboard.</p>`; }
}
async function kickMember(uid) {
  await FB.f.updateDoc(fdoc(...sqPath()), { banned: FB.f.arrayUnion(uid) });
  await FB.f.deleteDoc(fdoc(...sqPath(), 'members', uid));
}
async function transferLeader(uid) { await FB.f.updateDoc(fdoc(...sqPath()), { owner: uid }); S.squad.owner = uid; save(); }
async function renameSquad(name) { await FB.f.updateDoc(fdoc(...sqPath()), { name: name.slice(0, 40) }); S.squad.name = name; save(); }

/* ---------- Shared question bank ---------- */
let bankUnsub = null;
const normSquadQ = (id, d) => ({ id: 'sq-' + id, docId: id, kind: 'mcq', type: 'squad', q: d.q, code: d.code || '', lang: d.lang || 'text', choices: d.choices, a: d.a, why: d.why || 'Written by your squad.', unit: d.unit, course: d.course, authorName: d.authorName, author: d.author, status: d.status, reports: d.reports || [] });
function startBankSync() {
  if (bankUnsub || FB.status !== 'ok' || !S.squad?.code) return;
  bankUnsub = FB.f.onSnapshot(fcol(...sqPath(), 'questions'), s => {
    const all = s.docs.map(d => normSquadQ(d.id, d.data()));
    S.squadBank = all.filter(q => q.status === 'approved' && q.reports.length < 3).map(({ reports, status, ...q }) => q);
    for (const q of all) if (q.author === FB.uid && q.status === 'approved' && !S.seenApproved[q.docId]) { S.seenApproved[q.docId] = 1; award('contrib'); }
    save();
    bankListeners.forEach(f => f(all));
  }, e => console.warn('bank sync', e));
}
function stopBankSync() { bankUnsub && bankUnsub(); bankUnsub = null; }
const bankListeners = new Set();
const squadBankQs = () => (S.squadBank || []).filter(q => Array.isArray(q.choices) && q.choices.length >= 2);
const squadQ = id => squadBankQs().find(q => q.id === id);
async function addSquadQuestion(d) {
  const lead = squadState().isLeader;
  await FB.f.addDoc(fcol(...sqPath(), 'questions'), { ...d, author: FB.uid, authorName: S.profile.name || 'Student', status: lead ? 'approved' : 'pending', reports: [], created: FB.f.serverTimestamp() });
}
const approveQ = id => FB.f.updateDoc(fdoc(...sqPath(), 'questions', id), { status: 'approved' });
const deleteQ = id => FB.f.deleteDoc(fdoc(...sqPath(), 'questions', id));
const reportQ = id => FB.f.updateDoc(fdoc(...sqPath(), 'questions', id), { reports: FB.f.arrayUnion(FB.uid) });

/* ---------- Weekly challenge scores ---------- */
async function submitWeekly(score, correct) {
  await fbInit(); if (FB.status !== 'ok' || !S.squad?.code) return;
  try { await FB.f.setDoc(fdoc(...sqPath(), 'weekly', `${EVENT.week}_${FB.uid}`), { uid: FB.uid, name: S.profile.name || 'Student', avatar: S.profile.avatar, color: S.profile.color, week: EVENT.week, score, correct, at: Date.now() }); } catch (e) { console.warn(e); }
}
function subWeekly(cb) { return FB.f.onSnapshot(FB.f.query(fcol(...sqPath(), 'weekly'), FB.f.where('week', '==', EVENT.week)), s => cb(s.docs.map(d => d.data())), e => cb(null, e)); }

/* ---------- Live duels ---------- */
async function createLiveDuel(cid) {
  try {
    await fbInit(); if (FB.status !== 'ok') throw new Error('Squad server not reachable');
    const qids = shuffle(poolFor(cid, ['quiz', 'trace'])).slice(0, 7).map(q => q.id);
    const ref = await FB.f.addDoc(fcol(...sqPath(), 'duels'), { host: FB.uid, hostName: S.profile.name || 'Student', hostAvatar: S.profile.avatar, hostColor: S.profile.color, guest: null, guestName: '', guestAvatar: '', guestColor: '', course: cid, qids, seed: genCode(), status: 'open', hs: 0, gs: 0, hi: 0, gi: 0, created: Date.now() });
    go('/live/' + ref.id);
  } catch (e) { toast('Could not create duel', e.message); }
}
function subDuels(cb) { return FB.f.onSnapshot(FB.f.query(fcol(...sqPath(), 'duels'), FB.f.orderBy('created', 'desc'), FB.f.limit(25)), s => cb(s.docs.map(d => ({ id: d.id, ...d.data() }))), e => cb(null, e)); }
function subDuel(id, cb) { return FB.f.onSnapshot(fdoc(...sqPath(), 'duels', id), s => cb(s.exists() ? { id: s.id, ...s.data() } : null), e => cb(null, e)); }
async function joinDuel(id) {
  const ref = fdoc(...sqPath(), 'duels', id);
  await FB.f.runTransaction(FB.db, async tx => {
    const s = await tx.get(ref); if (!s.exists()) throw new Error('Duel not found');
    const d = s.data(); if (d.guest && d.guest !== FB.uid) throw new Error('Someone already joined this duel');
    if (d.host === FB.uid) throw new Error("You can't duel yourself!");
    tx.update(ref, { guest: FB.uid, guestName: S.profile.name || 'Student', guestAvatar: S.profile.avatar, guestColor: S.profile.color, status: 'live', started: Date.now() });
  });
}
const duelAnswer = (id, isHost, pts) => FB.f.updateDoc(fdoc(...sqPath(), 'duels', id), isHost ? { hs: FB.f.increment(pts), hi: FB.f.increment(1) } : { gs: FB.f.increment(pts), gi: FB.f.increment(1) });
const duelSet = (id, data) => FB.f.updateDoc(fdoc(...sqPath(), 'duels', id), data);
const duelDelete = id => FB.f.deleteDoc(fdoc(...sqPath(), 'duels', id));

function tabBoard(body, p) {
  let metric = p.m || 'week';

  const un = subMembers((list, err) => {
    if (!list) { body.innerHTML = `<div class="notice warn">Couldn't load members: ${esc(err?.message || '')}</div>`; return; }

    const val = m => metric === 'week' ? m.wk : metric === 'all' ? m.xp || 0 : metric === 'streak' ? m.streak || 0 : m.bosses || 0;

    body.innerHTML = `<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px;align-items:start">
      <div class="card"><div class="tabs" style="margin-bottom:12px">${[['week', 'This week'], ['all', 'All-time XP'], ['streak', 'Streaks'], ['bosses', 'Bosses']].map(([k, l]) => `<button class="${metric === k ? 'on' : ''}" data-m="${k}">${l}</button>`).join('')}</div>
        <ol class="lb">${list.map((m, i) => `<li class="${m.id === FB.uid ? 'me' : ''}"><span class="rank">${i < 3 ? ['🥇', '🥈', '🥉'][i] : i + 1}</span>${avatarHtml(m)}<span class="who"><b>${esc(m.name)}${m.id === S.squad.owner ? ' 👑' : ''}</b><small class="muted">L${m.level || 1} · ${esc(m.title || '')} · ${timeAgo(m.lastActive)}</small></span><span class="val">${fmtNum(val(m))} ${unit}</span></li>`).join('') || '<li>No members yet</li>'}</ol></div>

        <div class="card"><h3>Your stats</h3><div class="stats" style="gap:24px"><div class="stat"><b>${fmtNum(thisIsoWeekXP())}</b><span>XP this week</span></div><div class="stat"><b>${streakAlive()}🔥</b><span>streak</span></div><div class="stat"><b>L${levelFor(S.xp)}</b><span>level</span></div></div></div></div></div>`;

route('/live/:id', (view, p) => {
  const ss = squadState();
  if (!ss.inSquad) { go('/squad'); return; }
  if (FB.status !== 'ok') { view.innerHTML = `<div class="wrap narrow"><p class="muted">Connecting…</p></div>`; fbInit().then(ok => ok ? render() : go('/squad')); return; }
  let d = null, playing = false, finished = false, recorded = false, myScore = 0;
  const isHost = () => d && d.host === FB.uid, isGuest = () => d && d.guest === FB.uid;
  const opp = () => isHost() ? { name: d.guestName || '…', avatar: d.guestAvatar || '❔', color: d.guestColor, score: d.gs, idx: d.gi } : { name: d.hostName, avatar: d.hostAvatar, color: d.hostColor, score: d.hs, idx: d.hi };
  const vsBar = () => { const o = opp(); return `<div class="duel-vs"><div class="side-p">${avatarHtml(S.profile, 'sm')}<div style="min-width:0"><div class="nm">${esc(S.profile.name || 'You')}</div><div class="pts">${isHost() ? d.hs : d.gs} pts</div></div></div><span class="vs">VS</span><div class="side-p">${avatarHtml(o, 'sm')}<div style="min-width:0"><div class="nm">${esc(o.name)}</div><div class="pts">${o.score} pts · Q${Math.min(o.idx + 1, d.qids.length)}/${d.qids.length}</div></div></div></div>`; };
  const un = subDuel(p.id, async (doc, err) => {
    if (err) { view.innerHTML = `<div class="wrap narrow"><div class="notice warn">${esc(err.message)}</div></div>`; return; }
    if (!doc) { if (!finished) view.innerHTML = `<div class="wrap narrow empty"><span class="big">💨</span><h2>This duel was cancelled</h2><a class="btn primary" href="#/squad?tab=duels">Back to duels</a></div>`; return; }
    d = doc;
    if (playing) { const x = $('#q-extra', view); if (x) x.innerHTML = vsBar(); return; }
    if (finished) return showEnd();
    if (d.status === 'open') {
      if (isHost()) {
        view.innerHTML = `<div class="wrap narrow"><div class="card" style="text-align:center"><div style="font-size:4rem">⏳</div><h2>Waiting for an opponent…</h2><p class="muted">Squadmates can join from <b>Squad → Duels</b>. Tell them in your group chat!</p><button class="btn danger" id="cancel">Cancel duel</button></div></div>`;
        $('#cancel', view).onclick = () => { duelDelete(d.id); go('/squad?tab=duels'); };
      } else {
        view.innerHTML = `<div class="wrap narrow"><div class="card" style="text-align:center">${avatarHtml({ avatar: d.hostAvatar, color: d.hostColor }, 'lg')}<h2 style="margin-top:12px">${esc(d.hostName)} challenges you!</h2><p class="muted">7 questions · ${esc(COURSE[d.course]?.title || 'Mixed topics')}</p><button class="btn primary lg" id="join">⚔️ Accept duel</button></div></div>`;
        $('#join', view).onclick = () => joinDuel(d.id).catch(e => toast('Could not join', e.message));
        if (p.join) { p.join = 0; joinDuel(d.id).catch(e => toast('Could not join', e.message)); }
      }
      return;
    }
    if ((d.status === 'live') && (isHost() || isGuest())) {
      const myIdx = isHost() ? d.hi : d.gi;
      if (myIdx >= d.qids.length) { finished = true; return showEnd(); }
      playing = true; startPlay(myIdx); return;
    }
    // spectator or finished
    finished = true; showEnd();
  });
  onLeave(un);
  function startPlay(fromIdx) {
    if (fromIdx === 0) { sfx('level'); toast('⚔️ Duel started!', `vs ${opp().name}`); }
    const qs = d.qids.map(id => Q[id]).filter(Boolean).slice(fromIdx);
    runQuiz(view, {
      title: 'Live duel', questions: qs, mode: 'duel', seed: d.seed, back: '/squad?tab=duels', extra: () => vsBar(), explain: true,
      scoreFn: (q, ok, ms) => duelPoints(ok, ms), xpPer: () => 10,
      onAnswer: (q, ok, ms) => { const pts = duelPoints(ok, ms); myScore += pts; duelAnswer(d.id, isHost(), pts).catch(e => toast('Sync error', e.message)); },
      onQuit: () => { },
      onFinish: (st) => { playing = false; finished = true; if (st.xp) addXP(st.xp, 'Live duel'); showEnd(); },
    });
  }
  function showEnd() {
    const N = d.qids.length, both = d.hi >= N && d.gi >= N, me = isHost() || isGuest();
    if (both && d.status !== 'done' && me) duelSet(d.id, { status: 'done' }).catch(() => { });
    const myS = isHost() ? d.hs : d.gs, oS = opp().score;
    if (both && me && !recorded) {
      recorded = true; S.stats.duelsPlayed++;
      if (myS > oS) { S.stats.duelsWon++; addXP(50, 'Won a live duel'); award('duel-win'); confetti(150); sfx('win'); }
      save();
    }
    if (!me) {
      view.innerHTML = `<div class="wrap narrow"><span class="eyebrow">Spectating</span><h2>${esc(d.hostName)} vs ${esc(d.guestName || '…')}</h2><div class="duel-vs"><div class="side-p">${avatarHtml({ avatar: d.hostAvatar, color: d.hostColor }, 'sm')}<div><div class="nm">${esc(d.hostName)}</div><div class="pts">${d.hs} pts · Q${Math.min(d.hi + 1, N)}</div></div></div><span class="vs">VS</span><div class="side-p">${avatarHtml({ avatar: d.guestAvatar, color: d.guestColor }, 'sm')}<div><div class="nm">${esc(d.guestName)}</div><div class="pts">${d.gs} pts · Q${Math.min(d.gi + 1, N)}</div></div></div></div><p class="muted" style="text-align:center">${both ? 'Final!' : 'Live, updating in real time…'}</p><a class="btn" href="#/squad?tab=duels">Back to duels</a></div>`;
      return;
    }
    view.innerHTML = `<div class="wrap narrow"><div class="result card"><span class="eyebrow">Live duel</span>${vsBar()}
      ${both ? `<div class="score">${myS > oS ? '🏆' : myS === oS ? '🤝' : '😤'}</div><p class="muted">${myS > oS ? 'You win! +50 XP' : myS === oS ? "It's a tie!" : `${esc(opp().name)} wins. Rematch?`}</p>` : `<div class="score" style="font-size:3rem">⏳</div><p class="muted">You finished! Waiting for ${esc(opp().name)}… (${Math.min(opp().idx, N)}/${N})</p>`}
      <div class="row" style="justify-content:center"><a class="btn primary" href="#/squad?tab=duels">Back to duels</a><button class="btn" id="rematch">⚔️ New duel</button></div></div></div>`;
    $('#rematch', view).onclick = () => createLiveDuel(d.course);
  }
});

      <label class="field"><span>Pick a username</span><input class="input" id="o-name" maxlength="20" value="${esc(d.name)}" placeholder="e.g. ByteSized" autofocus></label><p class="muted"><small>🔒 Use a nickname, not your full real name. Your squad sees this name.</small></p>`,
    () => `<h2>Choose your look</h2><div class="row" style="margin-bottom:12px"><span id="o-av">${avatarHtml(d, 'lg')}</span></div><div class="emoji-grid">${AVATARS.map(a => `<button type="button" data-a="${a}" class="${a === d.avatar ? 'on' : ''}">${a}</button>`).join('')}</div><div class="swatches" style="margin-top:12px">${COLORS.map(c => `<button type="button" data-c="${c}" class="${c === d.color ? 'on' : ''}" style="background:${c}" aria-label="${c}"></button>`).join('')}</div>`,
    () => `<h2>What grade are you in?</h2><div class="grid g2" style="margin-top:14px">${GRADES.map(([y, l]) => `<button class="btn lg ${d.year === y ? 'primary' : ''}" style="width:100%" data-y="${y}" aria-pressed="${d.year === y}">${l}</button>`).join('')}</div>`,
    () => `<h2>Which CS courses are you taking?</h2><p class="muted">Pick all that apply. They'll show up first on your home page and in games. You can still open any course, and change this later in your profile.</p>${courseChooser(d.courses)}`,
    () => `<h2>Pick a theme</h2><p class="muted">You can fully customize colors and fonts later in Settings.</p><div class="theme-grid">${Object.entries(THEMES).map(([k, th]) => `<button class="theme-opt ${d.theme === k ? 'on' : ''}" data-t="${k}"><span class="pv" style="background:${th.bg}"><i style="width:40%;background:${th.accent}"></i><i style="width:25%;background:${th.accent2}"></i></span><span class="nm">${esc(th.name)}</span></button>`).join('')}</div>`,
    () => `<div style="text-align:center"><div style="font-size:3.4rem">👥</div><h2>Study with friends?</h2><p class="muted">Squads have a live leaderboard, duels and a shared question bank. Set one up now or later from the Squad tab.</p></div>`,
  ];
  const draw = () => {
    const m = modal(`<div class="steps">${steps.map((_, i) => `<i class="${i <= step ? 'on' : ''}"></i>`).join('')}</div>${steps[step]()}
      <div class="row" style="justify-content:space-between;margin-top:20px">${step ? '<button class="btn ghost" id="o-back">← Back</button>' : '<span></span>'}
      ${step < steps.length - 1 ? '<button class="btn primary" id="o-next">Next →</button>' : '<div class="row"><button class="btn" id="o-solo">Study solo for now</button><button class="btn primary" id="o-squad">Set up a squad</button></div>'}</div>`, { dismiss: false, wide: step === 1 || step === 3 || step === 4 });
    const upd = () => { const av = $('#o-av', m); if (av) av.innerHTML = avatarHtml(d, 'lg'); };
    $$('[data-a]', m).forEach(b => b.onclick = () => { d.avatar = b.dataset.a; $$('[data-a]', m).forEach(x => x.classList.toggle('on', x === b)); upd(); });
    $$('[data-c]', m).forEach(b => b.onclick = () => { d.color = b.dataset.c; $$('[data-c]', m).forEach(x => x.classList.toggle('on', x === b)); upd(); });
    $$('[data-y]', m).forEach(b => b.onclick = () => { d.year = +b.dataset.y; draw(); });
    wireCourseChooser(m, d.courses);
    $$('[data-t]', m).forEach(b => b.onclick = () => { d.theme = b.dataset.t; S.settings.theme = d.theme; S.settings.bg = S.settings.fg = S.settings.accent = ''; applyTheme(); draw(); });
    const nameOk = () => { if (steps[step] === steps[3] && !d.courses.length) { toast('Pick at least one course', 'You can change it later.'); return false; } if (step !== 0) return true; d.name = $('#o-name', m).value.trim().slice(0, 20); if (!d.name) { toast('Pick a username first'); return false; } return true; };
    $('#o-back', m)?.addEventListener('click', () => { step--; draw(); });
    $('#o-next', m)?.addEventListener('click', () => { if (!nameOk()) return; step++; draw(); });
    $('#o-name', m)?.addEventListener('keydown', e => { if (e.key === 'Enter') $('#o-next', m).click(); });
    const finish = (to) => { Object.assign(S.profile, { name: d.name, avatar: d.avatar, color: d.color, year: d.year, courses: d.courses.slice(), onboarded: true }); save(); modalClose = null; $('#modal-root').innerHTML = ''; toast(`Welcome, ${d.name}! 🎉`, 'Your first lesson is waiting.'); confetti(100); go(to); render(); };
    $('#o-solo', m)?.addEventListener('click', () => finish('/'));
    $('#o-squad', m)?.addEventListener('click', () => finish('/squad'));
  };
  draw();
}

/* ---------- Course picker (onboarding + profile) ---------- */
function courseChooser(sel) {
  return `<div class="grid g2" style="gap:10px;margin-top:10px" role="group" aria-label="Courses">${COURSES.map(c => `<button type="button" class="card course-pick" data-course="${c.id}" aria-pressed="${sel.includes(c.id)}" style="text-align:left;cursor:pointer;padding:14px;display:flex;gap:12px;align-items:center;border-color:${sel.includes(c.id) ? 'var(--accent)' : 'var(--border)'};box-shadow:none">
    <span style="font-size:1.7rem">${c.emoji}</span><span style="flex:1;min-width:0"><b style="display:block">${esc(c.title)}</b><small class="muted">${esc(c.short)}</small></span><span class="chk ${sel.includes(c.id) ? 'done' : ''}" style="width:22px;height:22px">${sel.includes(c.id) ? '✓' : ''}</span></button>`).join('')}</div>`;
}
function wireCourseChooser(root, sel) {
  $$('[data-course]', root).forEach(b => b.onclick = () => {
    const id = b.dataset.course, i = sel.indexOf(id);
    i >= 0 ? sel.splice(i, 1) : sel.push(id);
    const on = sel.includes(id);
    b.setAttribute('aria-pressed', on); b.style.borderColor = on ? 'var(--accent)' : 'var(--border)';
    const k = $('.chk', b); k.classList.toggle('done', on); k.textContent = on ? '✓' : '';
  });
}

// ---- main.js ----
/* ================= Boot ================= */
applyTheme();
render();
if (!S.profile.onboarded) setTimeout(onboarding, 300);
if (squadState().configured) fbInit();
// register service worker for offline use / install (only works when hosted, e.g. GitHub Pages)
if ('serviceWorker' in navigator && location.protocol === 'https:' && !/claude|claudeusercontent/.test(location.hostname)) {
  navigator.serviceWorker.register('sw.js').catch(() => { });
}
// keep streak display fresh if the tab stays open past midnight
setInterval(renderChrome, 60 * 1000);
window.addEventListener('storage', e => { if (e.key === STORE_KEY) { load(); applyTheme(); render(); } });

</script>
