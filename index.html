<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CompciStudy · CS, all four years</title>
<meta name="description" content="CompciStudy: a free study app for high school computer science. Covers Intro Python, Web Dev, AP CSP, AP CSA, Cybersecurity and Data Structures, with quizzes, code challenges, games and squads.">
<meta name="theme-color" content="#050407">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23050407'/%3E%3Ctext x='32' y='42' font-family='monospace' font-size='28' font-weight='700' text-anchor='middle' fill='%2339ff88'%3E%3E_%3C/text%3E%3C/svg%3E">
<style>
/* ===== Theme variables (set by JS) ===== */
:root{
  --bg:#050407; --bg2:#0e0d14; --bg3:#17151f; --fg:#ecebf3; --muted:#9a97ab;
  --accent:#39ff88; --accent2:#22d3ee; --ok:#39ff88; --bad:#ff5c7a; --warn:#ffcc4d;
  --border:#26232f; --radius:12px; --font:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SFMono-Regular","Cascadia Code","Consolas","Menlo",monospace;
  --head:var(--mono); --size:16px; --on-accent:#04140b; --code-bg:#0a0910;
  --shadow:0 1px 0 rgba(255,255,255,.03), 0 8px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html{font-size:var(--size);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);line-height:1.6;min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
a{color:var(--accent2)}
button,input,select,textarea{font:inherit;color:inherit}
img,svg,canvas{max-width:100%}
:focus-visible{outline:2px solid var(--accent2);outline-offset:2px;border-radius:4px}
.skip{position:absolute;left:-999px;top:8px;background:var(--accent);color:var(--on-accent);padding:8px 14px;border-radius:8px;z-index:100}
.skip:focus{left:8px}
h1,h2,h3,h4{font-family:var(--head);line-height:1.2;margin:0 0 .5em;letter-spacing:-.01em}
h1{font-size:clamp(2rem,6vw,3.4rem)}
h2{font-size:clamp(1.4rem,3.4vw,2rem)}
h3{font-size:1.15rem}
p{margin:0 0 1em}
code,kbd,pre,.mono{font-family:var(--mono)}
small,.muted{color:var(--muted)}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ===== Top bar (CyberAcad-style) ===== */
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:20px;padding:12px clamp(14px,4vw,40px);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-weight:800;font-size:1.1rem;color:var(--fg);text-decoration:none;white-space:nowrap}
.logo .mark{display:grid;place-items:center;width:32px;height:32px;border-radius:9px;background:var(--accent);color:var(--on-accent);font-size:.9rem}
.logo b{color:var(--accent)}
.navlinks{display:flex;gap:4px;flex:1}
.navlinks a{color:var(--muted);text-decoration:none;padding:7px 12px;border-radius:8px;font-weight:600;font-size:.95rem}
.navlinks a:hover{color:var(--fg);background:var(--bg3)}
.navlinks a.on{color:var(--fg);background:var(--bg3)}
.navlinks a .tag{font-size:.65rem;background:var(--accent);color:var(--on-accent);padding:1px 6px;border-radius:99px;margin-left:5px;vertical-align:2px}
.topright{display:flex;align-items:center;gap:10px;margin-left:auto}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:99px;background:var(--bg3);border:1px solid var(--border);font-family:var(--mono);font-size:.85rem;white-space:nowrap}
.avatar{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:50%;font-size:1.2rem;flex:none;border:2px solid var(--border);line-height:1}
.avatar.lg{width:84px;height:84px;font-size:2.6rem;border-width:3px}
.avatar.sm{width:28px;height:28px;font-size:.95rem}
.iconbtn{background:none;border:0;padding:0;cursor:pointer;border-radius:50%}
.menu{position:absolute;right:clamp(14px,4vw,40px);top:58px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);min-width:210px;padding:6px;z-index:40}
.menu a,.menu button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:9px 12px;border-radius:8px;color:var(--fg);text-decoration:none;background:none;border:0;cursor:pointer}
.menu a:hover,.menu button:hover{background:var(--bg3)}
.menu hr{border:0;border-top:1px solid var(--border);margin:6px 0}

.tabbar{display:none}
@media (max-width:820px){
  .navlinks{display:none}
  .topright .chip.xp{display:none}
  .tabbar{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--bg2);border-top:1px solid var(--border);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);text-decoration:none;font-size:.7rem;font-weight:600;padding:4px 0;border-radius:10px}
  .tabbar a .i{font-size:1.25rem;line-height:1}
  .tabbar a.on{color:var(--accent)}
  body{padding-bottom:76px}
  .menu{top:56px}
  #toasts{top:auto;bottom:84px;right:12px;left:12px;align-items:center}
  .toast{max-width:100%;width:100%}
}

/* ===== Layout ===== */
main{outline:none}
.wrap{max-width:1180px;margin:0 auto;padding:clamp(18px,4vw,40px)}
.wrap.narrow{max-width:820px}
.section{margin:56px 0}
.section-head{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.eyebrow{font-family:var(--mono);color:var(--accent);font-size:.85rem;letter-spacing:.04em;margin-bottom:8px;display:block}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr))}
.g4{grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr))}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.stack>*+*{margin-top:12px}

/* ===== Cards & buttons ===== */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.card.hover{transition:transform .15s,border-color .15s}
.card.hover:hover{border-color:color-mix(in srgb,var(--accent) 50%,var(--border));transform:translateY(-2px)}
.card h3{margin-bottom:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:calc(var(--radius) - 2px);border:1px solid var(--border);background:var(--bg3);color:var(--fg);font-weight:700;cursor:pointer;text-decoration:none;font-size:.95rem;transition:transform .08s,filter .15s;min-height:42px}
.btn:hover{filter:brightness(1.15)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:transparent}
.btn.ghost{background:transparent}
.btn.danger{background:color-mix(in srgb,var(--bad) 18%,var(--bg2));border-color:color-mix(in srgb,var(--bad) 50%,var(--border));color:var(--fg)}
.btn.sm{padding:6px 12px;min-height:34px;font-size:.85rem}
.btn.lg{padding:14px 26px;font-size:1.05rem}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;padding:3px 10px;border-radius:99px;background:var(--bg3);border:1px solid var(--border);color:var(--muted);font-family:var(--mono)}
.pill.accent{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,var(--border))}
.bar{height:8px;background:var(--bg3);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px;transition:width .4s}
.input,select.input,textarea.input{width:100%;padding:10px 12px;border-radius:calc(var(--radius) - 4px);border:1px solid var(--border);background:var(--bg);color:var(--fg)}
textarea.input{min-height:80px;font-family:var(--mono);font-size:.9rem}
label.field{display:block;margin-bottom:14px}
label.field>span{display:block;font-weight:600;margin-bottom:6px;font-size:.92rem}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.tabs button{background:var(--bg2);border:1px solid var(--border);padding:8px 14px;border-radius:99px;cursor:pointer;font-weight:600;color:var(--muted)}
.tabs button.on{background:var(--accent);color:var(--on-accent);border-color:transparent}
.notice{padding:14px 16px;border-radius:var(--radius);border:1px solid var(--border);background:var(--bg2)}
.notice.warn{border-color:color-mix(in srgb,var(--warn) 50%,var(--border))}
.notice.ok{border-color:color-mix(in srgb,var(--ok) 50%,var(--border))}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty .big{font-size:2.6rem;display:block;margin-bottom:8px}

/* ===== Hero ===== */
.hero{padding:clamp(40px,8vw,90px) 0 20px}
.hero h1 .hl{color:var(--accent)}
.hero p.lead{font-size:1.15rem;color:var(--muted);max-width:620px}
.hero .cta{display:flex;gap:12px;flex-wrap:wrap;margin:26px 0 34px}
.stats{display:flex;gap:clamp(18px,5vw,50px);flex-wrap:wrap}
.stat b{display:block;font-family:var(--mono);font-size:1.8rem;color:var(--fg);line-height:1.1}
.stat span{color:var(--muted);font-size:.85rem}
.term{background:var(--code-bg);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;font-family:var(--mono);font-size:.9rem;box-shadow:var(--shadow)}
.term .tbar{display:flex;align-items:center;gap:6px;padding:9px 12px;border-bottom:1px solid var(--border);color:var(--muted);font-size:.78rem}
.term .tbar i{width:10px;height:10px;border-radius:50%;background:#ff5f57;display:inline-block}
.term .tbar i:nth-child(2){background:#febc2e}.term .tbar i:nth-child(3){background:#28c840}
.term .tbar span{margin-left:8px}
.term .tbody{padding:14px 16px;white-space:pre-wrap}
.prompt{color:var(--accent)}
.cursor{display:inline-block;width:.6em;height:1.1em;background:var(--accent);vertical-align:-2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* ===== Course cards ===== */
.course-card{display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden}
.course-card::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--cc,var(--accent))}
.course-card .emoji{font-size:1.8rem;line-height:1}
.course-card .meta{display:flex;gap:8px;flex-wrap:wrap}
.course-card ol{margin:4px 0 0;padding-left:1.3em;color:var(--muted);font-size:.9rem}
.course-card ol li{margin:2px 0}
.course-card .foot{margin-top:auto;display:flex;gap:10px;align-items:center;justify-content:space-between;padding-top:8px}
.year-label{font-family:var(--mono);color:var(--muted);font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;margin:26px 0 10px}

/* ===== Lesson viewer ===== */
.viewer{display:grid;grid-template-columns:300px 1fr;min-height:calc(100vh - 62px)}
.side{border-right:1px solid var(--border);background:var(--bg2);padding:16px 12px;overflow:auto;position:sticky;top:62px;height:calc(100vh - 62px)}
.side h4{font-size:.95rem;margin:4px 8px 12px}
.unit-group{margin-bottom:6px}
.unit-group>button{display:flex;width:100%;align-items:center;justify-content:space-between;gap:8px;padding:9px 10px;border-radius:8px;background:none;border:0;cursor:pointer;font-weight:700;text-align:left;color:var(--fg)}
.unit-group>button:hover{background:var(--bg3)}
.unit-group>button .cnt{font-family:var(--mono);font-size:.75rem;color:var(--muted);font-weight:500;white-space:nowrap}
.unit-group ul{list-style:none;margin:0 0 6px;padding:0 0 0 6px}
.unit-group li a{display:flex;gap:9px;align-items:center;padding:6px 10px;border-radius:7px;color:var(--muted);text-decoration:none;font-size:.9rem}
.unit-group li a:hover{background:var(--bg3);color:var(--fg)}
.unit-group li a.on{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--fg)}
.chk{width:16px;height:16px;border-radius:50%;border:2px solid var(--border);flex:none;display:grid;place-items:center;font-size:.6rem}
.chk.done{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.lesson{padding:clamp(18px,4vw,44px);max-width:860px;width:100%}
.crumb{font-family:var(--mono);font-size:.8rem;color:var(--muted);margin-bottom:14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.crumb a{color:var(--muted)}
.prose{font-size:1.02rem}
.prose h3{margin-top:1.6em;color:var(--accent)}
.prose table{border-collapse:collapse;width:100%;margin:1em 0;font-size:.92rem;display:block;overflow-x:auto}
.prose th,.prose td{border:1px solid var(--border);padding:7px 10px;text-align:left}
.prose th{background:var(--bg3)}
.prose blockquote{margin:1.2em 0;padding:12px 16px;border-left:3px solid var(--accent2);background:var(--bg2);border-radius:0 var(--radius) var(--radius) 0}
.prose blockquote p:last-child{margin:0}
.prose :not(pre)>code{background:var(--bg3);padding:1px 6px;border-radius:5px;font-size:.9em;color:var(--accent2)}
.prose ul,.prose ol{padding-left:1.4em}
.prose li{margin:.3em 0}
.lesson-nav{display:flex;justify-content:space-between;gap:12px;margin-top:40px;padding-top:20px;border-top:1px solid var(--border);flex-wrap:wrap}
.side-toggle{display:none}
@media (max-width:900px){
  .viewer{grid-template-columns:1fr}
  .side{position:fixed;inset:62px 0 0 0;height:auto;z-index:25;display:none}
  .side.open{display:block}
  .side-toggle{display:inline-flex}
}

/* ===== Code blocks ===== */
pre.code{position:relative;margin:1em 0;background:var(--code-bg);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
pre.code .chead{display:flex;justify-content:space-between;align-items:center;padding:6px 12px;border-bottom:1px solid var(--border);font-size:.72rem;color:var(--muted);font-family:var(--mono);text-transform:lowercase}
pre.code .chead button{background:none;border:1px solid var(--border);color:var(--muted);border-radius:6px;padding:1px 8px;cursor:pointer;font-size:.72rem}
pre.code code{display:block;padding:14px 16px;overflow-x:auto;font-size:.9rem;line-height:1.55;white-space:pre;tab-size:4}
.tk-k{color:#c792ea}.tk-s{color:#c3e88d}.tk-n{color:#f78c6c}.tk-c{color:#6b6f8a;font-style:italic}.tk-t{color:#82aaff}.tk-f{color:#ffcb6b}
.light .tk-k{color:#7c3aed}.light .tk-s{color:#15803d}.light .tk-n{color:#c2410c}.light .tk-c{color:#6b7280}.light .tk-t{color:#1d4ed8}.light .tk-f{color:#a16207}

/* ===== Quiz engine ===== */
.qhead{display:flex;align-items:center;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.qhead .bar{flex:1;min-width:120px}
.qcard{max-width:820px;margin:0 auto}
.qtext{font-size:1.15rem;font-weight:600;margin-bottom:14px}
.qtext code{background:var(--bg3);padding:1px 6px;border-radius:5px;font-size:.9em;color:var(--accent2)}
.choices{display:grid;gap:10px;margin-top:14px}
.choice{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:13px 16px;border-radius:var(--radius);border:1px solid var(--border);background:var(--bg2);cursor:pointer;font-size:1rem;width:100%;transition:border-color .12s,background .12s,transform .08s}
.choice:hover:not([disabled]){border-color:var(--accent2)}
.choice:active:not([disabled]){transform:scale(.99)}
.choice .key{flex:none;display:grid;place-items:center;width:26px;height:26px;border-radius:7px;background:var(--bg3);font-family:var(--mono);font-size:.8rem;color:var(--muted)}
.choice code{background:var(--bg3);padding:1px 5px;border-radius:4px;font-size:.92em}
.choice.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,var(--bg2))}
.choice.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 13%,var(--bg2))}
.choice[disabled]{cursor:default}
.explain{margin-top:16px;padding:14px 16px;border-radius:var(--radius);background:var(--bg2);border:1px solid var(--border);border-left:4px solid var(--ok)}
.explain.no{border-left-color:var(--bad)}
.explain b{display:block;margin-bottom:4px}
.explain code{background:var(--bg3);padding:1px 5px;border-radius:4px}
.qfoot{display:flex;justify-content:flex-end;gap:10px;margin-top:16px;flex-wrap:wrap}
.buglines{list-style:none;margin:0;padding:8px 0;background:var(--code-bg);border:1px solid var(--border);border-radius:var(--radius);overflow-x:auto;font-family:var(--mono);font-size:.9rem}
.buglines li button{display:flex;width:100%;gap:14px;background:none;border:0;padding:3px 14px;cursor:pointer;text-align:left;white-space:pre;font-family:var(--mono);color:var(--fg);border-left:3px solid transparent}
.buglines li button:hover:not([disabled]){background:color-mix(in srgb,var(--accent2) 12%,transparent);border-left-color:var(--accent2)}
.buglines li button .ln{color:var(--muted);min-width:2ch;text-align:right;user-select:none}
.buglines li button.right{background:color-mix(in srgb,var(--ok) 18%,transparent);border-left-color:var(--ok)}
.buglines li button.wrong{background:color-mix(in srgb,var(--bad) 18%,transparent);border-left-color:var(--bad)}
.buglines li button[disabled]{cursor:default}
.fixline{margin-top:10px;font-family:var(--mono);font-size:.88rem;background:var(--code-bg);border:1px dashed var(--ok);border-radius:8px;padding:8px 12px;white-space:pre-wrap}
.timer{font-family:var(--mono);font-weight:800;font-size:1.1rem;min-width:56px;text-align:center}
.timer.low{color:var(--bad);animation:pulse .6s infinite alternate}
@keyframes pulse{to{transform:scale(1.12)}}
.hearts{font-size:1.2rem;letter-spacing:2px}
.combo{font-family:var(--mono);color:var(--warn);font-weight:800}
.flash-ok{animation:flashok .35s}.flash-bad{animation:flashbad .35s}
@keyframes flashok{0%{box-shadow:0 0 0 0 var(--ok)}100%{box-shadow:0 0 0 14px transparent}}
@keyframes flashbad{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.result{text-align:center;max-width:620px;margin:0 auto}
.result .score{font-family:var(--mono);font-size:clamp(3rem,10vw,5rem);font-weight:800;color:var(--accent);line-height:1}
.result .xpgain{font-family:var(--mono);color:var(--warn);font-size:1.2rem;margin:10px 0 18px}

/* ===== Boss ===== */
.boss{display:flex;align-items:center;gap:16px;padding:16px 18px;border-radius:var(--radius);background:linear-gradient(135deg,color-mix(in srgb,var(--bad) 20%,var(--bg2)),var(--bg2));border:1px solid color-mix(in srgb,var(--bad) 40%,var(--border));margin-bottom:18px}
.boss .face{font-size:3rem;line-height:1}
.boss .hp{flex:1}
.boss .hp .bar{height:14px}
.boss .hp .bar>i{background:linear-gradient(90deg,#ff5c7a,#ff9f43)}
.boss.hit .face{animation:flashbad .35s}

/* ===== Arcade ===== */
.game-card{position:relative;overflow:hidden;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:170px}
.game-card .gi{font-size:2.4rem;line-height:1}
.game-card .best{margin-top:auto;font-family:var(--mono);font-size:.8rem;color:var(--muted)}
.event{border-radius:var(--radius);padding:24px;background:radial-gradient(circle at 85% 20%,color-mix(in srgb,var(--accent2) 22%,transparent),transparent 55%),var(--bg2);border:1px solid color-mix(in srgb,var(--accent2) 35%,var(--border))}
.event .big{font-size:2.6rem}
.duel-vs{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;margin-bottom:18px}
.duel-vs .side-p{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--radius);background:var(--bg2);border:1px solid var(--border);min-width:0}
.duel-vs .side-p:last-child{flex-direction:row-reverse;text-align:right}
.duel-vs .vs{font-family:var(--mono);font-weight:800;color:var(--warn)}
.duel-vs .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.duel-vs .pts{font-family:var(--mono);color:var(--accent)}

/* ===== Leaderboard ===== */
.lb{list-style:none;margin:0;padding:0}
.lb li{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px}
.lb li:nth-child(odd){background:var(--bg2)}
.lb li.me{outline:1px solid var(--accent)}
.lb .rank{font-family:var(--mono);font-weight:800;width:2.2em;text-align:center}
.lb .who{flex:1;min-width:0}
.lb .who b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb .who small{font-size:.78rem}
.lb .val{font-family:var(--mono);font-weight:700}

/* ===== Profile / badges ===== */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.badge{padding:14px 10px;text-align:center;border-radius:var(--radius);background:var(--bg2);border:1px solid var(--border)}
.badge .bi{font-size:2rem;display:block;line-height:1.2}
.badge b{display:block;font-size:.85rem;margin-top:4px}
.badge small{font-size:.72rem;display:block;line-height:1.3;margin-top:3px}
.badge.locked{opacity:.38;filter:grayscale(1)}
.emoji-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px}
.emoji-grid button{font-size:1.4rem;padding:6px;border-radius:10px;border:2px solid transparent;background:var(--bg3);cursor:pointer;line-height:1.2}
.emoji-grid button.on{border-color:var(--accent)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches button{width:34px;height:34px;border-radius:50%;border:3px solid transparent;cursor:pointer}
.swatches button.on{border-color:var(--fg)}
.theme-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.theme-opt{border-radius:var(--radius);border:2px solid var(--border);padding:0;cursor:pointer;overflow:hidden;text-align:left;background:none}
.theme-opt.on{border-color:var(--accent)}
.theme-opt .pv{height:64px;display:flex;align-items:flex-end;gap:6px;padding:10px}
.theme-opt .pv i{display:block;height:10px;border-radius:4px}
.theme-opt .nm{display:block;padding:8px 10px;font-weight:700;font-size:.88rem;background:var(--bg2)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}
.toggle:last-child{border-bottom:0}
.switch{position:relative;width:48px;height:28px;flex:none}
.switch input{opacity:0;width:0;height:0;position:absolute}
.switch span{position:absolute;inset:0;background:var(--bg3);border:1px solid var(--border);border-radius:99px;cursor:pointer;transition:.2s}
.switch span::after{content:"";position:absolute;width:20px;height:20px;left:3px;top:3px;border-radius:50%;background:var(--muted);transition:.2s}
.switch input:checked+span{background:var(--accent)}
.switch input:checked+span::after{left:23px;background:var(--on-accent)}
.switch input:focus-visible+span{outline:2px solid var(--accent2);outline-offset:2px}
input[type=range]{width:100%;accent-color:var(--accent)}
input[type=color]{width:46px;height:34px;border:1px solid var(--border);border-radius:8px;background:none;padding:2px;cursor:pointer}

/* ===== Modal, toasts ===== */
.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);z-index:60;display:grid;grid-template-columns:minmax(0,1fr);justify-items:center;align-items:center;padding:16px;animation:fade .15s}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:calc(var(--radius) + 4px);width:min(560px,100%);max-width:calc(100vw - 32px);min-width:0;max-height:92vh;overflow:auto;padding:24px;box-shadow:var(--shadow);animation:pop .2s}
.modal.wide{width:min(760px,100%)}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{transform:scale(.95);opacity:0}}
.steps{display:flex;gap:6px;margin-bottom:18px}
.steps i{height:4px;flex:1;border-radius:9px;background:var(--bg3)}
.steps i.on{background:var(--accent)}
#toasts{position:fixed;top:72px;right:16px;z-index:70;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:calc(100vw - 32px)}
.toast{pointer-events:none;background:var(--bg2);border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:10px;padding:10px 14px;box-shadow:var(--shadow);animation:slidein .25s;pointer-events:auto;max-width:340px}
.toast b{display:block}
@keyframes slidein{from{transform:translateX(30px);opacity:0}}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:80;width:100vw;height:100vh}

/* ===== Footer ===== */
.footer{border-top:1px solid var(--border);margin-top:60px;padding:30px clamp(18px,4vw,40px);color:var(--muted);font-size:.88rem}
.footer .cols{max-width:1180px;margin:0 auto;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}
.footer a{color:var(--muted);margin-right:14px;display:inline-block;line-height:2}
.footer .cols>div{min-width:0;flex:1 1 260px}

/* ===== Search ===== */
.search-hit{display:block;text-decoration:none;color:var(--fg)}
.search-hit mark{background:color-mix(in srgb,var(--warn) 40%,transparent);color:inherit;border-radius:3px;padding:0 2px}

/* ===== Motion off ===== */
.no-motion *,.no-motion *::before,.no-motion *::after{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){.auto-motion *{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ===== Retro pixel theme extras ===== */
.theme-retro .btn,.theme-retro .card,.theme-retro .choice{box-shadow:4px 4px 0 var(--border)}
.theme-retro h1,.theme-retro h2,.theme-retro h3,.theme-retro .btn{text-transform:uppercase;letter-spacing:.04em}
.theme-playful .btn{border-radius:99px}
.theme-playful .card.hover:hover{transform:translateY(-4px) rotate(-.4deg)}

/* ===== Print (cheat sheets) ===== */
@media print{
  .topbar,.tabbar,.side,.lesson-nav,.noprint,#toasts,.footer{display:none!important}
  body{background:#fff;color:#000}
  .viewer{display:block}
  pre.code{border:1px solid #999}
  .prose{font-size:11pt}
}

/* ===== JuiceMind-style exercise workspace ===== */
.side-close{display:none}
@media (max-width:900px){.side-close{display:inline-flex}}
.ex-viewer{grid-template-columns:280px 1fr}
.ex-wrap{padding:clamp(14px,2.5vw,26px);min-width:0}
.ex-grid{display:grid;grid-template-columns:minmax(280px,5fr) 7fr;gap:20px;margin-top:6px;align-items:start}
.ex-left{min-width:0}
.ex-right{position:sticky;top:76px;min-width:0;display:flex;flex-direction:column;gap:8px}
@media (max-width:1250px){.ex-viewer{grid-template-columns:1fr}.ex-viewer .side{position:fixed;inset:62px 0 0 0;height:auto;z-index:25;display:none;width:auto}.ex-viewer .side.open{display:block}.ex-viewer .side-toggle,.ex-viewer .side-close{display:inline-flex}}
@media (max-width:860px){.ex-grid{grid-template-columns:1fr}.ex-right{position:static}}
.ex-bar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.ex-label{font-family:var(--mono);font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:4px}
.editor{border:1px solid var(--border);border-radius:var(--radius);background:var(--code-bg);overflow:hidden}
.ed-scroll{display:flex;max-height:min(58vh,560px);min-height:260px;overflow:auto}
.ed-gutter{flex:none;padding:12px 0;text-align:right;color:var(--muted);font-family:var(--mono);font-size:.88rem;line-height:1.55;user-select:none;border-right:1px solid var(--border);background:color-mix(in srgb,var(--code-bg) 80%,var(--bg3));position:sticky;left:0;z-index:2;min-height:100%}
.ed-gutter span{display:block;padding:0 10px 0 12px}
.ed-inner{position:relative;flex:1;min-width:max-content}
.ed-hl,.ed-ta{margin:0;padding:12px 14px;font-family:var(--mono);font-size:.88rem;line-height:1.55;tab-size:4;white-space:pre;border:0;letter-spacing:normal;word-spacing:normal}
.ed-hl{pointer-events:none;color:var(--fg);min-height:100%}
.ed-hl code{font:inherit}
.ed-ta{position:absolute;inset:0;width:100%;height:100%;resize:none;background:transparent;color:transparent;caret-color:var(--accent);outline:none;overflow:hidden}
.ed-ta::selection{background:color-mix(in srgb,var(--accent2) 35%,transparent);color:transparent}
.editor:focus-within{border-color:var(--accent2)}
.console{margin:0;background:var(--code-bg);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;font-family:var(--mono);font-size:.85rem;min-height:90px;max-height:260px;overflow:auto;white-space:pre-wrap}
.c-err{color:var(--bad)}.c-ok{color:var(--ok);font-weight:700}
.preview{width:100%;height:240px;border:1px solid var(--border);border-radius:var(--radius);background:#fff}
.stdin summary{cursor:pointer;color:var(--muted);font-size:.85rem}
.stdin textarea{min-height:50px;margin-top:6px}
.tests{list-style:none;margin:0;padding:0}
.tests li{display:flex;flex-wrap:wrap;gap:10px;align-items:baseline;padding:8px 12px;border-radius:8px;background:var(--bg2);border:1px solid var(--border);margin-bottom:6px;font-size:.92rem}
.tests li .ti{font-family:var(--mono);font-weight:800;width:1em}
.tests li.pass{border-color:color-mix(in srgb,var(--ok) 50%,var(--border))}.tests li.pass .ti{color:var(--ok)}
.tests li.fail{border-color:color-mix(in srgb,var(--bad) 50%,var(--border))}.tests li.fail .ti{color:var(--bad)}
.tests li .tm{flex-basis:100%;color:var(--bad);padding-left:1.6em;font-family:var(--mono);font-size:.78rem}
/* fill in the code */
pre.code.fill code{white-space:pre;line-height:2}
.blank{font:inherit;font-family:var(--mono);background:var(--bg);color:var(--fg);border:1.5px dashed var(--accent2);border-radius:6px;padding:1px 6px;margin:0 2px;min-width:3ch}
.blank:focus{outline:none;border-style:solid;border-color:var(--accent)}
.blank.right{border:1.5px solid var(--ok);background:color-mix(in srgb,var(--ok) 15%,var(--bg))}
.blank.wrong{border:1.5px solid var(--bad);background:color-mix(in srgb,var(--bad) 15%,var(--bg))}
.blank.shown{border:1.5px solid var(--warn);color:var(--warn)}
/* assignments */
.as-row{display:flex;gap:14px;align-items:flex-start;padding:14px 16px}
.as-row.overdue{border-color:color-mix(in srgb,var(--bad) 55%,var(--border))}
.as-row.done{opacity:.75}
.as-ic{font-size:1.5rem;line-height:1.2}
.as-note{margin-top:6px;font-style:italic;color:var(--muted);font-size:.9rem}
@media (max-width:600px){.as-row{flex-wrap:wrap}}
.pill.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 50%,var(--border))}
.pill.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 50%,var(--border))}
.navlinks a .tag.due{background:var(--bad);color:#fff}
.tabbar .i{position:relative}
.tbadge{position:absolute;top:-4px;right:-10px;background:var(--bad);color:#fff;font-size:.6rem;font-weight:800;border-radius:99px;padding:1px 5px;line-height:1.3}
table.gb{border-collapse:collapse;width:100%;font-size:.88rem}
table.gb th,table.gb td{border-bottom:1px solid var(--border);padding:10px 12px;text-align:center;white-space:nowrap}
table.gb th{background:var(--bg3);font-weight:700;vertical-align:bottom}
table.gb th small{display:block;font-weight:500;color:var(--muted);font-size:.72rem;margin-top:3px}
table.gb th:first-child,table.gb td.gb-name{text-align:left;position:sticky;left:0;background:var(--bg2);z-index:1}
table.gb th:first-child{background:var(--bg3)}
td.gb-name{display:flex;align-items:center;gap:8px}
td.gb-ok{color:var(--ok);font-weight:700}td.gb-late{color:var(--warn);font-weight:700}td.gb-miss{color:var(--bad);font-weight:700}td.gb-none{color:var(--muted)}
td sup{font-size:.62rem;margin-left:3px;font-weight:600}

/* ===== GDQuest-style lessons ===== */
.lesson.gd{max-width:880px;margin:0 auto}
.lesson.gd .prose{font-size:1.08rem;line-height:1.75}
.lesson.gd .prose > p, .lesson.gd .prose > ul, .lesson.gd .prose > ol{max-width:68ch}
.lesson-head{padding-bottom:16px;border-bottom:1px solid var(--border);margin-bottom:8px}
.lesson-head h1{font-size:clamp(1.8rem,4vw,2.5rem);margin:6px 0 14px}
.iq{margin:26px 0;padding:18px 20px;border-radius:var(--radius);background:color-mix(in srgb,var(--accent2) 7%,var(--bg2));border:1px solid color-mix(in srgb,var(--accent2) 35%,var(--border));position:relative}
.iq.iq-ok{border-color:color-mix(in srgb,var(--ok) 55%,var(--border))}
.iq-tag{display:inline-block;font-family:var(--mono);font-size:.72rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--accent2);background:color-mix(in srgb,var(--accent2) 15%,transparent);padding:3px 10px;border-radius:99px}
.example{margin:18px 0;border:1px solid color-mix(in srgb,var(--accent) 35%,var(--border));border-radius:var(--radius);background:var(--bg2);padding:10px;display:flex;flex-direction:column;gap:8px}
.exm-head{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:2px 4px;font-size:.8rem;color:var(--accent)}
.example .ed-scroll{min-height:0;max-height:340px}
.example .console{min-height:44px;max-height:200px;font-size:.84rem}
.err-help{margin-top:10px;padding:10px 12px;border-radius:8px;background:color-mix(in srgb,var(--warn) 10%,var(--bg2));border:1px solid color-mix(in srgb,var(--warn) 35%,var(--border));color:var(--fg);font-family:var(--font);font-size:.88rem;white-space:normal}
.err-help code{background:var(--bg3);padding:0 5px;border-radius:4px}
.practices{margin-top:36px;padding:22px;border-radius:var(--radius);background:var(--bg2);border:1px solid var(--border)}
.practices h2{margin-bottom:6px}
.practice-card{display:flex;gap:12px;align-items:center;padding:14px 16px}
.ex-sec .prose{font-size:1rem}
button.gl{all:unset;cursor:help;border-bottom:2px dotted var(--accent2);color:inherit;font:inherit}
button.gl:hover,button.gl:focus-visible{background:color-mix(in srgb,var(--accent2) 15%,transparent);border-radius:3px}
.gl-pop{position:absolute;z-index:90;background:var(--bg2);border:1px solid var(--accent2);border-radius:var(--radius);padding:12px 14px;box-shadow:var(--shadow);animation:pop .15s;font-size:.92rem}
.gl-pop b{color:var(--accent2);text-transform:capitalize}
.gl-pop p{margin:6px 0 8px}
.gl-pop code{background:var(--bg3);padding:0 5px;border-radius:4px}
dl.gloss{display:grid;gap:10px;margin:0}
.viewer>*{min-width:0}
.lesson,.example,.editor,.ex-left,.ex-right{min-width:0;max-width:100%}
.exm-head{flex-wrap:wrap}
.lesson-head h1{overflow-wrap:anywhere}

</style>

<script>
window.COURSES = [{"id":"py","title":"Intro to Programming","short":"Python","emoji":"🐍","year":1,"yearLabel":"Freshman","color":"#3b82f6","blurb":"Learn to think like a programmer with Python: variables, decisions, loops, functions and lists.","units":[{"id":"py1","title":"Variables, Types & Input","lessons":[{"title":"Variables and data types","mins":8,"html":"<p>A <strong>variable</strong> is a name that points to a value. You create one with <code>=</code>, which means <em>assign</em>, not <em>equals</em>.</p>\n<pre><code class=\"language-python\">name = &quot;Ada&quot;        # str  (text)\nage = 15            # int  (whole number)\ngpa = 3.8           # float (decimal)\nis_coder = True     # bool (True / False)\n</code></pre>\n<p>Python figures out the type for you. You can check it with <code>type(age)</code>, which gives <code>&lt;class &#39;int&#39;&gt;</code>.</p>\n<h3>Math operators</h3>\n<table>\n<thead>\n<tr>\n<th>Operator</th>\n<th>Meaning</th>\n<th>Example</th>\n<th>Result</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><code>+ - *</code></td>\n<td>add, subtract, multiply</td>\n<td><code>3 * 4</code></td>\n<td><code>12</code></td>\n</tr>\n<tr>\n<td><code>/</code></td>\n<td>divide (always a float)</td>\n<td><code>7 / 2</code></td>\n<td><code>3.5</code></td>\n</tr>\n<tr>\n<td><code>//</code></td>\n<td>floor divide</td>\n<td><code>7 // 2</code></td>\n<td><code>3</code></td>\n</tr>\n<tr>\n<td><code>%</code></td>\n<td>remainder (mod)</td>\n<td><code>7 % 2</code></td>\n<td><code>1</code></td>\n</tr>\n<tr>\n<td><code>**</code></td>\n<td>power</td>\n<td><code>2 ** 5</code></td>\n<td><code>32</code></td>\n</tr>\n</tbody></table>\n<h3>Input and converting types</h3>\n<p><code>input()</code> <strong>always gives back a string</strong>, even if the user types a number. Convert it before doing math:</p>\n<pre><code class=\"language-python\">age = int(input(&quot;Age? &quot;))\nprint(&quot;Next year you&#39;ll be&quot;, age + 1)\n</code></pre>\n<p>Use <code>int()</code>, <code>float()</code> and <code>str()</code> to convert between types. Mixing types incorrectly, like <code>&quot;5&quot; + 1</code>, causes a <strong>TypeError</strong>.</p>\n<blockquote>\n<p><strong>Tip:</strong> Name variables clearly: <code>total_score</code> beats <code>ts</code>. Names can&#39;t start with a number or contain spaces or dashes.</p>\n</blockquote>\n","text":"A variable is a name that points to a value. You create one with = , which means assign , not equals . python name = \"Ada\" str (text) age = 15 int (whole number) gpa = 3.8 float (decimal) is coder = True bool (True / False) Python figures out the type for you. You can check it with type(age) , which gives <class 'int' . Math operators Operator Meaning Example Result + add, subtract, multiply 3 4 12 / divide (always a float) 7 / 2 3.5 // floor divide 7 // 2 3 % remainder (mod) 7 % 2 1 power 2 5 32 Input and converting types input() always gives back a string , even if the user types a number. Convert it before doing math: python age = int(input(\"Age? \")) print(\"Next year you'll be\", age + 1) Use int() , float() and str() to convert between types. Mixing types incorrectly, like \"5\" + 1 , causes a TypeError . Tip: Name variables clearly: total score beats ts . Names can't start with a number or contain spaces or dashes.","quizzes":[]}],"ex":[{"id":"py1-e1","title":"Hello, World!","lang":"python","mins":5,"prompt":"<p>Print exactly <code>Hello, World!</code> to the screen. Capital H, a comma, a capital W and an exclamation mark.</p>\n","starter":"# Print Hello, World! below\n","tests":["assert __out.strip() != \"\", \"Nothing was printed. Use print(...)\"","assert __out.strip().splitlines()[0] == \"Hello, World!\", \"The first line should be exactly: Hello, World!\""],"solution":"print(\"Hello, World!\")","hint":"Text goes inside quotes: `print(\"...\")`","hints":["Text goes inside quotes: `print(\"...\")`"],"visual":false,"unit":"py1"},{"id":"py1-e2","title":"Minutes to hours","lang":"python","mins":10,"prompt":"<p>Write a function <code>split_time(minutes)</code> that <strong>returns</strong> a pair <code>(hours, leftover_minutes)</code>.</p>\n<p>For example, <code>split_time(135)</code> returns <code>(2, 15)</code>. Use <code>//</code> and <code>%</code>.</p>\n","starter":"def split_time(minutes):\n    # return (hours, leftover_minutes)\n    pass\n\nprint(split_time(135))","tests":["assert split_time(135) == (2, 15), \"split_time(135) should return (2, 15)\"","assert split_time(59) == (0, 59), \"split_time(59) should return (0, 59)\"","assert split_time(120) == (2, 0), \"split_time(120) should return (2, 0)\""],"solution":"def split_time(minutes):\n    return (minutes // 60, minutes % 60)\n\nprint(split_time(135))","hint":"`minutes // 60` gives the whole hours, and `minutes % 60` gives what's left over.","hints":["`minutes // 60` gives the whole hours, and `minutes % 60` gives what's left over."],"visual":false,"unit":"py1"}],"fill":[],"quiz":[{"q":"What is the type of the value `3.0`?","choices":["int","float","str","bool"],"a":1,"why":"Any number with a decimal point is a `float`, even if the decimal part is zero.","id":"py1-q1","kind":"mcq","type":"quiz"},{"q":"The user types `12` when `x = input()` runs. What type is `x`?","choices":["int","float","str","It depends on what they type"],"a":2,"why":"`input()` always returns a string. You must convert it with `int()` or `float()` to do math.","id":"py1-q2","kind":"mcq","type":"quiz"},{"q":"Which is a valid Python variable name?","choices":["`total_score`","`2fast`","`my-score`","`class`"],"a":0,"why":"Names can't start with a digit, can't contain `-`, and can't be reserved keywords like `class`.","id":"py1-q3","kind":"mcq","type":"quiz"},{"q":"What does `int(\"12\") + 3` evaluate to?","choices":["`\"123\"`","`15`","`\"15\"`","TypeError"],"a":1,"why":"`int(\"12\")` converts the string to the number 12, and 12 + 3 = 15.","id":"py1-q4","kind":"mcq","type":"quiz"},{"q":"What does `print(\"5\" + \"5\")` display?","choices":["10","55","5 5","TypeError"],"a":1,"why":"`+` on two strings **concatenates** (joins) them: `\"5\" + \"5\"` is `\"55\"`.","id":"py1-q5","kind":"mcq","type":"quiz"}],"trace":[{"q":"What does this print?","choices":["3.5 1 3.5","3 1 3.5","3 1 3","3.5 0 3.5"],"a":1,"lang":"python","code":"x = 7\ny = 2\nprint(x // y, x % y, x / y)","why":"`//` is floor division (3), `%` is the remainder (1), and `/` always gives a float (3.5).","id":"py1-t1","kind":"mcq","type":"trace"},{"q":"What does this print?","choices":["Ada2!","AdaAda!","Ada Ada!","TypeError"],"a":1,"lang":"python","code":"name = \"Ada\"\nprint(name * 2 + \"!\")","why":"Multiplying a string by an int repeats it, so `\"Ada\" * 2` is `\"AdaAda\"`, and then `\"!\"` is added.","id":"py1-t2","kind":"mcq","type":"trace"}],"bug":[{"q":"This program crashes when it runs. Click the line that causes the problem.","lang":"python","code":"age = input(\"How old are you? \")\nnext_year = age + 1\nprint(\"Next year you'll be\", next_year)","lines":[2,1],"fix":"next_year = int(age) + 1","why":"`age` is a string because `input()` returns text, and you can't add a string and an int. Convert with `int()`, either on line 1 or line 2.","id":"py1-b1","kind":"bug","type":"bug"}]},{"id":"py2","title":"If Statements & Conditionals","lessons":[{"title":"True, False and comparisons","mins":6,"html":"<p>Before a program can make a decision, it needs a question with a <strong>yes or no</strong> answer. In Python, the answer is a <strong>boolean</strong>: either <code>True</code> or <code>False</code>.</p>\n<p>You get booleans by <strong>comparing</strong> values:</p>\n<table>\n<thead>\n<tr>\n<th>Operator</th>\n<th>Means</th>\n<th>Example</th>\n<th>Result</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><code>==</code></td>\n<td>equal to</td>\n<td><code>5 == 5</code></td>\n<td><code>True</code></td>\n</tr>\n<tr>\n<td><code>!=</code></td>\n<td>not equal to</td>\n<td><code>5 != 3</code></td>\n<td><code>True</code></td>\n</tr>\n<tr>\n<td><code>&lt;</code> / <code>&gt;</code></td>\n<td>less / greater than</td>\n<td><code>2 &gt; 7</code></td>\n<td><code>False</code></td>\n</tr>\n<tr>\n<td><code>&lt;=</code> / <code>&gt;=</code></td>\n<td>at most / at least</td>\n<td><code>18 &gt;= 18</code></td>\n<td><code>True</code></td>\n</tr>\n</tbody></table>\n<p>Try it! Change the numbers and press <strong>Run</strong>:</p>\n<pre><code class=\"language-python-run\">age = 15\nprint(age &gt;= 13)\nprint(age == 16)\nprint(&quot;cat&quot; == &quot;Cat&quot;)\n</code></pre>\n<div class=\"lq\" data-lq=\"0\"></div><h3>Comparing text</h3>\n<p>String comparisons are <strong>case-sensitive</strong>: <code>&quot;cat&quot; == &quot;Cat&quot;</code> is <code>False</code>. You can make both sides lowercase first with <code>.lower()</code>.</p>\n<h3>Saving a comparison</h3>\n<p>A comparison is just a value, so you can store it in a variable:</p>\n<pre><code class=\"language-python-run\">score = 82\npassed = score &gt;= 70\nprint(&quot;Passed?&quot;, passed)\n</code></pre>\n<blockquote>\n<p><strong>Watch out:</strong> One <code>=</code> <em>stores</em> a value. Two <code>==</code> <em>compares</em> values. Mixing them up is one of the most common beginner bugs.</p>\n</blockquote>\n<div class=\"lq\" data-lq=\"1\"></div>\n","text":"Before a program can make a decision, it needs a question with a yes or no answer. In Python, the answer is a boolean : either True or False . You get booleans by comparing values: Operator Means Example Result == equal to 5 == 5 True != not equal to 5 != 3 True < / less / greater than 2 7 False <= / = at most / at least 18 = 18 True Try it! Change the numbers and press Run : python run age = 15 print(age = 13) print(age == 16) print(\"cat\" == \"Cat\") Comparing text String comparisons are case sensitive : \"cat\" == \"Cat\" is False . You can make both sides lowercase first with .lower() . Saving a comparison A comparison is just a value, so you can store it in a variable: python run score = 82 passed = score = 70 print(\"Passed?\", passed) Watch out: One = stores a value. Two == compares values. Mixing them up is one of the most common beginner bugs. ","quizzes":[{"q":"What does `print(10 != 10)` show?","choices":["True","False","10","Error"],"a":1,"why":"`!=` means \"not equal\". 10 *is* equal to 10, so the answer is `False`.","id":"py2-L1q1","kind":"mcq","type":"quiz","inline":true},{"q":"Which line **compares** `x` with 5?","choices":["`x = 5`","`x == 5`","`x := 5`","`x => 5`"],"a":1,"why":"`==` compares. A single `=` would store 5 in `x` instead.","id":"py2-L1q2","kind":"mcq","type":"quiz","inline":true}]},{"title":"Your first if statement","mins":7,"html":"<p>An <strong>if statement</strong> runs a block of code <strong>only when its condition is True</strong>:</p>\n<pre><code class=\"language-python-run\">battery = 25\nif battery &lt; 30:\n    print(&quot;Low battery! Plug in your laptop.&quot;)\nprint(&quot;Battery check done.&quot;)\n</code></pre>\n<p>Three things make it work:</p>\n<ol>\n<li>The word <code>if</code>, then a <strong>condition</strong>.</li>\n<li>A <strong>colon</strong> <code>:</code> at the end of the line.</li>\n<li>The code that belongs to the <code>if</code> is <strong>indented</strong> (4 spaces).</li>\n</ol>\n<p>The last line isn&#39;t indented, so it <strong>always</strong> runs. Try changing <code>battery</code> to <code>80</code> and run it again.</p>\n<div class=\"lq\" data-lq=\"0\"></div><h3>The block can have many lines</h3>\n<p>Every indented line under the <code>if</code> runs together, or none of them run:</p>\n<pre><code class=\"language-python-run\">temperature = 95\nif temperature &gt; 90:\n    print(&quot;It&#39;s hot!&quot;)\n    print(&quot;Drink some water.&quot;)\nprint(&quot;Have a good day.&quot;)\n</code></pre>\n<h3>Common mistakes</h3>\n<ul>\n<li><strong>A missing colon:</strong> <code>if x &gt; 5</code> gives a SyntaxError.</li>\n<li><strong>Forgetting to indent:</strong> gives an IndentationError.</li>\n<li><strong>Using <code>=</code> instead of <code>==</code>:</strong> <code>if x = 5:</code> gives a SyntaxError.</li>\n</ul>\n<div class=\"lq\" data-lq=\"1\"></div>\n","text":"An if statement runs a block of code only when its condition is True : python run battery = 25 if battery < 30: print(\"Low battery! Plug in your laptop.\") print(\"Battery check done.\") Three things make it work: 1. The word if , then a condition . 2. A colon : at the end of the line. 3. The code that belongs to the if is indented (4 spaces). The last line isn't indented, so it always runs. Try changing battery to 80 and run it again. The block can have many lines Every indented line under the if runs together, or none of them run: python run temperature = 95 if temperature 90: print(\"It's hot!\") print(\"Drink some water.\") print(\"Have a good day.\") Common mistakes A missing colon: if x 5 gives a SyntaxError. Forgetting to indent: gives an IndentationError. Using = instead of == : if x = 5: gives a SyntaxError. ","quizzes":[{"q":"`battery = 80`. What does the program above print?","choices":["Both lines","Only \"Battery check done.\"","Only \"Low battery! Plug in your laptop.\"","Nothing"],"a":1,"why":"`80 < 30` is `False`, so the indented line is skipped. The unindented line always runs.","id":"py2-L2q1","kind":"mcq","type":"quiz","inline":true},{"q":"What's wrong with this line? `if score > 90`","choices":["It's missing a colon at the end","`>` should be `=>`","`if` must be capitalized","Nothing"],"a":0,"why":"Every `if` line ends with `:`.","id":"py2-L2q2","kind":"mcq","type":"quiz","inline":true}]},{"title":"else and elif","mins":9,"html":"<h3>else: one or the other</h3>\n<p><code>else</code> runs when the <code>if</code> condition is <strong>False</strong>. Exactly one of the two blocks runs, every time:</p>\n<pre><code class=\"language-python-run\">number = 7\nif number % 2 == 0:\n    print(number, &quot;is even&quot;)\nelse:\n    print(number, &quot;is odd&quot;)\n</code></pre>\n<p><code>else</code> has <strong>no condition</strong> and ends with a colon.</p>\n<h3>elif: more than two choices</h3>\n<p><code>elif</code> means &quot;else if&quot;. Python checks each condition <strong>from top to bottom</strong> and runs <strong>only the first one that&#39;s True</strong>. Then it skips the rest.</p>\n<pre><code class=\"language-python-run\">speed = 55\nif speed &gt; 70:\n    print(&quot;Too fast!&quot;)\nelif speed &gt; 40:\n    print(&quot;Good speed.&quot;)\nelse:\n    print(&quot;A bit slow.&quot;)\n</code></pre>\n<div class=\"lq\" data-lq=\"0\"></div><h3>Order matters!</h3>\n<p>Because the first True condition wins, put the <strong>most specific</strong> check first. This version has a bug:</p>\n<pre><code class=\"language-python-run\">score = 95\nif score &gt;= 70:\n    print(&quot;C&quot;)\nelif score &gt;= 90:\n    print(&quot;A&quot;)   # never reached for 95!\n</code></pre>\n<p>A 95 prints &quot;C&quot;, because <code>95 &gt;= 70</code> is checked first. When you check &quot;at least&quot; values, go from <strong>highest to lowest</strong>.</p>\n<div class=\"lq\" data-lq=\"1\"></div><h3>if vs. several ifs</h3>\n<p>Several separate <code>if</code> statements are all checked, one by one. An <code>elif</code> chain stops at the first match. Choose based on whether more than one block should be able to run.</p>\n","text":" else: one or the other else runs when the if condition is False . Exactly one of the two blocks runs, every time: python run number = 7 if number % 2 == 0: print(number, \"is even\") else: print(number, \"is odd\") else has no condition and ends with a colon. elif: more than two choices elif means \"else if\". Python checks each condition from top to bottom and runs only the first one that's True . Then it skips the rest. python run speed = 55 if speed 70: print(\"Too fast!\") elif speed 40: print(\"Good speed.\") else: print(\"A bit slow.\") Order matters! Because the first True condition wins, put the most specific check first. This version has a bug: python run score = 95 if score = 70: print(\"C\") elif score = 90: print(\"A\") never reached for 95! A 95 prints \"C\", because 95 = 70 is checked first. When you check \"at least\" values, go from highest to lowest . if vs. several ifs Several separate if statements are all checked, one by one. An elif chain stops at the first match. Choose based on whether more than one block should be able to run.","quizzes":[{"q":"`speed = 90`. Which message prints?","choices":["Too fast!","Good speed.","Too fast! and Good speed.","A bit slow."],"a":0,"why":"90 > 70 is True, so the first branch runs. Even though 90 > 40 is also True, `elif` is skipped once an earlier branch has run.","id":"py2-L3q1","kind":"mcq","type":"quiz","inline":true},{"q":"How many branches of an if / elif / elif / else chain can run at once?","choices":["Exactly one","All the ones that are True","Zero or one","Two at most"],"a":0,"why":"With an `else` at the end, exactly one branch runs: the first True one, or the `else` if none are True.","id":"py2-L3q2","kind":"mcq","type":"quiz","inline":true}]},{"title":"and, or, not","mins":8,"html":"<p>Combine conditions with <strong>logical operators</strong>:</p>\n<table>\n<thead>\n<tr>\n<th>Operator</th>\n<th>True when…</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><code>a and b</code></td>\n<td><strong>both</strong> are True</td>\n</tr>\n<tr>\n<td><code>a or b</code></td>\n<td><strong>at least one</strong> is True</td>\n</tr>\n<tr>\n<td><code>not a</code></td>\n<td><code>a</code> is False</td>\n</tr>\n</tbody></table>\n<pre><code class=\"language-python-run\">age = 16\nhas_permission = True\nif age &gt;= 13 and has_permission:\n    print(&quot;You can make an account.&quot;)\n\nday = &quot;Saturday&quot;\nif day == &quot;Saturday&quot; or day == &quot;Sunday&quot;:\n    print(&quot;Weekend!&quot;)\n</code></pre>\n<div class=\"lq\" data-lq=\"0\"></div><h3>Handy shortcuts</h3>\n<ul>\n<li><strong>Chained comparisons:</strong> <code>13 &lt;= age &lt;= 19</code> means <code>age &gt;= 13 and age &lt;= 19</code>.</li>\n<li><strong>The <code>in</code> operator:</strong> <code>if letter in &quot;aeiou&quot;:</code> checks for a vowel, and <code>if name in friends:</code> checks a list.</li>\n<li><strong>Write each comparison in full:</strong> <code>day == &quot;Sat&quot; or &quot;Sun&quot;</code> is a <strong>bug</strong>, because the <code>&quot;Sun&quot;</code> side on its own always counts as True. Write <code>day == &quot;Sat&quot; or day == &quot;Sun&quot;</code>.</li>\n</ul>\n<h3>Truthiness</h3>\n<p>In an <code>if</code>, these values count as <strong>False</strong>: <code>False</code>, <code>0</code>, <code>0.0</code>, <code>&quot;&quot;</code> (empty string), <code>[]</code> (empty list) and <code>None</code>. Everything else counts as True:</p>\n<pre><code class=\"language-python-run\">name = &quot;&quot;\nif name:\n    print(&quot;Hi&quot;, name)\nelse:\n    print(&quot;You didn&#39;t type a name!&quot;)\n</code></pre>\n<div class=\"lq\" data-lq=\"1\"></div><h3>Short-circuiting</h3>\n<p>Python stops as soon as it knows the answer. In <code>a and b</code>, if <code>a</code> is False, <code>b</code> is never checked. That lets you write safe checks like <code>if count != 0 and total / count &gt; 5:</code>.</p>\n","text":"Combine conditions with logical operators : Operator True when… a and b both are True a or b at least one is True not a a is False python run age = 16 has permission = True if age = 13 and has permission: print(\"You can make an account.\") day = \"Saturday\" if day == \"Saturday\" or day == \"Sunday\": print(\"Weekend!\") Handy shortcuts Chained comparisons: 13 <= age <= 19 means age = 13 and age <= 19 . The in operator: if letter in \"aeiou\": checks for a vowel, and if name in friends: checks a list. Write each comparison in full: day == \"Sat\" or \"Sun\" is a bug , because the \"Sun\" side on its own always counts as True. Write day == \"Sat\" or day == \"Sun\" . Truthiness In an if , these values count as False : False , 0 , 0.0 , \"\" (empty string), [] (empty list) and None . Everything else counts as True: python run name = \"\" if name: print(\"Hi\", name) else: print(\"You didn't type a name!\") Short circuiting Python stops as soon as it knows the answer. In a and b , if a is False, b is never checked. That lets you write safe checks like if count != 0 and total / count 5: .","quizzes":[{"q":"`x = 12`. What is `x > 10 and x < 20`?","choices":["True","False","12","Error"],"a":0,"why":"Both comparisons are True, so `and` gives True.","id":"py2-L4q1","kind":"mcq","type":"quiz","inline":true},{"q":"Which condition is True when `letter = \"e\"`?","choices":["`letter == \"a\" or \"e\"` is the correct way to write it","`letter in \"aeiou\"`","`not letter`","`letter == \"aeiou\"`"],"a":1,"why":"`in` checks whether \"e\" appears inside \"aeiou\". The first option is a classic bug, `not \"e\"` is False, and `\"e\" == \"aeiou\"` is False.","id":"py2-L4q2","kind":"mcq","type":"quiz","inline":true}]},{"title":"Nested ifs and shortcuts","mins":9,"html":"<h3>Nested if statements</h3>\n<p>You can put an <code>if</code> <strong>inside</strong> another <code>if</code>. The inner one is only checked when the outer one is True:</p>\n<pre><code class=\"language-python-run\">age = 15\nhas_ticket = True\nif has_ticket:\n    if age &gt;= 13:\n        print(&quot;Enjoy the movie!&quot;)\n    else:\n        print(&quot;You need an adult with you.&quot;)\nelse:\n    print(&quot;Please buy a ticket first.&quot;)\n</code></pre>\n<p>Each level of nesting adds <strong>4 more spaces</strong> of indentation.</p>\n<div class=\"lq\" data-lq=\"0\"></div><h3>Flatten when you can</h3>\n<p>Two nested ifs with nothing else between them can usually become one <code>and</code>:</p>\n<pre><code class=\"language-python\">if has_ticket:              # nested\n    if age &gt;= 13:\n        print(&quot;Go in&quot;)\n\nif has_ticket and age &gt;= 13:   # same thing, easier to read\n    print(&quot;Go in&quot;)\n</code></pre>\n<h3>Conditional expressions</h3>\n<p>For a quick either/or <strong>value</strong>, Python has a one-line form: <code>value_if_true if condition else value_if_false</code>.</p>\n<pre><code class=\"language-python-run\">n = 7\nlabel = &quot;even&quot; if n % 2 == 0 else &quot;odd&quot;\nprint(n, &quot;is&quot;, label)\n</code></pre>\n<h3>Early return in functions</h3>\n<p>Inside a function, <code>return</code> ends it right away. Checking special cases first keeps code flat:</p>\n<pre><code class=\"language-python-run\">def describe(temp):\n    if temp &lt; 0:\n        return &quot;freezing&quot;\n    if temp &lt; 20:\n        return &quot;cool&quot;\n    return &quot;warm&quot;\n\nprint(describe(-5), describe(10), describe(30))\n</code></pre>\n<div class=\"lq\" data-lq=\"1\"></div><h3>Bonus: match (Python 3.10+)</h3>\n<p><code>match</code> compares one value against several patterns. It&#39;s like a tidy <code>elif</code> chain:</p>\n<pre><code class=\"language-python-run\">command = &quot;go&quot;\nmatch command:\n    case &quot;stop&quot;:\n        print(&quot;Stopping&quot;)\n    case &quot;go&quot;:\n        print(&quot;Going!&quot;)\n    case _:\n        print(&quot;Unknown command&quot;)\n</code></pre>\n<p><code>case _</code> catches everything else, like <code>else</code>.</p>\n","text":" Nested if statements You can put an if inside another if . The inner one is only checked when the outer one is True: python run age = 15 has ticket = True if has ticket: if age = 13: print(\"Enjoy the movie!\") else: print(\"You need an adult with you.\") else: print(\"Please buy a ticket first.\") Each level of nesting adds 4 more spaces of indentation. Flatten when you can Two nested ifs with nothing else between them can usually become one and : python if has ticket: nested if age = 13: print(\"Go in\") if has ticket and age = 13: same thing, easier to read print(\"Go in\") Conditional expressions For a quick either/or value , Python has a one line form: value if true if condition else value if false . python run n = 7 label = \"even\" if n % 2 == 0 else \"odd\" print(n, \"is\", label) Early return in functions Inside a function, return ends it right away. Checking special cases first keeps code flat: python run def describe(temp): if temp < 0: return \"freezing\" if temp < 20: return \"cool\" return \"warm\" print(describe( 5), describe(10), describe(30)) Bonus: match (Python 3.10+) match compares one value against several patterns. It's like a tidy elif chain: python run command = \"go\" match command: case \"stop\": print(\"Stopping\") case \"go\": print(\"Going!\") case : print(\"Unknown command\") case catches everything else, like else .","quizzes":[{"q":"`has_ticket = False` and `age = 20`. What prints?","choices":["Enjoy the movie!","You need an adult with you.","Please buy a ticket first.","Nothing"],"a":2,"why":"The outer `if` is False, so Python jumps to its `else`. The inner `if` is never checked.","id":"py2-L5q1","kind":"mcq","type":"quiz","inline":true},{"q":"What does `\"big\" if 3 > 10 else \"small\"` evaluate to?","choices":["\"big\"","\"small\"","True","Error"],"a":1,"why":"`3 > 10` is False, so the expression gives the value after `else`.","id":"py2-L5q2","kind":"mcq","type":"quiz","inline":true}]}],"ex":[{"id":"py2-e1","title":"Letter grade","lang":"python","mins":10,"prompt":"<p>Write <code>letter_grade(score)</code> that returns <code>&quot;A&quot;</code> for 90 and up, <code>&quot;B&quot;</code> for 80 to 89, <code>&quot;C&quot;</code> for 70 to 79, <code>&quot;D&quot;</code> for 60 to 69, and <code>&quot;F&quot;</code> for anything lower.</p>\n","starter":"def letter_grade(score):\n    pass\n\nprint(letter_grade(85))","tests":["assert letter_grade(95) == \"A\", \"95 should be an A\"","assert letter_grade(90) == \"A\", \"90 should be an A (90 counts!)\"","assert letter_grade(85) == \"B\", \"85 should be a B\"","assert letter_grade(70) == \"C\", \"70 should be a C\"","assert letter_grade(61) == \"D\", \"61 should be a D\"","assert letter_grade(12) == \"F\", \"12 should be an F\""],"solution":"def letter_grade(score):\n    if score >= 90:\n        return \"A\"\n    elif score >= 80:\n        return \"B\"\n    elif score >= 70:\n        return \"C\"\n    elif score >= 60:\n        return \"D\"\n    else:\n        return \"F\"","hint":"Check from the highest grade down with `if` / `elif` / `else`, using `>=`.","hints":["Check from the highest grade down with `if` / `elif` / `else`, using `>=`."],"visual":false,"unit":"py2"},{"id":"py2-e2","title":"Leap years","lang":"python","mins":10,"prompt":"<p>A year is a <strong>leap year</strong> if it&#39;s divisible by 4. The exception is years divisible by 100, which are <em>not</em> leap years, unless they&#39;re also divisible by 400. Write <code>is_leap(year)</code> that returns <code>True</code> or <code>False</code>.</p>\n","starter":"def is_leap(year):\n    pass","tests":["assert is_leap(2024) == True, \"2024 is a leap year\"","assert is_leap(2023) == False, \"2023 is not a leap year\"","assert is_leap(1900) == False, \"1900 is NOT a leap year (divisible by 100)\"","assert is_leap(2000) == True, \"2000 IS a leap year (divisible by 400)\""],"solution":"def is_leap(year):\n    return year % 4 == 0 and (year % 100 != 0 or year % 400 == 0)","hint":"`year % 4 == 0` checks for divisible by 4. Combine the rules with `and` and `or`.","hints":["`year % 4 == 0` checks for divisible by 4. Combine the rules with `and` and `or`."],"visual":false,"unit":"py2"},{"id":"py2-e3","title":"Even or odd","lang":"python","mins":6,"prompt":"<p>Write <code>parity(n)</code> that returns the string <code>&quot;even&quot;</code> if <code>n</code> is even and <code>&quot;odd&quot;</code> if it&#39;s odd.</p>\n","starter":"def parity(n):\n    # use if / else and the % operator\n    pass\n\nprint(parity(7))","tests":["assert parity(4) == \"even\", 'parity(4) should be \"even\"'","assert parity(7) == \"odd\", 'parity(7) should be \"odd\"'","assert parity(0) == \"even\", 'parity(0) should be \"even\"'","assert parity(-3) == \"odd\", 'parity(-3) should be \"odd\"'"],"solution":"def parity(n):\n    if n % 2 == 0:\n        return \"even\"\n    else:\n        return \"odd\"\n\nprint(parity(7))","hint":"A number is even when `n % 2 == 0`.","hints":["A number is even when `n % 2 == 0`.","Use `if n % 2 == 0:` to return `\"even\"`, then `else:` to return `\"odd\"`."],"visual":false,"unit":"py2"},{"id":"py2-e4","title":"Movie ticket prices","lang":"python","mins":12,"prompt":"<p>Write <code>ticket_price(age, is_student)</code> that returns the price:</p>\n<ul>\n<li>Under 5: <strong>0</strong> (free)</li>\n<li>5 to 12: <strong>8</strong></li>\n<li>65 and over: <strong>9</strong></li>\n<li>Anyone else who is a student: <strong>10</strong></li>\n<li>Everyone else: <strong>14</strong></li>\n</ul>\n","starter":"def ticket_price(age, is_student):\n    pass","tests":["assert ticket_price(3, False) == 0, \"Kids under 5 are free\"","assert ticket_price(5, False) == 8, \"Age 5 costs 8\"","assert ticket_price(12, True) == 8, \"Age 12 costs 8, even for a student\"","assert ticket_price(70, False) == 9, \"Seniors (65 and up) pay 9\"","assert ticket_price(16, True) == 10, \"Students pay 10\"","assert ticket_price(16, False) == 14, \"Everyone else pays 14\"","assert ticket_price(65, True) == 9, \"65 counts as a senior\""],"solution":"def ticket_price(age, is_student):\n    if age < 5:\n        return 0\n    elif age <= 12:\n        return 8\n    elif age >= 65:\n        return 9\n    elif is_student:\n        return 10\n    else:\n        return 14","hint":"Use one `if`/`elif`/`else` chain. Check the age groups first, then `is_student`.","hints":["Use one `if`/`elif`/`else` chain. Check the age groups first, then `is_student`.","The order is: `age < 5`, then `age <= 12`, then `age >= 65`, then `is_student`, then `else`."],"visual":false,"unit":"py2"},{"id":"py2-e5","title":"Rock, paper, scissors","lang":"python","mins":14,"prompt":"<p>Write <code>winner(p1, p2)</code> where each move is <code>&quot;rock&quot;</code>, <code>&quot;paper&quot;</code> or <code>&quot;scissors&quot;</code>. Return <code>&quot;p1&quot;</code>, <code>&quot;p2&quot;</code> or <code>&quot;tie&quot;</code>.\nRock beats scissors, scissors beats paper, and paper beats rock.</p>\n","starter":"def winner(p1, p2):\n    if p1 == p2:\n        return \"tie\"\n    # when does p1 win?\n\n    return \"p2\"","tests":["assert winner(\"rock\", \"rock\") == \"tie\", \"Same move means a tie\"","assert winner(\"rock\", \"scissors\") == \"p1\", \"Rock beats scissors\"","assert winner(\"scissors\", \"paper\") == \"p1\", \"Scissors beat paper\"","assert winner(\"paper\", \"rock\") == \"p1\", \"Paper beats rock\"","assert winner(\"rock\", \"paper\") == \"p2\", \"Paper beats rock, so p2 wins\"","assert winner(\"paper\", \"scissors\") == \"p2\", \"Scissors beat paper, so p2 wins\""],"solution":"def winner(p1, p2):\n    if p1 == p2:\n        return \"tie\"\n    if (p1 == \"rock\" and p2 == \"scissors\") or (p1 == \"scissors\" and p2 == \"paper\") or (p1 == \"paper\" and p2 == \"rock\"):\n        return \"p1\"\n    return \"p2\"","hint":"p1 wins in exactly three cases. Join them with `or`, and use `and` inside each one.","hints":["p1 wins in exactly three cases. Join them with `or`, and use `and` inside each one.","`(p1 == \"rock\" and p2 == \"scissors\") or (...) or (...)`"],"visual":false,"unit":"py2"}],"fill":[{"q":"Fill in the blanks so this prints the right message for any temperature.","lang":"python","code":"temp = 72\n\u00000\u0000 temp > 85:\n    print(\"Hot\")\n\u00001\u0000 temp > 60\u00002\u0000\n    print(\"Nice\")\n\u00003\u0000:\n    print(\"Cold\")","why":"The chain is `if`, then `elif` for each extra condition, then `else`. Every line in the chain ends with a colon.","id":"py2-f1","kind":"fill","title":"if / elif / else syntax","blanks":[["if"],["elif"],[":"],["else"]]},{"q":"Fill in `and`, `or` or `not`.","lang":"python","code":"# True only if BOTH are true\ncan_drive = age >= 16 \u00000\u0000 has_license\n# True if EITHER day matches\nis_weekend = day == \"Sat\" \u00001\u0000 day == \"Sun\"\n# flips True and False\nis_closed = \u00002\u0000 is_open","why":"`and` needs both to be True, `or` needs at least one, and `not` flips the value.","id":"py2-f2","kind":"fill","title":"Logical operators","blanks":[["and"],["or"],["not"]]}],"quiz":[{"q":"What does `not (5 > 3 and 2 > 4)` evaluate to?","choices":["True","False","Error","None"],"a":0,"why":"`5 > 3` is True and `2 > 4` is False, so `True and False` is False, and `not False` is True.","id":"py2-q1","kind":"mcq","type":"quiz"},{"q":"What is the difference between `=` and `==`?","choices":["They are the same","`=` assigns a value; `==` checks if two values are equal","`==` assigns a value; `=` checks equality","`==` is only used with strings"],"a":1,"why":"A single `=` stores a value in a variable. A double `==` asks a True/False question.","id":"py2-q2","kind":"mcq","type":"quiz"},{"q":"`x = 15`. Which lines print?","choices":["A and B","Only A","Only B","A, B and C"],"a":1,"lang":"python","code":"if x > 10:\n    print(\"A\")\nelif x > 5:\n    print(\"B\")\nelse:\n    print(\"C\")","why":"Only the first true branch runs. Once `x > 10` is True, the `elif` and `else` are skipped.","id":"py2-q3","kind":"mcq","type":"quiz"},{"q":"Which value counts as **False** in an `if` statement?","choices":["`0`","`1`","`\"False\"`","`[0]`"],"a":0,"why":"`0` is falsy. The string `\"False\"` and the list `[0]` are not empty, so they count as True.","id":"py2-q4","kind":"mcq","type":"quiz"},{"q":"When does an `elif` block run?","choices":["Always, after the `if`","When the `if` condition is True","When every condition above it was False and its own condition is True","Only if there is no `else`"],"a":2,"why":"`elif` is checked only if every earlier condition failed, and it runs only if its own condition is True.","id":"py2-q5","kind":"mcq","type":"quiz"},{"q":"Which condition is True only when `age` is from 13 to 19, inclusive?","choices":["`13 <= age <= 19`","`age > 13 and age < 19`","`age >= 13 or age <= 19`","`13 < age < 19`"],"a":0,"why":"Chained `<=` includes both ends. Using `or` would be True for every age.","id":"py2x-q1","kind":"mcq","type":"quiz"},{"q":"`day = \"Sun\"`. What does `day == \"Sat\" or \"Sun\"` evaluate to, and why is it a bug?","choices":["False, because day isn't \"Sat\"","\"Sun\". The right side is just a non-empty string, which always counts as True","True, because Python checks day against both","Error"],"a":1,"why":"Python reads it as `(day == \"Sat\") or (\"Sun\")`. Write `day == \"Sat\" or day == \"Sun\"` (or `day in (\"Sat\", \"Sun\")`).","id":"py2x-q2","kind":"mcq","type":"quiz"},{"q":"What does `label = \"pass\" if 65 >= 70 else \"retry\"` store?","choices":["\"pass\"","\"retry\"","True","None"],"a":1,"why":"The condition is False, so the conditional expression gives the value after `else`.","id":"py2x-q3","kind":"mcq","type":"quiz"},{"q":"In `if a and b:`, when is `b` **not** checked at all?","choices":["When `a` is False","When `a` is True","When `b` is False","It's always checked"],"a":0,"why":"Short-circuiting: if `a` is False, `and` is already False, so Python skips `b`.","id":"py2x-q4","kind":"mcq","type":"quiz"},{"q":"Which line correctly checks whether `ch` is a vowel?","choices":["`if ch == \"a\" or \"e\" or \"i\" or \"o\" or \"u\":`","`if ch in \"aeiou\":`","`if ch == \"aeiou\":`","`if \"aeiou\" in ch == True:`"],"a":1,"why":"`in` checks membership. The first option is always True because non-empty strings count as True.","id":"py2x-q5","kind":"mcq","type":"quiz"},{"q":"Which kind of value is `True`?","choices":["str","int","bool","None"],"a":2,"why":"`True` and `False` are the two **boolean** (`bool`) values.","id":"py2x-q6","kind":"mcq","type":"quiz"}],"trace":[{"q":"What does this print?","choices":["A","B","C","B C"],"a":1,"lang":"python","code":"score = 85\nif score >= 90:\n    grade = \"A\"\nelif score >= 80:\n    grade = \"B\"\nelif score >= 70:\n    grade = \"C\"\nelse:\n    grade = \"F\"\nprint(grade)","why":"85 is not ≥ 90, but it is ≥ 80, so grade becomes \"B\" and the rest of the chain is skipped.","id":"py2-t1","kind":"mcq","type":"trace"},{"q":"What does this print?","choices":["yes, then both, then done","yes, then done","both, then done","done"],"a":1,"lang":"python","code":"a = 4\nb = 9\nif a > 3 or b < 5:\n    print(\"yes\")\nif a > 3 and b < 5:\n    print(\"both\")\nprint(\"done\")","why":"The first `if` is True because `a > 3`. The second is False because `b < 5` is False. These are two separate `if`s, so both are checked.","id":"py2-t2","kind":"mcq","type":"trace"},{"q":"What does this print?","choices":["A","A, then B","A, then B, then C","B"],"a":1,"lang":"python","code":"x = 15\nif x > 10:\n    print(\"A\")\nif x > 5:\n    print(\"B\")\nelse:\n    print(\"C\")","why":"These are two **separate** if statements, so both are checked. 15 > 10 prints A, and 15 > 5 prints B, so the else is skipped.","id":"py2x-t1","kind":"mcq","type":"trace"},{"q":"What does this print?","choices":["Warm rain","Beach day","Stay in","Beach day, then Stay in"],"a":1,"lang":"python","code":"temp = 30\nraining = False\nif temp > 25:\n    if raining:\n        print(\"Warm rain\")\n    else:\n        print(\"Beach day\")\nelse:\n    print(\"Stay in\")","why":"The outer condition is True. Inside it, `raining` is False, so the inner `else` runs.","id":"py2x-t2","kind":"mcq","type":"trace"},{"q":"What does this print?","choices":["BAC","BBC","ABC","CCC"],"a":0,"lang":"python","code":"def grade(s):\n    if s >= 90:\n        return \"A\"\n    if s >= 80:\n        return \"B\"\n    return \"C\"\n\nprint(grade(85) + grade(92) + grade(40))","why":"85 gives \"B\", 92 gives \"A\" and 40 gives \"C\", so it prints BAC. `return` exits the function as soon as a branch matches.","id":"py2x-t3","kind":"mcq","type":"trace"}],"bug":[{"q":"This program has a syntax error. Click the broken line.","lang":"python","code":"temp = 75\nif temp > 80:\n    print(\"Hot\")\nelif temp > 60\n    print(\"Nice\")\nelse:\n    print(\"Cold\")","lines":[4],"fix":"elif temp > 60:","why":"Every `if`, `elif` and `else` line must end with a colon.","id":"py2-b1","kind":"bug","type":"bug"},{"q":"A 95 prints \"C\" instead of \"A\". Click the line where the order goes wrong.","lang":"python","code":"score = 95\nif score >= 70:\n    print(\"C\")\nelif score >= 80:\n    print(\"B\")\nelif score >= 90:\n    print(\"A\")","lines":[2],"fix":"if score >= 90:   (check the highest grade first, then 80, then 70)","why":"The first True condition wins, and 95 >= 70 is True. Check from highest to lowest.","id":"py2x-b1","kind":"bug","type":"bug"},{"q":"This should print \"Weekend!\" only on Saturday or Sunday, but it prints it every day. Click the bug.","lang":"python","code":"day = \"Monday\"\nif day == \"Saturday\" or \"Sunday\":\n    print(\"Weekend!\")","lines":[2],"fix":"if day == \"Saturday\" or day == \"Sunday\":","why":"`\"Sunday\"` on its own is a non-empty string, which always counts as True. Write the full comparison on both sides of `or`.","id":"py2x-b2","kind":"bug","type":"bug"},{"q":"This crashes with a SyntaxError. Click the broken line.","lang":"python","code":"password = input(\"Password: \")\nif password = \"hunter2\":\n    print(\"Welcome\")\nelse:\n    print(\"Wrong password\")","lines":[2],"fix":"if password == \"hunter2\":","why":"Use `==` to compare. A single `=` stores a value, and that isn't allowed in an `if` condition.","id":"py2x-b3","kind":"bug","type":"bug"}]},{"id":"py3","title":"Loops","lessons":[{"title":"for loops, while loops and range","mins":10,"html":"<p>Loops repeat code so you don&#39;t have to copy and paste it.</p>\n<h3>for loops</h3>\n<p>Use a <code>for</code> loop when you know <strong>how many times</strong> to repeat, or when you want to go through each item in a collection.</p>\n<pre><code class=\"language-python-run\">for i in range(5):        # 0, 1, 2, 3, 4\n    print(i)\n\nfor letter in &quot;code&quot;:     # c, o, d, e\n    print(letter)\n</code></pre>\n<p><code>range(start, stop, step)</code> <strong>stops before</strong> <code>stop</code>:</p>\n<ul>\n<li><code>range(5)</code> gives 0 1 2 3 4</li>\n<li><code>range(2, 10, 3)</code> gives 2 5 8</li>\n<li><code>range(5, 0, -1)</code> gives 5 4 3 2 1</li>\n</ul>\n<h3>while loops</h3>\n<p>Use a <code>while</code> loop to repeat <strong>as long as a condition is true</strong>:</p>\n<pre><code class=\"language-python-run\">lives = 3\nwhile lives &gt; 0:\n    print(&quot;Playing...&quot;)\n    lives -= 1            # without this, the loop never ends!\n</code></pre>\n<h3>The accumulator pattern</h3>\n<pre><code class=\"language-python-run\">total = 0\nfor n in range(1, 11):\n    total += n            # same as total = total + n\nprint(total)              # 55\n</code></pre>\n<ul>\n<li><code>break</code> exits the loop immediately.</li>\n<li><code>continue</code> skips to the next iteration.</li>\n</ul>\n","text":"Loops repeat code so you don't have to copy and paste it. for loops Use a for loop when you know how many times to repeat, or when you want to go through each item in a collection. python run for i in range(5): 0, 1, 2, 3, 4 print(i) for letter in \"code\": c, o, d, e print(letter) range(start, stop, step) stops before stop : range(5) gives 0 1 2 3 4 range(2, 10, 3) gives 2 5 8 range(5, 0, 1) gives 5 4 3 2 1 while loops Use a while loop to repeat as long as a condition is true : python run lives = 3 while lives 0: print(\"Playing...\") lives = 1 without this, the loop never ends! The accumulator pattern python run total = 0 for n in range(1, 11): total += n same as total = total + n print(total) 55 break exits the loop immediately. continue skips to the next iteration.","quizzes":[]}],"ex":[{"id":"py3-e1","title":"Sum to n","lang":"python","mins":10,"prompt":"<p>Write <code>sum_to(n)</code> that uses a <strong>loop</strong> to add up <code>1 + 2 + ... + n</code> and returns the total. <code>sum_to(0)</code> should return <code>0</code>.</p>\n","starter":"def sum_to(n):\n    total = 0\n    # loop here\n    return total","tests":["assert sum_to(10) == 55, \"sum_to(10) should be 55\"","assert sum_to(1) == 1, \"sum_to(1) should be 1\"","assert sum_to(0) == 0, \"sum_to(0) should be 0\"","assert sum_to(100) == 5050, \"sum_to(100) should be 5050\""],"solution":"def sum_to(n):\n    total = 0\n    for i in range(1, n + 1):\n        total += i\n    return total","hint":"`range(1, n + 1)` includes n.","hints":["`range(1, n + 1)` includes n."],"visual":false,"unit":"py3"},{"id":"py3-e2","title":"FizzBuzz","lang":"python","mins":12,"prompt":"<p>Print the numbers from 1 to 15, one per line, with three exceptions:</p>\n<ul>\n<li>For multiples of 3, print <code>Fizz</code> instead.</li>\n<li>For multiples of 5, print <code>Buzz</code> instead.</li>\n<li>For multiples of both, print <code>FizzBuzz</code> instead.</li>\n</ul>\n","starter":"for i in range(1, 16):\n    print(i)","tests":["assert len(__out.split()) == 15, \"Print exactly 15 lines\"","assert __out.split()[0] == \"1\", \"Line 1 should be 1\"","assert __out.split()[2] == \"Fizz\", \"Line 3 should be Fizz\"","assert __out.split()[4] == \"Buzz\", \"Line 5 should be Buzz\"","assert __out.split()[14] == \"FizzBuzz\", \"Line 15 should be FizzBuzz\""],"solution":"for i in range(1, 16):\n    if i % 15 == 0:\n        print(\"FizzBuzz\")\n    elif i % 3 == 0:\n        print(\"Fizz\")\n    elif i % 5 == 0:\n        print(\"Buzz\")\n    else:\n        print(i)","hint":"Check the \"both\" case (`i % 15 == 0`) first.","hints":["Check the \"both\" case (`i % 15 == 0`) first."],"visual":false,"unit":"py3"},{"id":"py3-e3","title":"Count the passing scores","lang":"python","mins":10,"prompt":"<p><strong>Loops + if:</strong> write <code>count_passing(scores)</code> that returns how many scores are <strong>70 or higher</strong>.</p>\n","starter":"def count_passing(scores):\n    count = 0\n    for s in scores:\n        pass  # use an if statement here\n    return count","tests":["assert count_passing([90, 65, 70, 40]) == 2, \"90 and 70 pass, so the answer is 2\"","assert count_passing([]) == 0, \"An empty list gives 0\"","assert count_passing([69, 69]) == 0, \"69 isn't passing\"","assert count_passing([100, 100, 100]) == 3, \"All three pass\""],"solution":"def count_passing(scores):\n    count = 0\n    for s in scores:\n        if s >= 70:\n            count += 1\n    return count","hint":"Inside the loop, write `if s >= 70:` and add 1 to `count`.","hints":["Inside the loop, write `if s >= 70:` and add 1 to `count`."],"visual":false,"unit":"py3"}],"fill":[],"quiz":[{"q":"What numbers does `range(2, 10, 3)` produce?","choices":["2, 5, 8, 11","2, 5, 8","2, 3, 4, ..., 10","3, 6, 9"],"a":1,"why":"It starts at 2 and adds 3 each time (2, 5, 8). It stops *before* reaching 10.","id":"py3-q1","kind":"mcq","type":"quiz"},{"q":"How many times does the body of `for i in range(5):` run?","choices":["4","5","6","It depends"],"a":1,"why":"`range(5)` gives 0, 1, 2, 3, 4, which is five values.","id":"py3-q2","kind":"mcq","type":"quiz"},{"q":"What does `break` do inside a loop?","choices":["Skips the rest of this iteration only","Exits the loop completely","Restarts the loop","Stops the whole program"],"a":1,"why":"`break` jumps out of the loop. `continue` is the one that skips to the next iteration.","id":"py3-q3","kind":"mcq","type":"quiz"},{"q":"What is the biggest risk with a `while` loop?","choices":["It can only run once","It can run forever if the condition never becomes False","It can't use variables","It is slower than a for loop"],"a":1,"why":"If nothing inside the loop changes the condition, you get an **infinite loop**.","id":"py3-q4","kind":"mcq","type":"quiz"},{"q":"What does `range(5, 0, -1)` produce?","choices":["5, 4, 3, 2, 1","5, 4, 3, 2, 1, 0","0, 1, 2, 3, 4, 5"
